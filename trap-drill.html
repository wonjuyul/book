<title>기출 함정 드릴</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EFEEE9; --surface:#F8F7F3; --surface-2:#E8E6DF;
  --ink:#1B1A17; --ink-2:#54514A; --ink-3:#8A8578;
  --rule:#D8D5CB; --rule-2:#C4C0B3;
  --seal:#A8382C; --seal-soft:rgba(168,56,44,.09); --seal-line:rgba(168,56,44,.36);
  --right:#3A6E4B; --right-soft:rgba(58,110,75,.10); --right-line:rgba(58,110,75,.38);
  --grid:rgba(27,26,23,.05);
  --shadow:0 1px 2px rgba(27,26,23,.05), 0 10px 28px rgba(27,26,23,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#171612; --surface:#201E19; --surface-2:#2A2822;
  --ink:#EDEAE1; --ink-2:#B4AFA2; --ink-3:#847F72;
  --rule:#35322A; --rule-2:#474338;
  --seal:#DF7A63; --seal-soft:rgba(223,122,99,.13); --seal-line:rgba(223,122,99,.44);
  --right:#7DBE92; --right-soft:rgba(125,190,146,.13); --right-line:rgba(125,190,146,.44);
  --grid:rgba(237,234,225,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#171612; --surface:#201E19; --surface-2:#2A2822;
  --ink:#EDEAE1; --ink-2:#B4AFA2; --ink-3:#847F72;
  --rule:#35322A; --rule-2:#474338;
  --seal:#DF7A63; --seal-soft:rgba(223,122,99,.13); --seal-line:rgba(223,122,99,.44);
  --right:#7DBE92; --right-soft:rgba(125,190,146,.13); --right-line:rgba(125,190,146,.44);
  --grid:rgba(237,234,225,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; color:var(--ink);
  background:repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 30px),var(--paper);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--seal); outline-offset:3px; border-radius:3px}
.wrap{max-width:42rem; margin:0 auto; padding:0 1.15rem 4rem}

/* ── 머리 ─────────────────────────────────────────────────────── */
.top{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule)}
.rail{height:2px; background:var(--rule); position:relative}
.rail i{position:absolute; inset:0 auto 0 0; width:0; background:var(--seal); transition:width .25s}
.top .row{max-width:42rem; margin:0 auto; padding:.62rem 1.15rem; display:flex; align-items:center; gap:.75rem}
.top h1{margin:0; font-family:"Gowun Batang",serif; font-weight:700; font-size:1.02rem; white-space:nowrap}
.top h1 .seal{display:inline-block; margin-right:.42rem; padding:.1em .3em .15em; background:var(--seal); color:var(--paper); border-radius:2px; font-size:.76em; vertical-align:.08em}
.meter{display:flex; gap:.7rem; margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.72rem; font-variant-numeric:tabular-nums; align-items:baseline}
.meter .n{color:var(--ink-3)}
.meter .st{color:var(--seal); font-weight:500}
.meter .st.cool{color:var(--ink-3); font-weight:400}
.quit{font:inherit; font-size:.7rem; background:none; border:1px solid var(--rule-2); color:var(--ink-3); padding:.22rem .44rem; border-radius:2px; cursor:pointer}
.quit:hover{border-color:var(--seal-line); color:var(--seal)}

/* ── 시작 ─────────────────────────────────────────────────────── */
.lede{font-family:"Gowun Batang",serif; font-size:1.26rem; line-height:1.6; margin:2.2rem 0 .55rem; text-wrap:pretty}
.sub{font-size:.85rem; line-height:1.72; color:var(--ink-2); margin:0 0 1.8rem; text-wrap:pretty}
.sechead{display:flex; align-items:baseline; gap:.55rem; margin:1.7rem 0 .7rem; font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3)}
.sechead::after{content:""; flex:1; height:1px; background:var(--rule)}
.sechead .note{text-transform:none; letter-spacing:.02em; font-family:inherit; font-size:.7rem}
.opts{display:flex; flex-wrap:wrap; gap:.35rem}
.opt{font:inherit; font-size:.79rem; padding:.42rem .62rem; cursor:pointer; border-radius:2px; text-align:left;
  background:var(--surface); border:1px solid var(--rule-2); color:var(--ink-2); transition:background .12s,border-color .12s,color .12s}
.opt:hover{border-color:var(--ink-3); color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.opt .n{font-family:"IBM Plex Mono",monospace; font-size:.67rem; opacity:.7; margin-left:.4rem}
.opt small{display:block; font-size:.68rem; opacity:.72; margin-top:.14rem}
.tags{display:grid; grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr)); gap:.28rem}
.tag{font:inherit; font-size:.78rem; padding:.38rem .52rem; cursor:pointer; border-radius:2px; display:flex; align-items:center; gap:.4rem;
  background:var(--surface); border:1px solid var(--rule); color:var(--ink-2); text-align:left}
.tag:hover{border-color:var(--rule-2); color:var(--ink)}
.tag[aria-pressed="true"]{background:var(--seal-soft); border-color:var(--seal-line); color:var(--ink)}
.tag .nm{font-family:"Gowun Batang",serif; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tag .n{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.65rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.morebtn{font:inherit; font-size:.75rem; margin-top:.5rem; background:none; border:0; cursor:pointer; color:var(--seal); text-decoration:underline; text-underline-offset:3px; padding:.3rem 0}
.startbar{margin-top:2.2rem; padding-top:1rem; border-top:1px solid var(--rule); display:flex; align-items:center; gap:.9rem; flex-wrap:wrap}
.start{font:inherit; font-family:"Gowun Batang",serif; font-weight:700; font-size:1rem; padding:.7rem 1.5rem; cursor:pointer; border-radius:2px; background:var(--ink); color:var(--paper); border:1px solid var(--ink)}
.start:hover{background:var(--seal); border-color:var(--seal)}
.start:disabled{opacity:.34; cursor:not-allowed}
.startbar .tally{font-size:.79rem; color:var(--ink-2)}
.startbar .tally b{font-family:"IBM Plex Mono",monospace; color:var(--ink); font-weight:500}
</style>
<style>
/* ── 드릴 ─────────────────────────────────────────────────────── */
.card{min-height:calc(100dvh - 12rem); display:flex; flex-direction:column; justify-content:center; padding:1.4rem 0}
.qmeta{display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; margin-bottom:1rem}
.pill{font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.08em; padding:.2rem .38rem; border:1px solid var(--rule-2); color:var(--ink-3); border-radius:2px}
.pill.tag{border-color:var(--ink-3); color:var(--ink-2)}
.claim{
  font-family:"Gowun Batang",serif; font-size:1.5rem; line-height:1.62; text-wrap:pretty;
  margin:0 0 1.7rem; padding-left:.95rem; border-left:3px solid var(--ink);
}
.paddles{display:grid; grid-template-columns:1fr 1fr; gap:.6rem}
.paddle{
  position:relative; font:inherit; cursor:pointer; padding:1.5rem .8rem 1.15rem; border-radius:3px;
  background:var(--surface); border:1px solid var(--rule-2); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:.42rem; transition:border-color .12s, background .12s;
}
.paddle:hover:not(:disabled){border-color:var(--ink-3)}
.paddle:disabled{cursor:default}
.paddle svg{width:2.5rem; height:2.5rem; overflow:visible}
.paddle svg *{fill:none; stroke:var(--ink-2); stroke-width:2.4; stroke-linecap:round}
.paddle .lab{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.1em; color:var(--ink-3)}
.paddle .key{font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--ink-3); opacity:.75}
.paddle.picked.ok{border-color:var(--right-line); background:var(--right-soft)}
.paddle.picked.no{border-color:var(--seal-line); background:var(--seal-soft)}
.paddle.truth{border-color:var(--right-line)}
.paddle.picked.ok svg *{stroke:var(--right)}
.paddle.picked.no svg *{stroke:var(--seal)}
.paddle.truth:not(.picked) svg *{stroke:var(--right); opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .paddle.picked svg *{stroke-dasharray:120; stroke-dashoffset:120; animation:ink .38s ease-out forwards}
}
@keyframes ink{to{stroke-dashoffset:0}}

.verdict{margin-top:1.5rem; border-top:2px solid var(--ink); padding-top:.9rem}
.vhead{display:flex; align-items:center; gap:.5rem; font-family:"Gowun Batang",serif; font-weight:700; font-size:1rem; margin-bottom:.5rem}
.vhead.o{color:var(--right)} .vhead.x{color:var(--seal)}
.vhead .src{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:400; color:var(--ink-3); letter-spacing:.02em}
.why{font-size:.9rem; line-height:1.74; color:var(--ink-2); margin:0; text-wrap:pretty}
.nextrow{display:flex; align-items:center; gap:.8rem; margin-top:1.15rem; flex-wrap:wrap}
.next{position:relative; overflow:hidden; font:inherit; font-family:"Gowun Batang",serif; font-weight:700; font-size:.92rem;
  padding:.6rem 1.25rem; cursor:pointer; border-radius:2px; background:var(--ink); color:var(--paper); border:1px solid var(--ink)}
.next:hover{background:var(--seal); border-color:var(--seal)}
.next i{position:absolute; left:0; bottom:0; height:2px; background:var(--paper); opacity:.6; width:0}
.hint{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--ink-3)}

/* ── 결과 ─────────────────────────────────────────────────────── */
.rtop{display:flex; align-items:center; gap:1.5rem; margin:2.2rem 0 .4rem; flex-wrap:wrap}
.ring{position:relative; width:7rem; height:7rem; flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:6}
.ring .bg{stroke:var(--rule)}
.ring .fg{stroke:var(--seal); stroke-linecap:round; transition:stroke-dashoffset .8s ease-out}
.ring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.ring .num b{font-size:1.7rem; font-weight:500; line-height:1}
.ring .num span{font-size:.64rem; color:var(--ink-3); margin-top:.22rem; letter-spacing:.08em}
.rtop .said{font-family:"Gowun Batang",serif; font-size:1.16rem; line-height:1.58; flex:1 1 13rem; text-wrap:pretty}
.stats{display:flex; gap:1.4rem; flex-wrap:wrap; margin-top:.9rem; font-size:.8rem; color:var(--ink-2)}
.stats b{font-family:"IBM Plex Mono",monospace; color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
.misses{display:flex; flex-direction:column; gap:.5rem}
.miss{padding:.7rem .85rem; background:var(--surface); border:1px solid var(--rule); border-left:2px solid var(--seal); border-radius:2px}
.miss .q{font-family:"Gowun Batang",serif; font-weight:700; font-size:.92rem; margin-bottom:.26rem; text-wrap:pretty}
.miss .a{font-size:.78rem; line-height:1.64; color:var(--ink-2)}
.miss .a .badge{font-family:"IBM Plex Mono",monospace; font-size:.62rem; padding:.06rem .26rem; border:1px solid var(--rule-2); border-radius:2px; margin-right:.35rem}
.miss .a b{color:var(--right); font-weight:500}
.again{display:flex; gap:.55rem; flex-wrap:wrap; margin-top:1.5rem}
.again button{font:inherit; font-size:.87rem; font-family:"Gowun Batang",serif; font-weight:700; padding:.58rem 1.1rem; cursor:pointer; border-radius:2px; background:var(--surface); border:1px solid var(--rule-2); color:var(--ink)}
.again button.primary{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.again button:hover{border-color:var(--seal); color:var(--seal)}
.again button.primary:hover{background:var(--seal); color:var(--paper)}
.footnote{margin-top:2.4rem; padding-top:1rem; border-top:1px solid var(--rule); font-size:.74rem; line-height:1.72; color:var(--ink-3)}
.footnote a{color:var(--seal)}
.hidden{display:none !important}
@media (max-width:560px){
  .claim{font-size:1.24rem} .lede{font-size:1.12rem}
  .card{min-height:calc(100dvh - 10rem)}
  .paddle{padding:1.15rem .6rem .9rem} .paddle svg{width:2.1rem; height:2.1rem}
  .tags{grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important; animation-duration:.01ms !important}}
</style>

<header class="top">
  <div class="rail"><i id="rail"></i></div>
  <div class="row">
    <h1><span class="seal">陷</span>기출 함정 드릴</h1>
    <div class="meter" id="meter"></div>
    <button type="button" class="quit hidden" id="quit">그만</button>
  </div>
</header>

<main class="wrap">
  <section id="setup"></section>
  <section id="play" class="hidden"></section>
  <section id="result" class="hidden"></section>
</main>

<script>
/* 선지는 원문 「⚠ 함정·주의」의 서술을 평가원 선지 형태로 옮긴 것이다.
   a: 1 = 맞는 선지(O) / 0 = 틀린 선지(X) */
const ITEMS = [
/* ── 대단원 Ⅰ ──────────────────────────────────────────────────── */
{u:1,t:'윤리학의 4분법',s:'도덕 현상의 인과 관계를 기술하는 것은 실천윤리학의 목적이다.',a:0,f:'기술윤리학의 목적이다. 실천윤리학은 구체적 도덕 문제의 해결을 목적으로 한다.',src:'2022 9평'},
{u:1,t:'윤리학의 4분법',s:'메타윤리학은 도덕적 언어의 의미와 도덕 추론의 논리적 정당성을 분석한다.',a:1,f:'맞다. 선지에 「분석」이라는 용어가 보이면 메타윤리학일 가능성이 크다.',src:'2025 9평'},
{u:1,t:'윤리학의 4분법',s:'이론윤리학과 실천윤리학은 모두 보편적 도덕 원리를 정립하고자 한다.',a:1,f:'맞다. 둘 다 규범윤리학이고, 둘 다 구체적 도덕 문제 해결에 관여하며, 둘 다 보편적 원리를 세우려 한다.'},
{u:1,t:'동양 윤리 총론',s:'진인(眞人)은 노자와 장자가 함께 쓰는 용어다.',a:0,f:'장자에만 나오는 용어다.',src:'2023 9평'},
{u:1,t:'유교',s:'수기안인(修己安人)에서는 「안인」이 「수기」보다 먼저다.',a:0,f:'「수기」가 먼저다. 그리고 수기의 근본은 효(孝)다.',src:'2024 수능'},
{u:1,t:'유교',s:'견리사의(見利思義)는 이익 추구 자체를 금지하라는 뜻이다.',a:0,f:'이익 추구를 금지하는 것이 아니라, 이익 추구가 도덕성에 부합해야 한다는 뜻이다.',src:'2026 수능·6평'},
{u:1,t:'맹자',s:'사단(四端)은 실천을 통해서만 비로소 생겨난다.',a:0,f:'사단은 선천적이며 자연적으로 표출된다. 수양은 사단을 사덕으로 확충하는 일이다.',src:'2025 수능'},
{u:1,t:'맹자',s:'항산(恒産)이 없으면 군자도 항심(恒心)을 유지할 수 없다.',a:0,f:'항산·항심은 백성에게 적용되는 말이다. 선비·군자는 항산 없이도 항심을 유지할 수 있다.',src:'2024 6평·2026 6평'},
{u:1,t:'맹자',s:'인의예지(仁義禮智)는 공자가 처음 제시한 용어다.',a:0,f:'오직 맹자에만 나오는 용어다.',src:'2024 6평'},
{u:1,t:'불교',s:'불교는 변하지 않는 자아의 존재를 인정한다.',a:0,f:'제법무아(諸法無我)에 위배된다. 「고정불변의 실체」·「변하지 않는 자아」는 불교 최다 반복 함정이다.',src:'2023 수능'},
{u:1,t:'불교',s:'모든 집착은 무명(無明)에서 비롯되며 고통의 원인이다.',a:1,f:'맞다. 집착은 사성제 중 집제(集諦)에 해당한다.',src:'2023 6평'},
{u:1,t:'불교',s:'「차별하는 마음을 버려야 진리를 깨달을 수 있다」는 노자에만 해당한다.',a:0,f:'불교에도 해당한다. 깨달음은 언어를 초월한 경지이고 모든 시비선악 구분은 언어로 하는 것이기 때문이다.',src:'2024 9평'},
{u:1,t:'도가',s:'「도덕」·「규범」 같은 용어는 도가의 입장에 부합한다.',a:0,f:'무조건 부합하지 않는다. 단 「도와 덕」이라는 표현만은 도가·유교가 공유한다(내용은 다르다).',src:'2026 9평'},
{u:1,t:'장자',s:'심재(心齋)·좌망(坐忘)·제물(齊物)은 장자의 고유 용어다.',a:1,f:'맞다. 평가원은 이 용어만으로 장자를 식별하게 하고 출제한다.',src:'2023 수능·2026 9평'},
{u:1,t:'장자',s:'장자도 천명(天命)을 말한다.',a:0,f:'천명은 유교 용어다. 장자의 「명(命)」은 저절로 일어나는 일이지 하늘의 명령이 아니다.',src:'2023 9평'},
{u:1,t:'도가',s:'맹자·노자·장자 모두 인간 본성을 긍정적으로 보지만, 노자·장자의 긍정은 가치평가 이전의 자연성이다.',a:1,f:'맞다. 맹자는 「선하다」는 가치평가이고, 노자·장자는 가치평가 이전의 자연성·순수성이다.',src:'2025 수능·9평'},
{u:1,t:'묵자',s:'묵자가 공격 전쟁에 반대하는 근거는 평화다.',a:0,f:'이익·손해 계산이다. 묵자는 정(征)·주(誅)를 인정하되 그것을 「평화를 위한 것」이라 말하지 않는다.',src:'2025 6평'},
{u:1,t:'묵자',s:'묵자에게 의(義)는 이(利)보다 우선한다.',a:0,f:'묵자에게 의와 이의 우열은 없다 — 「의로움 = 천하의 이익을 도모하는 능력」이다. 의를 이에 우선시하는 쪽은 맹자다.',src:'2025 6평'},
{u:1,t:'한비자',s:'한비자는 손익계산에 긍정적이므로 공리주의자로 분류된다.',a:0,f:'사회 전체가 아니라 자신만의 이익을 위하는 경우가 대부분이므로 공리주의라 하지 않는다. 묵가와 구별해야 한다.'},
{u:1,t:'아퀴나스',s:'「선을 추구하고 악을 피하라」는 자연법의 제1원리는 홉스의 것이다.',a:0,f:'아퀴나스다. 홉스는 「평화를 추구하라」는 제1 자연법이라는 다른 표현을 쓴다.',src:'2024 수능'},
{u:1,t:'칸트',s:'의무로부터의 행위는 반드시 의무에 부합하는 행위다.',a:1,f:'맞다. 다만 그 역(의무에 부합하는 행위가 반드시 의무로부터의 행위)은 성립하지 않는다.',src:'2022 6평·2024 9평·2026 6평'},
{u:1,t:'칸트',s:'의무에 부합하는 행위는 반드시 의무로부터의 행위다.',a:0,f:'성립하지 않는다. 합법성(의무에 부합)과 도덕성(의무로부터)의 구분이 칸트 최다 반복 함정이다.',src:'2022 6평·2024 9평·2026 6평'},
{u:1,t:'칸트',s:'칸트에서 보편화되어야 하는 것은 행위나 의지가 아니라 준칙이다.',a:1,f:'맞다. 그것도 사고실험에서만 검토한다. 거짓 약속의 준칙은 보편화 시 자기모순에 빠진다.',src:'2023 6평'},
{u:1,t:'칸트',s:'칸트에게 「의무」는 신·천사를 포함한 모든 이성적 존재자에게 성립한다.',a:0,f:'자연적 경향성을 가진 인간에게만 성립한다. 정념이 없는 신·천사는 필연적으로 도덕법칙대로 행위한다.',src:'2024 9평'},
{u:1,t:'칸트',s:'칸트는 모든 감정을 도덕적 동기에서 배제한다.',a:0,f:'도덕법칙에 대한 존경심은 이성적·능동적 감정으로 도덕적 동기로 인정된다.',src:'2021 6평'},
{u:1,t:'벤담',s:'벤담은 모든 쾌락과 고통이 양적으로 계산 가능하다고 본다.',a:1,f:'맞다. 교육과정상 벤담은 질적 차이를 인정하지 않는 것으로 간주한다.',src:'2025 9평'},
{u:1,t:'벤담',s:'벤담은 쾌락의 질적 차이를 인정한다.',a:0,f:'질적 차이를 인정하는 쪽은 밀이다.',src:'2023 9평·2025 9평·2026 6평'},
{u:1,t:'벤담',s:'고통의 최소화를 추구하는 것은 벤담의 입장에 부합한다.',a:1,f:'맞다. 「고통의 부재 = 쾌락」이므로 고통의 최소화도 벤담에 부합한다.',src:'2022 수능'},
{u:1,t:'공리주의',s:'타인의 이익에 더 큰 가중치를 두는 것은 이익 평등 고려 원칙에 부합한다.',a:0,f:'원칙에 반한다. 「한 사람은 오직 한 사람으로만 계산」한다.',src:'2023 9평'},
{u:1,t:'벤담',s:'벤담은 입법의 원리와 도덕의 원리를 모두 유용성 원리로 삼는다.',a:1,f:'맞다. 저서 『도덕과 입법의 원리에 대한 서론』이 그 근거다.',src:'2026 수능'},
{u:1,t:'아리스토텔레스',s:'중용은 정념이 제거된 상태다.',a:0,f:'이성에 의해 조절된 정념 또는 행위다. 용기는 두려움이 없는 것이 아니라 적절한 두려움이다.',src:'2023 수능'},
{u:1,t:'아리스토텔레스',s:'중용은 선과 악 사이의 중간이다.',a:0,f:'두 악덕(과도와 부족) 사이의 중간이지 선과 악의 중간이 아니다.',src:'2023 수능'},
{u:1,t:'아리스토텔레스',s:'덕은 「상태」이고 행복은 「활동」이다.',a:1,f:'맞다. 이 용어 구분이 그대로 선지가 된다. 덕을 소유만 하고 활동하지 않으면 목적을 달성할 수 없다.'},
{u:1,t:'매킨타이어',s:'매킨타이어에게 덕은 타고나는 것이다.',a:0,f:'덕은 사회적 실천(관행)에 내재하는 선을 이루는 데 필요한 성품이며 「습득」하는 것이다.',src:'2026 수능(정답률 40.5%)'},
{u:1,t:'매킨타이어',s:'자아정체성은 스스로 선택하는 것이다.',a:0,f:'「주어지는 것」이고 「발견하는 것」이지 선택하는 것이 아니다.',src:'2024 6평'},
{u:1,t:'매킨타이어',s:'모든 공동체에 적용 가능한 행위만 습관화해야 한다.',a:0,f:'맥락적 사고에 어긋난다. 공동체마다 덕목이 다를 수 있다.',src:'2026 9평'},
{u:1,t:'매킨타이어',s:'매킨타이어가 칸트에게 제기한 비판은 「사회적·역사적 맥락을 간과했다」는 것이다.',a:1,f:'맞다. 벤담에게는 「공동체는 개인의 단순 집합이 아니다」라고 비판한다.',src:'2021 9평'},
{u:1,t:'덕윤리',s:'덕윤리는 행위 윤리이고 공리주의·의무론은 행위자 윤리다.',a:0,f:'정반대다. 덕윤리가 행위자 윤리, 공리주의·의무론이 행위 윤리다.',src:'2021 수능'},
/* ── 대단원 Ⅱ ──────────────────────────────────────────────────── */
{u:2,t:'죽음관',s:'「죽음은 마땅히 애도해야 하는 일」은 유교와 도가의 공통 입장이다.',a:0,f:'「자연의 과정으로 본다」가 공통이고, 「마땅히 애도해야 한다」는 유교다. 장자는 애도 자체를 부정한다.',src:'2021 9평'},
{u:2,t:'죽음관',s:'평가원은 「삶과 죽음은 기가 모이고 흩어지는 연속적 과정」을 장자의 입장으로 다룬다.',a:1,f:'맞다. 원래는 유교·도가 공통이지만 평가원은 장자 입장에만 해당한다고 처리한다 — 평가원 입장대로 암기.',src:'2022 9평'},
{u:2,t:'불교',s:'윤회는 인간에게만 적용된다.',a:0,f:'모든 중생에 적용된다.',src:'2025 9평'},
{u:2,t:'에피쿠로스',s:'에피쿠로스는 현세의 삶이 사후에 영향을 준다고 본다.',a:0,f:'원자론자이므로 선의 본질이 사후에 드러난다거나 현세가 사후에 영향을 준다는 관념을 부정한다.',src:'2021 6평'},
{u:2,t:'에피쿠로스',s:'죽음 이후 원자는 완전히 사라진다.',a:0,f:'감각기관이 사라질 뿐 원자는 흩어질 뿐이다.',src:'2025 6평'},
{u:2,t:'플라톤',s:'플라톤에게 죽음은 두려워할 까닭이 없는 것을 넘어 오히려 행복해해야 할 일이다.',a:1,f:'맞다. 죽음은 영혼이 육체라는 감옥에서 해방되어 이데아계로 귀환하는 사건이다.',src:'2023 수능'},
{u:2,t:'장자',s:'장자에게 죽음은 기가 모이고 흩어지는 과정에서 「벗어나는 것」이다.',a:0,f:'벗어나는 것이 아니라 그 과정 그 자체다.',src:'2026 6평'},
{u:2,t:'장자',s:'장자에게 삶과 죽음은 순리이므로 거부할 수 있는 것이 아니다.',a:1,f:'맞다. 「도덕을 실천」 역시 장자의 입장이 아니다. 장자 제시문에 인의예지(유교)·윤회업보(불교)를 섞는 것이 단골 오답이다.',src:'2024 9평'},
{u:2,t:'칸트',s:'칸트는 모든 자살을 예외 없이 반대한다.',a:0,f:'원칙적으로 반대하되 도덕적 완성을 위한 자살은 인정한다. 금지되는 것은 자연적 경향성에서 비롯된 자살이다.',src:'2026 수능'},
{u:2,t:'아퀴나스',s:'아퀴나스의 자살 반대 논거에는 「공동체 훼손」이 포함된다.',a:1,f:'맞다. ① 자기보존의 자연적 성향에 어긋남 ② 공동체의 부분인 자신을 훼손함 ③ 신의 소유권 침해.'},
{u:2,t:'하버마스',s:'하버마스는 치료 목적의 유전적 간섭을 허용한다.',a:1,f:'맞다. 치료 목적에는 배아의 동의가 예견되지만 강화 목적에는 예견되기 어렵다.',src:'2022 수능'},
{u:2,t:'하버마스',s:'하버마스는 자유주의적 우생학이 배아의 사물화를 초래한다고 본다.',a:1,f:'맞다. 그러므로 권장되어서는 안 된다고 본다.',src:'2022 수능'},
{u:2,t:'하버마스',s:'하버마스에게 인간의 유전적 자연성은 평등한 도덕 주체가 되기 위한 전제다.',a:1,f:'맞다. 부모의 프로그래밍대로 태어난 자는 부모의 목적을 위한 수단이 되어 상호주관성을 잃는다.',src:'2022 수능'},
{u:2,t:'싱어',s:'싱어는 동물을 인간을 위한 수단으로 사용하는 것을 어떤 경우에도 인정하지 않는다.',a:0,f:'이익 평등 고려의 결과 인간의 이익이 더 크면 육식·동물실험을 인정한다.',src:'2026 수능'},
{u:2,t:'싱어',s:'싱어가 도덕적 지위를 인정하는 대상은 인간 이외의 모든 동물이다.',a:0,f:'쾌고감수능력이 있는 동물뿐이다.',src:'2026 수능'},
{u:2,t:'레건',s:'레건은 고통을 최소화한 동물 실험은 허용될 수 있다고 본다.',a:0,f:'어떤 동물 실험이든 정의에 어긋나 허용될 수 없다고 본다 — 고통 최소화 여부와 무관하다.',src:'2025 9평'},
{u:2,t:'레건',s:'레건에게 인간 생체 실험 금지의 근거와 동물 실험 금지의 근거는 동일하다.',a:1,f:'맞다. 둘 다 권리 침해라는 근거다.',src:'2025 9평'},
{u:2,t:'레건',s:'「최대 다수의 최대 이익 산출」은 레건의 논리다.',a:0,f:'공리주의(싱어)의 논리이며 레건과 무관하다.',src:'2026 9평'},
{u:2,t:'레건',s:'레건의 「삶의 주체」 특성에는 자기 이익에 대한 관심이 포함된다.',a:1,f:'맞다. 삶의 주체의 7가지 특성 중 하나다.',src:'2026 9평'},
{u:2,t:'동물실험',s:'제시문이 「고통은 악(惡)」이라고 했다면 「고통은 도덕적 악」이 도출된다.',a:0,f:'도출되지 않는다. 악인지는 밝혔으나 도덕적 악인지는 밝히지 않았다.',src:'2022 6평'},
{u:2,t:'프롬',s:'프롬에게 「존경(respect)」은 상대에게 복종하는 것이다.',a:0,f:'지배하거나 소유하는 것이 아니라 상대를 있는 그대로 보고 그의 독특한 개성을 아는 능력이다.',src:'2023 수능'},
{u:2,t:'프롬',s:'프롬에게 모든 합일이 성숙한 사랑인 것은 아니다.',a:1,f:'맞다. 소유하는 방식의 합일은 미성숙한 사랑이며, 개성을 유지할 때 가능한 성숙한 사랑만이 실존 문제를 해결한다.',src:'2026 9평'},
{u:2,t:'나딩스',s:'나딩스의 배려윤리는 보편적 도덕 법칙과 의무감에 기초한다.',a:0,f:'구체적 맥락에 근거한 의사결정을 중시한다. 「도덕적 의무감·법칙 기반」은 칸트 의무론이다.',src:'2023 9평'},
{u:2,t:'유교 결혼관',s:'부부는 대등하므로 분별이 없어야 바르게 된다.',a:0,f:'부부유별은 역할의 분별을 두는 것이다. 유교 결혼관은 혼례가 모든 예의 근본, 상경여빈, 음양의 상호 보완이다.',src:'2021 9평'},
{u:2,t:'유교 결혼관',s:'부부 관계는 옳고 그름이나 예절의 규제로부터 자유롭다.',a:0,f:'부부간 윤리 자체가 예(禮)에 속한다.',src:'2021 수능'},
{u:2,t:'칸트',s:'칸트는 출산의 의도를 혼인의 합법성 조건으로 요구한다.',a:0,f:'요구하지 않는다. 그렇다면 자식 낳는 일이 끝나면 혼인이 저절로 해소될 것이기 때문이다.',src:'2022 9평'},
/* ── 대단원 Ⅲ ──────────────────────────────────────────────────── */
{u:3,t:'플라톤',s:'플라톤은 모든 직업이 평등하다고 본다.',a:0,f:'육체노동을 정신노동보다 열등하게 보았다. 직업 평등은 루터·칼뱅 라인이다.'},
{u:3,t:'직업관',s:'공자와 플라톤 모두 직업 선택의 자유를 부정한다.',a:1,f:'맞다. 전근대 신분제 사회이므로 「직업 선택의 자유」를 둘에게 적용하면 오답이다.',src:'2021 수능'},
{u:3,t:'플라톤',s:'생산자 계급의 덕은 절제뿐이다.',a:0,f:'평가원의 의도적 함정이다. 절제와 정의는 세 계급 공통의 덕이다.'},
{u:3,t:'칼뱅',s:'칼뱅에게 부의 축적은 구원을 얻기 위한 공로다.',a:0,f:'예정설에서 구원 대상은 태초에 정해져 있으므로 공로가 아니라 이미 정해진 구원의 「증표」다. 공로주의 선지는 무조건 오답.',src:'2025 수능·2026 수능'},
{u:3,t:'칼뱅',s:'칼뱅은 직업 선택의 자유를 인정한다.',a:1,f:'맞다. 반면 순자는 신분제 사회라 천직 개념 자체가 없어 부정한다.'},
{u:3,t:'마르크스',s:'마르크스는 모든 형태의 분업을 반대했다.',a:0,f:'반대한 것은 공장 내 분업과 도시—농촌 분리뿐이며, 산업 간 사회적 분업은 공산주의에서도 필요하다.'},
{u:3,t:'마르크스',s:'공산주의의 분배 원칙은 「노동한 만큼 분배」다.',a:0,f:'「능력에 따라 일하고 필요에 따라 분배」다.'},
{u:3,t:'마르크스',s:'노동가치설은 로크가 주장하고 마르크스가 수용했다.',a:1,f:'맞다. 자유주의자는 사유재산 정당화 논거로, 마르크스는 사유재산 부정 논거로 쓴다.'},
{u:3,t:'정약용',s:'절용(節用)은 목민관의 유일한 실천 방안이다.',a:0,f:'「유일한」 같은 과한 표현은 오답이다. 절용은 「가장 중요한 임무」일 뿐이다.',src:'2023 9평'},
{u:3,t:'니부어',s:'니부어는 폭력을 전적으로 배제한다.',a:0,f:'비폭력이 폭력보다 낫다고 보지만 폭력을 전적으로 배제하지는 않는다. 강제력은 불의의 원인이자 정의 실현의 수단이라는 이중성이 있다.',src:'2026 9평'},
{u:3,t:'아리스토텔레스',s:'형사처벌은 시정적 정의에 속한다.',a:0,f:'교환적(응보적) 정의에 속한다. 시정적 정의는 민사적 배상 영역이다.'},
{u:3,t:'아리스토텔레스',s:'아리스토텔레스는 동등성의 원리를 채택했다.',a:0,f:'동등성의 원리는 칸트의 응보주의와 연결된다. 아리스토텔레스는 사람의 지위·가치에 따라 처벌이 달라진다고 보았다.'},
{u:3,t:'롤스',s:'원초적 입장은 역사적으로 실제 이루어진 합의다.',a:0,f:'가상적·비역사적 사고실험이다. 「역사적으로 실제 이루어졌다」는 선지는 무조건 오답이다.',src:'2023 9평'},
{u:3,t:'롤스',s:'무지의 베일 아래에서도 당사자들은 자신의 이익 추구 사실과 일반 이론·법칙은 안다.',a:1,f:'맞다. 모르는 것은 자신의 재능·능력·지위·가치관·세대와 타인에 관한 정보다.'},
{u:3,t:'롤스',s:'사유재산권은 차등 원칙에 의해 제한될 수 있다.',a:0,f:'사유재산권은 평등한 자유의 원칙이 보장하는 기본적 자유라, 축차적 서열상 차등 원칙·기회균등 원칙으로는 제한할 수 없다. 「자유의 전체 체계 강화」를 위해서만 제한 가능하다.',src:'2021 9평'},
{u:3,t:'롤스',s:'최소수혜자의 이익 극대화는 조건 없이 보장된다.',a:0,f:'「조건 없이」가 축차적 서열에 어긋난다. 제1원칙과 기회균등 원칙이 먼저다.',src:'2021 수능'},
{u:3,t:'롤스',s:'자유가 충돌하면 모든 자유가 균등하게 보장된다.',a:0,f:'더 근본적인 자유가 우선한다는 뜻이지 균등 보장이 아니다.',src:'2023 수능'},
{u:3,t:'노직',s:'로크적 단서는 타인의 처지를 「개선」할 것을 요구한다.',a:0,f:'「악화시키지 않을 것」을 요구할 뿐 개선까지 요구하지 않는다.',src:'2024 수능'},
{u:3,t:'노직',s:'노직은 재산세와 소비세까지 반대한다.',a:0,f:'반대하는 것은 노동 소득에 부과하는 소득세뿐이다.',src:'2024 9평'},
{u:3,t:'노직',s:'노직은 자신의 노동에 의한 결과에 대해서만 소유권을 갖는다고 본다.',a:0,f:'양도(매매·증여·상속)와 교정으로도 소유권이 성립한다.',src:'2023 수능'},
{u:3,t:'노직',s:'노직의 최소국가도 교정을 위한 개입·재분배는 인정한다.',a:1,f:'맞다. 개입하지 않는 것은 「복지를 위한 재분배」뿐이다.',src:'2022 9평·2024 수능'},
{u:3,t:'노직',s:'소유권을 침해하지 않는 과세는 롤스·노직 모두 긍정한다.',a:1,f:'맞다. 「노직 = 모든 세금 반대」로 기억하면 틀린다.',src:'2026 6평'},
{u:3,t:'롤스·노직',s:'평가원 입장에서 자기소유권은 노직만 인정하고 롤스는 부정한다.',a:0,f:'평가원 입장에서 노직 O·롤스 O다(팩트상 오류지만 평가원 입장대로 암기).',src:'2022 수능'},
{u:3,t:'칸트',s:'칸트에게 인격 교화는 형벌의 목적에 포함된다.',a:0,f:'포함되지 않는다. 평가원은 「형벌이 다른 선을 촉진하는 수단으로 가해질 수 없다」로 일관 출제한다.'},
{u:3,t:'벤담',s:'벤담은 모든 형벌이 그 자체로 악이라고 본다.',a:1,f:'맞다. 형벌은 필요악이며 범죄예방 수단으로서만 결과적으로 선이다.',src:'2023 9평'},
{u:3,t:'형벌',s:'칸트와 벤담은 모두 비례 원칙을 인정하지만 그 의미가 다르다.',a:1,f:'맞다. 칸트는 동등성 원리 1:1, 베카리아·벤담은 억제 효과 기준이다. 공통 영역에 넣을 수 있는 것은 「비례 원칙을 인정한다」는 사실뿐이다.',src:'2025 6평·9평'},
{u:3,t:'루소',s:'루소는 응보를 근거로 사형에 찬성한다.',a:0,f:'사회계약이 근거다 — 계약 시 생명을 양도했으므로 계약 위반자는 국가의 적이다. 루소는 응보론자가 아니다.',src:'2025 수능'},
{u:3,t:'베카리아',s:'베카리아의 「일반의사」는 루소의 「일반의지」와 같다.',a:0,f:'루소의 「전체의지」에 해당한다.',src:'2026 수능(오답률 1위)'},
{u:3,t:'국가관',s:'아리스토텔레스는 국가를 계약·동의의 산물로 본다.',a:0,f:'자연 발생으로 본다. 국가 발생론 3분류 — 아리스토텔레스는 자연 발생, 사회계약론은 동의·계약, 맹자 등 동양은 천명·추대.',src:'2021 6평·2022 6평·2022 수능'},
{u:3,t:'홉스',s:'홉스에게 주권자는 시민법 복종 의무는 없지만 자연법 복종 의무는 있다.',a:1,f:'맞다. 군주·시민 모두 자연법 복종 의무가 있다. 절대군주는 계약의 「체결」이 아니라 「이행」을 강제한다.',src:'2025 수능'},
{u:3,t:'홉스',s:'홉스의 자연 상태에는 배타적 소유권이 있다.',a:0,f:'만물에 대한 권리만 있을 뿐 배타적 소유권은 없다. 사유재산은 사회계약 이후에 발생한다.',src:'2026 6평'},
{u:3,t:'루소',s:'루소에게도 양도하지 않는 권리가 있다.',a:0,f:'전면 양도이므로 양도하지 않는 권리가 없다. 로크에게는 양도하지 않은 생명권·재산권이 보장된다.',src:'2026 9평'},
{u:3,t:'사회계약',s:'자연 상태에서 인간이 자유롭다는 것은 홉스·로크·루소 공통이다.',a:1,f:'맞다. 자연 상태는 「신분제 부정」을 뜻하며 누구나 자유롭고 평등하다.',src:'2026 9평'},
{u:3,t:'롤스',s:'자유를 「제한」하는 법도 시민불복종의 대상이다.',a:0,f:'「제한」과 「침해」는 다르다. 제한하는 법은 대상이 아니고 침해하는 법이 대상이다.',src:'2026 6평'},
{u:3,t:'롤스',s:'롤스에게 간접적 시민불복종(문제된 법이 아닌 다른 법을 위반하는 방식)도 부합한다.',a:1,f:'맞다.',src:'2023 6평'},
{u:3,t:'롤스',s:'시민불복종이 빈번한 국가의 체제는 부정의하다고 단정할 수 있다.',a:0,f:'단정할 수 없다. 거의 정의로운 사회도 정의로운 사회다.',src:'2026 수능(오답률 2위)'},
{u:3,t:'롤스',s:'롤스는 소로의 세금납부 거부를 시민불복종으로 본다.',a:0,f:'양심적 거부로 본다.'},
{u:3,t:'싱어',s:'싱어에게 시민불복종은 민주주의적 의사 결정을 복원하려는 시도다.',a:1,f:'맞다. 싱어는 체제 조건도 공유된 정의관도 요구하지 않고 이익·손해의 저울질로 판단한다.',src:'2024 6평'},

{u:4,t:'가치중립성',s:'연구 주제 선정 단계에는 가치가 개입된다.',a:1,f:'맞다. 이를 지적한 사람이 막스 베버다. 이때의 가치는 반드시 도덕적 가치는 아니다.'},
{u:4,t:'가치중립성',s:'가설 검증(정당화의 맥락) 단계는 가치중립적이다.',a:1,f:'맞다. 교과서 입장 — 선정·발견·활용은 개입, 정당화는 중립이다.'},
{u:4,t:'과학자의 책임',s:'하이젠베르크는 과학자의 사회적 책임을 부정했다.',a:0,f:'긍정했다 — 연구 과정 단계부터 책임이 있다고 보아 원폭 개발에 불참했다. 부정한 쪽은 오펜하이머다.'},
{u:4,t:'포퍼',s:'확증된 이론은 참이다.',a:0,f:'확증은 반증을 아직 견뎌냈다는 뜻일 뿐 진리의 확정이 아니다.',src:'2025 수능'},
{u:4,t:'포퍼',s:'반증된 경험 과학 이론은 거부된다.',a:1,f:'맞다. 반증 가능성이 없는 이론은 애초에 과학이 아니다.',src:'2025 수능'},
{u:4,t:'야스퍼스',s:'야스퍼스는 기술의 가치중립성을 긍정한다.',a:1,f:'맞다. 단 야스퍼스가 부정하는 것은 기술의 「도덕적」 가치뿐이다.',src:'2021 9평'},
{u:4,t:'야스퍼스',s:'야스퍼스가 하이데거에게 제기할 비판은 「기술이 수단임을 간과했다」는 것이다.',a:1,f:'맞다.',src:'2023 수능'},
{u:4,t:'하이데거',s:'하이데거는 기술에 대한 중립적 태도가 가장 안전하다고 본다.',a:0,f:'무관심·중립 태도는 무방비 상태라 가장 위험하다고 본다.'},
{u:4,t:'기술관',s:'기술 활용의 결정 기준은 가치중립적이다.',a:0,f:'오답이다.',src:'2025 6평'},
{u:4,t:'요나스',s:'요나스의 책임은 예견할 수 없는 결과에까지 미친다.',a:0,f:'요나스의 결과 책임은 어디까지나 「예견 가능한 결과」에 대한 책임이다.',src:'2024 수능완성 오류'},
{u:4,t:'요나스',s:'요나스는 내적 책임보다 외적 책임을 강조한다.',a:1,f:'맞다. 과학의 가치중립성 주장은 요나스의 입장이 아니라 비판 대상이다.',src:'2021 6평'},
{u:4,t:'요나스',s:'요나스에서 「가능은 당위를 함축」한다.',a:1,f:'맞다. 「할 수 있다」는 능력에 근거해 「해야 한다」는 책임이 발생한다 — 칸트의 「당위는 가능을 함축」의 역전이다.',src:'2021 수능'},
{u:4,t:'요나스',s:'과학 기술의 비의도적 결과는 책임 대상에서 제외된다.',a:0,f:'의도와 무관하게 예견 가능하면 책임 대상이다.',src:'2022 수능'},
{u:4,t:'요나스',s:'공포의 발견술은 선한 결과가 예견되는 기술은 검토하지 않아도 된다는 뜻이다.',a:0,f:'부정적 결과 예측에 주의를 기울이라는 것이지 그런 뜻이 아니다.',src:'2025 수능'},
{u:4,t:'요나스',s:'요나스가 베이컨에게 제기할 비판은 「책임 범위가 자연에까지 확대되어야 함을 간과」다.',a:1,f:'맞다.',src:'2022 9평'},
{u:4,t:'요나스',s:'결과의 불확실성은 책임의 불가피성을 거부하는 명분이 된다.',a:0,f:'되지 않는다. 잠재적 위험도 책임 범위에 포함되며, 책임질 능력이 완전한 지식을 동반할 필요는 없다.',src:'2026 수능'},
{u:4,t:'요나스',s:'「기술로 얻은 힘의 크기가 커질수록 책임 범위는 넓어진다」는 요나스에 부합한다.',a:1,f:'맞다. 권력에 비례한 책임이며, 비호혜적·일방적 책임도 포함한다.',src:'2024 수능'},
{u:4,t:'칸트',s:'칸트에게 동물에 대한 의무는 직접적 의무다.',a:0,f:'인간성에 대한 간접적 의무다. 「간접적 의무」는 교육과정상 칸트만 사용하는 개념이다.'},
{u:4,t:'칸트',s:'환경윤리에서 평가원이 칸트의 도덕적 지위 보유 존재로 인정하는 것은 인간뿐이다.',a:1,f:'맞다(팩트상 신·천사 등 이성적 존재자도 인정되나 평가원 입장대로 암기).',src:'2023 수능'},
{u:4,t:'칸트',s:'칸트는 자연을 수단으로 사용하는 것 자체를 금지한다.',a:0,f:'수단 사용 자체는 인정한다 — 「단지 ~으로만」 대우하는 것이 문제다.',src:'2025 9평'},
{u:4,t:'싱어',s:'싱어의 이익 평등 고려 원칙은 「평등한 대우」를 뜻한다.',a:0,f:'「평등한 고려」이지 「평등한 대우」가 아니다. 개체 간 이해관심이 달라 동등한 대우는 불가능하다.',src:'2026 9평'},
{u:4,t:'싱어',s:'싱어는 지적으로 우월한 개체의 삶의 가치가 더 크다고 본다.',a:1,f:'맞다. 쾌고감수능력 있는 동물 간 도덕적 지위는 동등하되 삶의 가치는 다르다.',src:'2023 6평'},
{u:4,t:'싱어',s:'쾌고감수능력은 도덕적 「행위자」를 판별하는 기준이다.',a:0,f:'도덕적 「지위」를 인정하는 기준이지 행위자 판별 기준이 아니다.',src:'2024 수능'},
{u:4,t:'테일러',s:'테일러의 신의(성실) 의무의 대상은 모든 생명체다.',a:0,f:'「야생 동물」뿐이다. 식물을 기만하는 행위는 있을 수 없고 가축은 사냥·낚시의 대상이 아니다.'},
{u:4,t:'테일러',s:'테일러의 「악행 금지」와 「불간섭」은 모두 소극적(부작위) 의무다.',a:1,f:'맞다. 의무의 우선순위는 불침해 > 보상 > 신의 > 불간섭이다.'},
{u:4,t:'레오폴드',s:'레오폴드는 생태계 구성원의 도구적 가치를 인정하지 않는다.',a:0,f:'사냥·채집 등 자원 이용을 인정한다. 구성원의 존속할 권리도 인정한다(평가원 입장).',src:'2021 9평'},
{u:4,t:'환경윤리',s:'동물 「종」에 대한 직접적 의무는 칸트·레건도 인정한다.',a:0,f:'전체론인 레오폴드만 인정하고, 개체론인 칸트·레건은 부정한다.',src:'2022 6평'},
{u:4,t:'환경윤리',s:'「인간이 본질적으로 우월하지 않다」는 레건도 긍정한다.',a:0,f:'레오폴드·테일러는 긍정, 레건은 부정이다. 평가원은 「내재적 가치를 갖는 생명체가 그렇지 않은 생명체보다 본질적으로 우월」이라는 입장이다.',src:'2023 9평'},
{u:4,t:'테일러',s:'「내재적 선」은 테일러만 긍정한다.',a:1,f:'맞다. 평가원이 만든 용어로 테일러의 「고유의 선」에 해당한다.',src:'2024 6평'},
{u:4,t:'환경윤리',s:'「자연의 경제적 이용 허용」은 칸트·싱어·레오폴드 모두 긍정한다.',a:1,f:'맞다. 레오폴드도 생태계 균형 유지를 조건으로 자원 이용을 인정한다.',src:'2022 9평'},
{u:4,t:'환경윤리',s:'「수단으로 대우해서는 안 된다」고 말하는 사상가에 칸트가 포함된다.',a:0,f:'레건·테일러·레오폴드(평가원 입장)·싱어가 해당하고, 칸트는 수단 사용 자체는 허용하므로 제외된다.'},
{u:4,t:'정보윤리',s:'카피레프트는 배타적 권리의 포기를 전제한다.',a:0,f:'저작권에 기반한다.',src:'2023 9평'},
/* ── 대단원 Ⅴ ──────────────────────────────────────────────────── */
{u:5,t:'플라톤',s:'플라톤은 모든 예술을 금지해야 한다고 본다.',a:0,f:'추방의 이유는 예술이 이데아를 그대로 재현하지 못하기 때문이다 — 재현할 수 있다면 자리를 잡을 수 있다.',src:'2026 6평'},
{u:5,t:'플라톤',s:'플라톤에게 예술가는 미의 이데아를 창조해야 한다.',a:0,f:'이데아는 객관적으로 존재하는 인식의 대상이지 창조의 대상이 아니다.',src:'2026 6평'},
{u:5,t:'아리스토텔레스',s:'『시학』에서 시인의 임무는 실제 일어난 일을 이야기하는 것이다.',a:0,f:'일어날 법한 일(개연성)을 이야기하는 것이다.',src:'2025 수능'},
{u:5,t:'톨스토이',s:'톨스토이는 예술이 감정을 의도적으로 전달하는 수단일 수 없다고 본다.',a:0,f:'정반대다. 톨스토이는 예술을 「감정의 전달」로 규정한다.',src:'2026 수능'},
{u:5,t:'톨스토이',s:'톨스토이는 비평·비평가에 부정적이다.',a:1,f:'맞다. 감정은 특별한 교육이 필요 없기 때문이다.',src:'2026 수능'},
{u:5,t:'칸트',s:'칸트에서 미적 판단과 도덕 판단은 종속 관계다.',a:0,f:'별개이나 구조가 유사(사적 이해관심에서 벗어남)하여 서로 촉진할 수 있을 뿐이다.',src:'2024 수능'},
{u:5,t:'칸트',s:'칸트에서 미는 대상에 객관적으로 존재한다.',a:0,f:'객관적으로 존재하지 않는다. 보편성의 근거는 대상이 아니라 판단 주체(무관심성·공통감)다.'},
{u:5,t:'칸트',s:'칸트의 미적 판단은 「모든 이성적 존재자」에 대한 타당성을 전제한다.',a:0,f:'「모든 인간」에 대한 타당성을 전제한다. 「모든 이성적 존재자」는 선(善)의 영역이다.',src:'2026 9평'},
{u:5,t:'아도르노',s:'아도르노의 문화 산업은 예술을 미적 가치로만 평가한다.',a:0,f:'정반대다. 경제적 가치(인기와 수익)로 평가한다.',src:'2021 6평'},
{u:5,t:'아도르노',s:'아도르노에게 문화 산업의 주체는 대중이다.',a:0,f:'(산업) 자본이다.',src:'2021 6평'},
{u:5,t:'아도르노',s:'아도르노는 문화 산업이 상품임을 은폐한다고 본다.',a:0,f:'숨기지 않고 오히려 이데올로기로 활용한다는 것이 제시문 내용이다.',src:'2025 수능'},
{u:5,t:'아도르노',s:'문화 산업은 소비자의 주체성을 훼손하고 「사물화」를 조장한다.',a:1,f:'맞다. 은밀하게 작동하는 의식 조작으로 능동적 인식 능력을 무력화한다.',src:'2024 6평·2025 6평'},
{u:5,t:'벤야민',s:'벤야민은 새로운 예술의 전시가치를 통해 대중의 각성이 가능하다고 본다.',a:1,f:'맞다. 아도르노와 정반대로 예술의 정치화를 긍정한다.'},
{u:5,t:'예악',s:'순자·공자의 공통 입장은 「음악은 인격을 도야하기 위한 중요한 수단」이다.',a:1,f:'맞다. 「음악의 유일한 목적은 즐거움」, 「선한 본성을 이끌어 냄」(순자는 성악설)은 오답이다.',src:'2022 9평'},
{u:5,t:'순자',s:'순자의 예악은 즐거움을 「통해」 교화하는 것이다.',a:0,f:'즐거움을 「절제」하게 하는 것이다. 「예」는 절제를 내포한다.',src:'2023 수능'},
{u:5,t:'묵자',s:'묵자가 순자에게 제기할 비판은 「위정자가 선왕의 음악을 장려하는 것이 백성에게 무익함을 간과」다.',a:1,f:'맞다.',src:'2022 수능'},
{u:5,t:'묵자',s:'묵자는 분별적 사랑을 위해 음악을 활용해야 한다고 본다.',a:0,f:'이중 오류다. 묵자의 겸애는 분별 없는 사랑이고, 묵자는 비악(非樂)을 주장한다.',src:'2024 9평'},
{u:5,t:'보드리야르',s:'보드리야르는 타인과의 차이를 드러내려는 욕구를 충족하기 위해 소비한다고 본다.',a:1,f:'맞다. 현대인은 재화가 아니라 기호(이미지)를 소비한다.',src:'2023 수능'},
{u:5,t:'베블런',s:'베블런에게 비교 성향은 자기 보존 본능보다 강력하다.',a:0,f:'「자기 보존 본능을 제외하고는」 가장 강력하다.',src:'2021 수능'},
{u:5,t:'짐멜',s:'짐멜에게 유행의 양식은 항구적 속성을 갖는다.',a:0,f:'「유행」이라는 현상은 항상 있으나 개별 유행에는 지속성이 없다.',src:'2023 9평'},
{u:5,t:'공자',s:'화이부동(和而不同)은 선악의 분별 없이 모두 포용하는 것이다.',a:0,f:'군자의 화합은 분별을 전제로 하지 무조건적 수용이 아니다.',src:'2022 9평'},
{u:5,t:'다문화',s:'「주류 문화의 우위를 전제로 비주류 문화의 고유성을 존중」하는 것은 샐러드 볼 모델이다.',a:0,f:'국수 대접 모델이다. 샐러드 볼은 대등한 지위의 공존이다.',src:'2023 수능'},
{u:5,t:'포퍼',s:'모든 문화는 고유성을 지니기에 용인되어야 한다.',a:0,f:'관용의 역설 — 관용을 허용하지 않는 문화까지 용인되어서는 안 된다.',src:'2023 6평'},
{u:5,t:'엘리아데',s:'엘리아데에게 세계는 성(聖) 그 자체다.',a:0,f:'세계는 성이 드러나는 대상일 뿐 그 자체가 성은 아니다.',src:'2022 수능'},
{u:5,t:'엘리아데',s:'숭배 대상은 자연물 자체가 아니라 그 속에 드러났다고 믿는 성(聖)이다.',a:1,f:'맞다. 이 단원 최빈출 함정이다.',src:'2024 9평'},
{u:5,t:'엘리아데',s:'성과 속은 공존할 수 없다.',a:0,f:'성현(聖顯)을 통해 공존한다. 성은 반드시 속을 통해 드러난다.',src:'2026 6평'},
{u:5,t:'엘리아데',s:'성현되는 자연·세계가 곧 초월적 신 자체다.',a:0,f:'그것은 범신론이며 엘리아데는 범신론이 아니다.',src:'2025 수능'},
{u:5,t:'뒤르켐',s:'뒤르켐에게 성(聖)과 속(俗)은 뚜렷이 구분되며 상호배타적이다.',a:1,f:'맞다. 엘리아데와 갈라지는 지점이다.'},
{u:5,t:'퀭',s:'퀭은 다른 종교적 견해를 결코 비판해서는 안 된다고 본다.',a:0,f:'단호한 자아비판이라는 바탕 위에서의 정당한 비판은 허용한다.',src:'2023 9평'},
{u:5,t:'퀭',s:'퀭의 목표는 단일 종교로의 통합이다.',a:0,f:'보편 종교로의 통일이 아니라 각 종교에 공통된 가치를 기본으로 하는 세계 윤리의 도출이다.',src:'2023 9평·2024 수능'},
{u:5,t:'의식주',s:'유교 의복관에서 「의복은 항상 소박해야 한다」.',a:0,f:'문질빈빈(文質彬彬) — 형식과 본질의 조화다. 극단적 표현은 오답이다.',src:'2026 9평'},
/* ── 대단원 Ⅵ ──────────────────────────────────────────────────── */
{u:6,t:'원효',s:'원효의 화쟁(和諍)은 다수의 동의를 기초로 판단하는 것이다.',a:0,f:'화쟁은 다수결이 아니라 조화·통합이다. 각 주장이 타당할 수 있음을 인정하고 의견을 조율한다.',src:'2024 9평'},
{u:6,t:'하버마스',s:'언어 능력이 없는 주체도 의사소통 행위가 가능하다.',a:0,f:'의사소통 행위는 언어 능력을 지닌 둘 이상 주체의 상호 작용이다.',src:'2025 6평'},
{u:6,t:'하버마스',s:'도구적 행위는 이해타산을 벗어난 행위다.',a:0,f:'정반대다. 도구적 행위가 이해타산적(성공 지향적)이고, 의사소통 행위가 이해 지향적이다.',src:'2026 수능'},
{u:6,t:'하버마스',s:'담론에 참여해야만 이성적 능력을 발휘할 수 있다.',a:0,f:'함정이다. 도구적 이성도 이성적 능력이다.',src:'2026 수능'},
{u:6,t:'하버마스',s:'규범은 다수의 동의를 얻으면 타당하다.',a:0,f:'참여자 전원의 동의여야 한다 — 담론윤리 최다 빈출 함정이다.',src:'2021 9평'},
{u:6,t:'하버마스',s:'담론에서 개인적 선호·욕구는 발언할 수 없다.',a:0,f:'사적 영역도 발언 가능하다. 이것이 롤스와의 차이다. 「전문가들로만 구성」도 개방성 위배다.',src:'2021 수능'},
{u:6,t:'하버마스',s:'발화 내용이 참되면 어떠한 발화 자세도 허용된다.',a:0,f:'진실성 요구에 위배된다. 타당성 요구는 이해가능성·진리성·규범적 정당성·진실성 넷이다.',src:'2022 6평'},
{u:6,t:'하버마스',s:'합의된 주장은 절대적으로 참이다.',a:0,f:'절차적·형식적 보편성이며 반박에 열려 있다(진리합의론). 합의된 규범도 수정 가능하다.',src:'2024 6평'},
{u:6,t:'하버마스',s:'담론 참여자는 자신의 오류 가능성을 인정하는 자세로 대화해야 한다.',a:1,f:'맞다. 「비판적 이의 제기 금지」·「재논의 금지」·「전문성 기준 발언 제한」은 기출 재탕 함정이다.',src:'2024 수능'},
{u:6,t:'하버마스',s:'진실성은 담론의 합의에서 도출된다.',a:0,f:'진실성은 이상적 담화 상황의 타당성 요구 중 하나이지 합의의 산물이 아니다.',src:'2026 9평'},
{u:6,t:'하버마스',s:'발언 기회는 합리적 논증 능력에 따라 차등 부여되어서는 안 된다.',a:1,f:'맞다. 담론 참여자는 자유롭고 평등하다.',src:'2023 6평'},
{u:6,t:'롤스',s:'롤스의 정의론은 절차적 민주주의다.',a:0,f:'입헌민주주의다. 절차를 거친 법률이라도 내용이 정의원칙에 부합해야 한다. 절차적 민주주의는 하버마스다.'},
{u:6,t:'모겐소',s:'모겐소는 국내정치와 국제정치의 본질이 다르다고 본다.',a:0,f:'본질(권력 투쟁)은 같고 성격(위계 vs 무정부)이 다르다고 본다.'},
{u:6,t:'이상주의',s:'이상주의는 자국 이익 추구를 부정한다.',a:0,f:'부정하지 않는다. 이상주의 ≠ 평화주의이며, 보편 가치에 이반하는 국가를 상대로 전쟁을 선택하기도 한다.',src:'2021 6평'},
{u:6,t:'현실주의',s:'현실주의에는 평화 유지 정책이 없다.',a:0,f:'함정이다. 세력 균형이 현실주의의 평화 유지 정책이다(다만 일시적이라고 본다).',src:'2021 수능'},
{u:6,t:'국제정치',s:'「이성적(합리적)」이라는 표현은 현실주의와 이상주의를 가르는 기준이 된다.',a:0,f:'양자 모두 사용하므로 구분 기준이 될 수 없다. 이상주의는 협력 추구의 합리성, 현실주의는 자국 이익 계산의 합리성이다.',src:'2021 수능'},
{u:6,t:'세력균형',s:'파괴된 세력 균형을 복원하는 방법은 전쟁뿐이다.',a:0,f:'동맹·군비 확장·축소도 가능하다.',src:'2024 6평'},
{u:6,t:'세력균형',s:'동맹 없이는 세력 균형이 불가능하다.',a:0,f:'동맹은 수단 중 하나일 뿐이다(양 강대국 간 균형 등 다양한 양상이 있다).',src:'2023 수능'},
{u:6,t:'칸트',s:'칸트의 평화연맹은 국가와 같은 주권적 권력을 갖는다.',a:0,f:'협의체적 국제기구이며 가입·탈퇴가 자유롭다. 국제법 위반국을 처벌할 독점적 강제력이 없다.',src:'2021 9평·2022 9평'},
{u:6,t:'칸트',s:'평화조약으로 모든 전쟁을 영원히 종식시킬 수 있다.',a:0,f:'평화조약은 당사국 간 「하나의」 전쟁만 종식한다. 모든 전쟁의 영원한 종식은 평화연맹만이 가져온다.',src:'2022 9평·2025 6평'},
{u:6,t:'칸트',s:'세계시민법은 환대권과 영속적 체류권을 보장한다.',a:0,f:'환대권은 방문권이지 영속적 체류권이 아니다.',src:'2025 수능'},
{u:6,t:'칸트',s:'영구 평화가 실현된 뒤에는 세계 공화국을 수립해야 한다.',a:0,f:'칸트는 세계국가를 부정한다 — 주권이 국제 국가로 귀속된다는 선지도 함정이다.',src:'2026 수능'},
{u:6,t:'칸트',s:'세계시민법은 공화국 국민에게만 적용된다.',a:0,f:'방문권은 모든 사람의 권리다.',src:'2026 9평'},
{u:6,t:'칸트',s:'평화연맹의 수가 많아질수록 영원한 평화에 가까워진다.',a:0,f:'연맹 수가 많아지면 연맹 간 전쟁상태를 초래한다 — 「하나의」 평화연맹의 지속적 확장이 필요하다.',src:'2026 6평'},
{u:6,t:'칸트',s:'칸트는 상비군 폐지를 주장하면서도 방어 전쟁은 인정한다.',a:1,f:'맞다. 조국 방어를 위한 시민의 자발적 무장 훈련도 인정한다. 「폭력 사용은 어떠한 경우에도 불가」는 함정이다.',src:'2023 9평'},
{u:6,t:'칸트',s:'연맹에 가입한 주권 국가들을 공통으로 규제하는 법은 불가능하다.',a:0,f:'함정이다 — 국제법이 바로 그것이다.',src:'2026 수능'},
{u:6,t:'갈퉁',s:'문화적 폭력은 직접적·구조적 폭력을 정당화하는 기능을 한다.',a:1,f:'맞다. 종교·이데올로기·언어·예술 등에 의한 폭력이다.',src:'2023 9평'},
{u:6,t:'갈퉁',s:'모든 전쟁의 종식은 진정한 평화의 충분조건이다.',a:0,f:'필수조건일 뿐이다. 갈퉁에게는 구조적·문화적 폭력의 제거도 필요하다.',src:'2021 9평'},
{u:6,t:'갈퉁',s:'평화적이지 않은 수단으로도 평화를 실현할 수 있다.',a:0,f:'갈퉁은 폭력의 악순환을 이유로 부정한다.',src:'2025 6평'},
{u:6,t:'롤스',s:'롤스는 원조 대상국의 제도 개선을 위해 강제력을 행사할 수 있다고 본다.',a:0,f:'권고·충고만 가능하다. 강제력 행사는 무법 국가에 대해서만 허용된다.',src:'2021 수능'},
{u:6,t:'롤스',s:'롤스의 차단점(cut-off point)은 빈곤이 해소되는 시점이다.',a:0,f:'「질서 정연한 사회 달성」이 목표다. 질서 정연해진 뒤에도 가난할 수 있지만 원조는 종료된다.',src:'2021 6평'},
{u:6,t:'롤스',s:'차단점 설정은 대상국의 정치적 자율성을 침해한다.',a:0,f:'차단점은 오히려 침해를 막는 장치다.',src:'2024 9평'},
{u:6,t:'롤스',s:'독재·착취로 빈곤해진 사회는 롤스의 원조 대상이 아니다.',a:0,f:'그런 사회야말로 「고통받는 사회」로서 원조 대상이다.',src:'2024 수능'},
{u:6,t:'롤스',s:'롤스에게 원조 대상국은 오직 고통받는 사회뿐이다.',a:1,f:'맞다. 「고통받는 사회들만 원조 대상국인 것은 아니다」는 함정이다.',src:'2026 9평'},
{u:6,t:'롤스',s:'빈곤한 사람들이 있다는 사실만으로 원조 의무가 정당화된다.',a:0,f:'롤스의 원조 대상은 「개인」이 아니라 「사회」이고, 싱어는 「절대 빈곤」에 한정한다.',src:'2021 수능'},
{u:6,t:'싱어',s:'싱어에게 원조 의무는 정언명령이다.',a:0,f:'예외를 인정하는 조건부 의무다 — 싱어는 결과주의자이므로 원조의 효율성을 고려한다.',src:'2024 수능'},
{u:6,t:'싱어',s:'싱어에게 지리적 근접성은 원조 의무의 고려 대상이다.',a:0,f:'이익 평등 고려 원칙상 거리와 공동체 소속은 책무에 차이를 만들지 않는다.',src:'2021 6평'},
{u:6,t:'노직',s:'노직에게 원조는 소유권의 필연적 침해다.',a:0,f:'자발적 선택이면 침해가 아니다(측면 제약). 자선은 선택이지 의무가 아닐 뿐이다.',src:'2026 수능'},
{u:6,t:'해외원조',s:'평가원은 롤스의 「상호 협조 의무」를 자선 의무로 이해해 개인의 해외 원조 의무도 롤스가 인정한다고 본다.',a:1,f:'맞다. 롤스 이론의 「상호성」 요구와 충돌하나 평가원 입장대로 암기.'},
{u:6,t:'통일',s:'「정치적 통일이 이질성 완화의 선결 과제다」는 통일 논의의 일반적 논지에 부합한다.',a:0,f:'논지가 정반대다 — 이질성 완화가 선결이며, 신뢰는 민간 교류를 수반한 화해·협력으로 쌓인다.',src:'2026 9평'}
,
/* ── 맞는 선지 보강 (O:X 균형) ─────────────────────────────────── */
{u:1,t:'기술윤리학',s:'기술윤리학은 한 사회의 도덕 현상을 가치중립적으로 기술한다.',a:1,f:'맞다. 수행자는 역사학자·사회학자·인류학자이며 원칙적으로 윤리학이 아니다.'},
{u:1,t:'공자',s:'공자의 인(仁)은 존비친소에 따른 차별적·조건적 사랑이다.',a:1,f:'맞다. 효제(孝悌)를 가장 우선하고 이 사랑을 점차 확대해 나간다.'},
{u:1,t:'순자',s:'순자는 예(禮)로써 본성을 다스릴 수 있다고 본다.',a:1,f:'맞다 — 화성기위(化性起僞). 한비자는 인성이 변화 불가능하다고 보아 법으로 통제한다.'},
{u:1,t:'노자',s:'무위지치(無爲之治)는 도가만의 주장이 아니라 공자도 주장했다.',a:1,f:'맞다. 공자의 덕치가 그것이다 — 「무위를 통해 다스리는 자는 순임금이 아닌가」(북극성 비유).'},
{u:1,t:'묵자',s:'묵자는 유교의 인(仁)이 자기 가족·나라를 우선하는 편애로 귀결된다고 비판한다.',a:1,f:'맞다. 그 대안이 겸상애 교상리(兼相愛 交相利)다.',src:'2022 6평·수능'},
{u:1,t:'한비자',s:'한비자에게 덕(德)의 내용은 도덕성이 아니라 권력·힘이다.',a:1,f:'맞다. 유교의 덕 = 도덕성, 도가의 덕 = 무위, 한비자의 덕 = 권력·힘(상)이다.'},
{u:1,t:'아퀴나스',s:'아퀴나스는 아리스토텔레스의 영혼론과 스토아의 자연법 사상을 결합해 자연법을 체계화했다.',a:1,f:'맞다.'},
{u:1,t:'칸트',s:'칸트는 합법성인 경우에만 동기를 따진다.',a:1,f:'맞다. 의무로부터의 행위는 이미 도덕성을 갖추었기 때문이다.',src:'2022 6평·2024 9평'},
{u:1,t:'밀',s:'쾌락의 질적 차이를 인정한 쪽은 밀이다.',a:1,f:'맞다. 다만 최대 다수의 최대 행복이라는 기준과 결과주의는 벤담과 공유한다.'},
{u:1,t:'아리스토텔레스',s:'품성적 덕은 반복적 실천(습관화)으로 형성되며 유덕자의 행위를 보고 배운다.',a:1,f:'맞다. 본성적으로도, 본성에 반해서도 생기지 않는다.',src:'2024 수능·2026 9평'},
{u:2,t:'공자',s:'공자는 경험적으로 알 수 없는 사후세계에 소극적 태도를 취한다.',a:1,f:'맞다 — 「삶도 모르는데 어찌 죽음을 알겠느냐?」',src:'2026 수능'},
{u:2,t:'죽음관',s:'죽음이 두려워할 대상이 아니라는 점은 동북아시아·서양·불교의 공통 결론이다.',a:1,f:'맞다. 다만 그 이유는 전통마다 다르다.'},
{u:2,t:'하이데거',s:'하이데거에게 죽음의 자각은 삶의 종말이 아니라 삶이 시작되는 사건이다.',a:1,f:'맞다. 불안은 극복의 계기로 긍정된다. 「책임」을 사회에 대한 책임으로 서술한 선지는 오답이다.',src:'2024 6평'},
{u:2,t:'배아 복제',s:'토론 쟁점 문항에서 양쪽이 모두 인정하는 지점은 쟁점이 아니다.',a:1,f:'맞다. 「인간 배아가 성인과 같은 도덕적 지위를 가지는가」는 둘 다 부정하므로 쟁점이 아니다.',src:'2021 6평'},
{u:2,t:'싱어·레건',s:'싱어와 레건은 모두 종차별주의에 반대한다.',a:1,f:'맞다. 생명중심주의자들도 마찬가지다. 기준이 쾌고감수능력인가 삶의 주체인가에서 갈릴 뿐이다.'},
{u:2,t:'레건',s:'레건은 칸트의 이성 기준으로는 「가장자리 인간」에게 권리를 인정할 수 없다고 비판한다.',a:1,f:'맞다. 그래서 「삶의 주체」 개념으로 권리 인정 여부를 정해야 한다고 본다.'},
{u:2,t:'프롬',s:'사랑이 전제되지 않으면 성적 관계는 지속적 의미를 가질 수 없다.',a:1,f:'맞다. 사랑 없는 육체적 결합은 일시적 의미 이상이 될 수 없고 오히려 분리감을 키운다.',src:'2026 수능'},
{u:2,t:'성 윤리',s:'자유주의 성 윤리도 자율성·해악 금지라는 도덕적 제약을 둔다.',a:1,f:'맞다. 자기결정권을 충분조건으로 보지 않는다.',src:'2021 수능·2025 6평'},
{u:2,t:'칸트',s:'칸트에게 결혼은 전인격을 상대방에게 온전히 양도한다는 조건의 계약이다.',a:1,f:'맞다. 그 조건이 충족될 때 상대방의 성을 향유할 수 있다.',src:'2022 9평'},
{u:3,t:'맹자',s:'무항산자 무항심은 경제적 안정이 도덕적 삶의 기반이라는 뜻이다.',a:1,f:'맞다. 그 역(도덕이 경제를 낳는다)이 아니다.'},
{u:3,t:'칼뱅',s:'소명으로 주어진 직업 중 고귀하지 않은 직업은 있을 수 없다.',a:1,f:'맞다. 직업에 귀천이 없다는 것이 칼뱅의 입장이다.',src:'2026 수능'},
{u:3,t:'니부어',s:'집단 간 관계에서 정의는 집단 간 힘의 균형으로 정의된다.',a:1,f:'맞다. 개인은 교육으로 이성적이 될 수 있으나 집단은 절대 이타적이 될 수 없다.'},
{u:3,t:'니부어',s:'피지배집단이 행사하는 강제력은 정의 실현의 수단이 될 수 있다.',a:1,f:'맞다. 지배집단이 가지면 불의의 원인이 되는 이중성이 있다.'},
{u:3,t:'왈처',s:'왈처는 사회적 가치의 특수성·다원성으로 롤스의 단일 분배원칙을 비판한다.',a:1,f:'맞다. 롤스의 단순평등 이론은 전제(專制)를 초래한다고 본다.'},
{u:3,t:'왈처',s:'왈처에게 독점은 허용되지만 지배와 전제는 부당하다.',a:1,f:'맞다. 핵심은 분배영역의 자율성이다.'},
{u:3,t:'롤스',s:'공정으로서의 정의는 순수 절차적 정의이고, 질서 정연한 사회는 재산 소유 민주주의다.',a:1,f:'맞다. 이 두 등식은 롤스 문제의 단골 식별 키워드다.',src:'2026 9평'},
{u:3,t:'롤스',s:'자유의 우선성은 「자유는 오직 자유를 위해서만 제한될 수 있다」는 뜻이다.',a:1,f:'맞다. 「자유는 절대적이다」라는 뜻이 아니다.'},
{u:3,t:'노직',s:'노직은 도덕적 응분(moral desert)에 따른 분배를 부정한다.',a:1,f:'맞다. 그것 역시 정형적 원리이기 때문이다. 아리스토텔레스의 「덕에 따른 분배」가 여기에 해당한다.',src:'2021 6평'},
{u:3,t:'로크',s:'로크는 신탁 위반 시 저항권을 인정한다.',a:1,f:'맞다. 홉스는 통치자의 기본권 침해가 계약 위반이 아니므로 저항권을 인정하지 않는다.'},
{u:3,t:'맹자·로크',s:'맹자의 역성혁명론과 로크의 저항권은 모두 통치자의 정당성 상실 시 교체를 인정한다.',a:1,f:'맞다. 정당화 근거가 천명과 신탁으로 다를 뿐이다.'},
{u:3,t:'롤스',s:'시민불복종은 불법 행위이면서도 입헌체제의 안정 수단이다.',a:1,f:'맞다. 항의를 제도가 흡수할 통로로 인정함으로써 체제의 정당성과 안정을 강화한다.'},
{u:3,t:'롤스',s:'롤스의 시민불복종은 공유된 정의관에 근거해 다수자의 정의감에 「호소하는」 행위다.',a:1,f:'맞다. 「나타내는」이 아니라 「호소하는」이다. 종교적 교리·개인적 도덕원칙이 근거가 아니다.',src:'2021 수능·2024 수능'},
{u:4,t:'하이데거',s:'하이데거는 기술의 본질을 탈은폐로 보며 기술의 가치중립성을 부정한다.',a:1,f:'맞다. 기술이 수단이라는 도구적 규정은 옳으나 본질은 아니라고 본다.'},
{u:4,t:'요나스',s:'요나스의 책임은 상호적·계약적인 것이 아니라 일방적·비상호적이다.',a:1,f:'맞다. 부모가 자식에 대해 지는 책임이 그 모델이다.'},
{u:4,t:'요나스',s:'공포는 책임 의식을 약화시키는 것이 아니라 깨운다.',a:1,f:'맞다. 책임의 범위도 전 지구적으로 확장된다.',src:'2025 9평'},

{u:6,t:'싱어',s:'싱어는 세계시민주의 관점에서 타국의 절대 빈곤한 「개인」에 대한 원조 의무를 말한다.',a:1,f:'맞다. 롤스는 국제주의 관점에서 「사회」를 대상으로 한다.'}

/* ══════════════════════════════════════════════════════════════════
   기출 함정 드릴 — 선지 하나에 O / X
   ══════════════════════════════════════════════════════════════════ */
const UNITS = [
  {n:1,r:'Ⅰ',name:'현대의 삶과 실천 윤리'}, {n:2,r:'Ⅱ',name:'생명과 윤리'},
  {n:3,r:'Ⅲ',name:'사회와 윤리'},           {n:4,r:'Ⅳ',name:'과학과 윤리'},
  {n:5,r:'Ⅴ',name:'문화와 윤리'},           {n:6,r:'Ⅵ',name:'평화와 공존의 윤리'}
];
const ROMAN = Object.fromEntries(UNITS.map(u => [u.n, u.r]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

ITEMS.forEach((it, i) => it.id = i);
const TAGCOUNT = {};
ITEMS.forEach(it => TAGCOUNT[it.t] = (TAGCOUNT[it.t] || 0) + 1);
const TAGS = Object.keys(TAGCOUNT).sort((a,b) => TAGCOUNT[b]-TAGCOUNT[a] || a.localeCompare(b,'ko'));

const MARK_O = `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14"/></svg>`;
const MARK_X = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 9 L31 31"/><path d="M31 9 L9 31"/></svg>`;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const state = {
  units: new Set(UNITS.map(u => u.n)),
  tags: new Set(),                       // 비어 있으면 전체
  count: 20,
  fast: true,                            // 맞히면 자동으로 넘어감
  qs: [], i: 0, log: [], answered: false,
  streak: 0, best: store.get('trapdrill.best', 0)
};

const pool = () => ITEMS.filter(it =>
  state.units.has(it.u) && (state.tags.size === 0 || state.tags.has(it.t)));

/* ── 시작 화면 ───────────────────────────────────────────────── */
let showAllTags = false;
function renderSetup() {
  const avail = pool().length;
  const shown = showAllTags ? TAGS : TAGS.slice(0, 21);
  setupEl().innerHTML = `
    <p class="lede">교재의 <b>「⚠ 함정·주의」</b> ${ITEMS.length}개를 선지로 바꿨다.<br>맞는 선지인지 틀린 선지인지, 한 문항에 십여 초.</p>
    <p class="sub">평가원이 어느 선지로 속였는지가 연도별로 적혀 있는 부분이다. 정답률이 낮았던 문항, 최다 반복 함정, 「평가원 입장대로 암기」해야 하는 대목이 모두 여기 있다.
    맞히면 곧장 다음 문항으로 넘어가고, 틀리면 멈춰서 해설을 보여 준다.</p>

    <div class="sechead">대단원</div>
    <div class="opts">
      ${UNITS.map(u => `<button type="button" class="opt" data-u="${u.n}" aria-pressed="${state.units.has(u.n)}"
        title="${esc(u.name)}">${u.r}<span class="n">${ITEMS.filter(i=>i.u===u.n).length}</span></button>`).join('')}
    </div>

    <div class="sechead">사상가·주제 <span class="note">고르지 않으면 전체</span></div>
    <div class="opts" style="margin-bottom:.55rem">
      <button type="button" class="opt" id="tag-all" aria-pressed="${state.tags.size===0}">전체<span class="n">${TAGS.length}</span></button>
    </div>
    <div class="tags">
      ${shown.map(t => `<button type="button" class="tag" data-t="${esc(t)}" aria-pressed="${state.tags.has(t)}">
        <span class="nm">${esc(t)}</span><span class="n">${TAGCOUNT[t]}</span></button>`).join('')}
    </div>
    ${TAGS.length > 21 ? `<button type="button" class="morebtn" id="more">${showAllTags ? '접기' : `나머지 ${TAGS.length-21}개 더 보기`}</button>` : ''}

    <div class="sechead">문항 수</div>
    <div class="opts">
      ${[10,20,50].map(c => `<button type="button" class="opt" data-c="${c}" aria-pressed="${state.count===c}">${c}문</button>`).join('')}
      <button type="button" class="opt" data-c="0" aria-pressed="${state.count===0}">전부<span class="n">${avail}</span></button>
    </div>

    <div class="sechead">넘김</div>
    <div class="opts">
      <button type="button" class="opt" id="fast" aria-pressed="${state.fast}">
        맞히면 자동으로 넘김<small>틀린 문항에서는 멈춰서 해설을 읽게 한다</small></button>
    </div>

    <div class="startbar">
      <button type="button" class="start" id="go">시작하기</button>
      <span class="tally"><b>${avail}</b>문항 중 <b>${state.count===0?avail:Math.min(state.count,avail)}</b>문항${state.best?` · 최고 연속 <b>${state.best}</b>`:''}</span>
    </div>

    <p class="footnote">선지는 『생활과 윤리 전 범위 압축 요약본』(2027학년도 코드원 개념서)의 「⚠ 함정·주의」 서술을 평가원 선지 형태로 옮긴 것이다 — 평가원 원문 선지를 그대로 인용한 것이 아니다.
    괄호 안 연도는 교재가 밝힌 출제 회차다. 관계를 그림으로 보려면 <a href="https://claude.ai/code/artifact/88e5e342-abe1-44ac-90d0-96bb2d87583d">사상가 관계도</a>,
    계승·비판·대립을 문제로 풀려면 <a href="https://claude.ai/code/artifact/dbff0cb2-b6d9-4b48-b54f-45bd86e5af64">관계 퀴즈</a>로.</p>`;

  $('go').disabled = avail === 0;
  $('tag-all').onclick = () => { state.tags.clear(); renderSetup(); };
  if ($('more')) $('more').onclick = () => { showAllTags = !showAllTags; renderSetup(); };
  setupEl().querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    const n = +b.dataset.u;
    if (state.units.has(n)) { if (state.units.size > 1) state.units.delete(n); } else state.units.add(n);
    renderSetup();
  });
  setupEl().querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t);
    renderSetup();
  });
  setupEl().querySelectorAll('[data-c]').forEach(b => b.onclick = () => { state.count = +b.dataset.c; renderSetup(); });
  $('fast').onclick = () => { state.fast = !state.fast; renderSetup(); };
  $('go').onclick = start;
}
const setupEl = () => $('setup');

/* ── 진행 ────────────────────────────────────────────────────── */
let autoTimer = null, autoRaf = 0;
function clearAuto() { clearTimeout(autoTimer); cancelAnimationFrame(autoRaf); autoTimer = null; }

function start() {
  const all = shuffle(pool().slice());
  state.qs = state.count === 0 ? all : all.slice(0, state.count);
  state.i = 0; state.log = []; state.answered = false; state.streak = 0;
  $('setup').classList.add('hidden'); $('result').classList.add('hidden');
  $('play').classList.remove('hidden'); $('quit').classList.remove('hidden');
  renderCard();
}

function chrome() {
  const n = state.qs.length, done = state.log.length;
  const ok = state.log.filter(l => l.ok).length;
  $('meter').innerHTML = n
    ? `<span class="n">${Math.min(done+1,n)}/${n}</span>
       <span class="n">○ ${ok}</span>
       <span class="st${state.streak >= 3 ? '' : ' cool'}">연속 ${state.streak}</span>`
    : '';
  $('rail').style.width = n ? `${done/n*100}%` : '0';
}

function renderCard() {
  clearAuto();
  chrome();
  const it = state.qs[state.i];
  if (!it) return finish();
  state.answered = false;
  $('play').innerHTML = `
    <div class="card">
      <div class="qmeta">
        <span class="pill">대단원 ${ROMAN[it.u]}</span>
        <span class="pill tag">${esc(it.t)}</span>
        ${it.src ? `<span class="pill">${esc(it.src)}</span>` : ''}
      </div>
      <p class="claim">${esc(it.s)}</p>
      <div class="paddles">
        <button type="button" class="paddle" data-v="1">${MARK_O}<span class="lab">맞는 선지</span><span class="key">1 · ←</span></button>
        <button type="button" class="paddle" data-v="0">${MARK_X}<span class="lab">틀린 선지</span><span class="key">2 · →</span></button>
      </div>
      <div id="fb"></div>
    </div>`;
  $('play').querySelectorAll('.paddle').forEach(b => b.onclick = () => answer(+b.dataset.v));
}

function answer(v) {
  if (state.answered) return;
  state.answered = true;
  const it = state.qs[state.i];
  const ok = v === it.a;
  state.log.push({ it, picked: v, ok });
  state.streak = ok ? state.streak + 1 : 0;
  if (state.streak > state.best) { state.best = state.streak; store.set('trapdrill.best', state.best); }

  $('play').querySelectorAll('.paddle').forEach(b => {
    const bv = +b.dataset.v;
    b.disabled = true;
    if (bv === v) b.classList.add('picked', ok ? 'ok' : 'no');
    if (bv === it.a) b.classList.add('truth');
  });

  const last = state.i === state.qs.length - 1;
  $('fb').innerHTML = `
    <div class="verdict">
      <div class="vhead ${ok ? 'o' : 'x'}">${ok ? '○ 맞다' : '✗ 틀렸다'}
        <span class="src">정답 ${it.a ? '맞는 선지(O)' : '틀린 선지(X)'}${it.src ? ` · ${esc(it.src)}` : ''}</span></div>
      <p class="why">${esc(it.f)}</p>
      <div class="nextrow">
        <button type="button" class="next" id="next">${last ? '결과 보기' : '다음'}<i id="tick"></i></button>
        <span class="hint">Space · Enter</span>
      </div>
    </div>`;
  chrome();
  const nx = $('next');
  nx.onclick = () => { clearAuto(); state.i++; renderCard(); };
  nx.focus({ preventScroll:true });

  /* 맞힌 문항은 잠깐 보여 주고 자동으로 넘긴다 — 틀린 문항은 멈춘다 */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (state.fast && ok && !reduce) {
    const DUR = 1400, t0 = performance.now(), tick = $('tick');
    const step = now => {
      const p = Math.min(1, (now - t0) / DUR);
      tick.style.width = (p * 100) + '%';
      if (p < 1) autoRaf = requestAnimationFrame(step);
    };
    autoRaf = requestAnimationFrame(step);
    autoTimer = setTimeout(() => { state.i++; renderCard(); }, DUR);
  }
}

/* ── 결과 ────────────────────────────────────────────────────── */
function finish() {
  clearAuto();
  $('play').classList.add('hidden'); $('quit').classList.add('hidden');
  $('result').classList.remove('hidden');
  const n = state.log.length, ok = state.log.filter(l => l.ok).length;
  const pct = n ? Math.round(ok/n*100) : 0;
  const misses = state.log.filter(l => !l.ok);
  let run = 0, longest = 0;
  state.log.forEach(l => { run = l.ok ? run+1 : 0; longest = Math.max(longest, run); });

  const said = pct === 100 ? '전부 맞혔다. 함정에 걸리지 않았다.'
    : pct >= 85 ? '거의 잡혔다. 틀린 것만 다시 보면 된다.'
    : pct >= 60 ? '절반 이상은 넘겼다. 틀린 쪽이 한 사상가에 몰려 있는지 보라.'
    : '함정이 아직 함정으로 안 보인다. 틀린 것부터 다시.';

  const C = 2*Math.PI*42;
  $('result').innerHTML = `
    <div class="rtop">
      <div class="ring">
        <svg viewBox="0 0 100 100" width="112" height="112">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="num"><b>${ok}<span style="font-size:.56em;color:var(--ink-3)">/${n}</span></b><span>${pct}%</span></div>
      </div>
      <p class="said">${esc(said)}</p>
    </div>
    <div class="stats">
      <span>이번 최고 연속 <b>${longest}</b></span>
      <span>역대 최고 연속 <b>${state.best}</b></span>
      <span>틀린 문항 <b>${misses.length}</b></span>
    </div>

    ${misses.length ? `<div class="sechead">틀린 문항 <span class="note">${misses.length}개</span></div>
      <div class="misses">${misses.map(m => `<div class="miss">
        <div class="q">${esc(m.it.s)}</div>
        <div class="a"><span class="badge">대단원 ${ROMAN[m.it.u]} · ${esc(m.it.t)}${m.it.src?` · ${esc(m.it.src)}`:''}</span><br>
        고른 답 ${m.picked ? 'O' : 'X'} · 정답 <b>${m.it.a ? 'O' : 'X'}</b> — ${esc(m.it.f)}</div>
      </div>`).join('')}</div>` : ''}

    <div class="again">
      ${misses.length ? '<button type="button" class="primary" id="retry">틀린 것만 다시</button>' : ''}
      <button type="button" ${misses.length?'':'class="primary"'} id="rerun">같은 조건으로 다시</button>
      <button type="button" id="back">조건 바꾸기</button>
    </div>
    <p class="footnote">해설은 교재의 「⚠ 함정·주의」 서술이다.
    <a href="https://claude.ai/code/artifact/88e5e342-abe1-44ac-90d0-96bb2d87583d">사상가 관계도</a> ·
    <a href="https://claude.ai/code/artifact/dbff0cb2-b6d9-4b48-b54f-45bd86e5af64">관계 퀴즈</a></p>`;

  requestAnimationFrame(() => {
    const fg = $('result').querySelector('.ring .fg');
    if (fg) fg.style.strokeDashoffset = C * (1 - pct/100);
  });
  $('meter').innerHTML = ''; $('rail').style.width = '100%';

  if ($('retry')) $('retry').onclick = () => {
    state.qs = shuffle(misses.map(m => m.it)); state.i = 0; state.log = []; state.streak = 0; state.answered = false;
    $('result').classList.add('hidden'); $('play').classList.remove('hidden'); $('quit').classList.remove('hidden');
    renderCard();
  };
  $('rerun').onclick = start;
  $('back').onclick = toSetup;
  scrollTo({ top:0 });
}

function toSetup() {
  clearAuto();
  $('play').classList.add('hidden'); $('result').classList.add('hidden'); $('quit').classList.add('hidden');
  $('setup').classList.remove('hidden');
  $('meter').innerHTML = ''; $('rail').style.width = '0';
  renderSetup(); scrollTo({ top:0 });
}
$('quit').onclick = () => { state.log.length ? finish() : toSetup(); };

document.addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if ($('play').classList.contains('hidden')) return;
  if (state.answered) {
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); clearAuto(); state.i++; renderCard(); }
    return;
  }
  const map = { '1':1, 'ArrowLeft':1, 'o':1, 'O':1, '2':0, 'ArrowRight':0, 'x':0, 'X':0 };
  if (ev.key in map) { ev.preventDefault(); answer(map[ev.key]); }
});

renderSetup();
</script>
