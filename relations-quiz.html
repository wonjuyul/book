<title>사상가 관계 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ══ 토큰 — 관계도와 같은 종이·먹, 채점은 빨간 펜 ══════════════════ */
:root{
  --paper:#EFEEE9; --surface:#F8F7F3; --surface-2:#E8E6DF;
  --ink:#1B1A17; --ink-2:#54514A; --ink-3:#8A8578;
  --rule:#D8D5CB; --rule-2:#C4C0B3;
  --seal:#A8382C; --seal-soft:rgba(168,56,44,.09); --seal-line:rgba(168,56,44,.36);
  --right:#3A6E4B; --right-soft:rgba(58,110,75,.10); --right-line:rgba(58,110,75,.36);
  --grid:rgba(27,26,23,.05);
  --shadow:0 1px 2px rgba(27,26,23,.05), 0 10px 28px rgba(27,26,23,.07);
  --g-ru:#A6402F;  --g-dao:#3F7A63; --g-mofa:#6B5844; --g-bud:#7A4370;
  --g-anc:#2F5590;  --g-mod:#4E7580; --g-norm:#2E2D28; --g-just:#5A4E9C;
  --g-envi:#5A7A2E; --g-cult:#C2661A; --g-care:#B04A6B;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#171612; --surface:#201E19; --surface-2:#2A2822;
  --ink:#EDEAE1; --ink-2:#B4AFA2; --ink-3:#847F72;
  --rule:#35322A; --rule-2:#474338;
  --seal:#DF7A63; --seal-soft:rgba(223,122,99,.13); --seal-line:rgba(223,122,99,.42);
  --right:#7DBE92; --right-soft:rgba(125,190,146,.13); --right-line:rgba(125,190,146,.42);
  --grid:rgba(237,234,225,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  --g-ru:#E0745C;  --g-dao:#6FB795; --g-mofa:#BFA588; --g-bud:#C288B4;
  --g-anc:#7FA6E0;  --g-mod:#8FBBC6; --g-norm:#D8D3C4; --g-just:#A197E6;
  --g-envi:#A2C75B; --g-cult:#E9A05A; --g-care:#E68CA8;
}}
:root[data-theme="dark"]{
  --paper:#171612; --surface:#201E19; --surface-2:#2A2822;
  --ink:#EDEAE1; --ink-2:#B4AFA2; --ink-3:#847F72;
  --rule:#35322A; --rule-2:#474338;
  --seal:#DF7A63; --seal-soft:rgba(223,122,99,.13); --seal-line:rgba(223,122,99,.42);
  --right:#7DBE92; --right-soft:rgba(125,190,146,.13); --right-line:rgba(125,190,146,.42);
  --grid:rgba(237,234,225,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  --g-ru:#E0745C;  --g-dao:#6FB795; --g-mofa:#BFA588; --g-bud:#C288B4;
  --g-anc:#7FA6E0;  --g-mod:#8FBBC6; --g-norm:#D8D3C4; --g-just:#A197E6;
  --g-envi:#A2C75B; --g-cult:#E9A05A; --g-care:#E68CA8;
}

*{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; color:var(--ink);
  background:
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 30px),
    var(--paper);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--seal); outline-offset:3px; border-radius:3px}
.wrap{max-width:46rem; margin:0 auto; padding:0 1.15rem 5rem}
#play,#result,#setup{scroll-margin-top:4.6rem}

/* ══ 머리 ══════════════════════════════════════════════════════════ */
.top{
  position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--rule); margin-bottom:1.6rem;
}
.top .bar{height:2px; background:var(--rule); position:relative}
.top .bar i{position:absolute; inset:0 auto 0 0; background:var(--seal); width:0; transition:width .3s}
.top .row{
  max-width:46rem; margin:0 auto; padding:.7rem 1.15rem;
  display:flex; align-items:baseline; gap:.8rem;
}
.top h1{
  margin:0; font-family:"Gowun Batang",serif; font-weight:700; font-size:1.08rem;
  letter-spacing:-.01em; white-space:nowrap;
}
.top h1 .seal{
  display:inline-block; margin-right:.45rem; padding:.1em .32em .16em;
  background:var(--seal); color:var(--paper); border-radius:2px; font-size:.78em; vertical-align:.08em;
}
.counter{
  font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--ink-3);
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.counter b{color:var(--ink-2); font-weight:500}
.score{margin-left:auto; display:flex; gap:.55rem; font-family:"IBM Plex Mono",monospace; font-size:.74rem; font-variant-numeric:tabular-nums}
.score .o{color:var(--right)} .score .x{color:var(--seal)}
.quit{
  font:inherit; font-size:.72rem; background:none; border:1px solid var(--rule-2); color:var(--ink-3);
  padding:.24rem .46rem; border-radius:2px; cursor:pointer;
}
.quit:hover{border-color:var(--seal-line); color:var(--seal)}

/* ══ 시작 화면 ═════════════════════════════════════════════════════ */
.lede{
  font-family:"Gowun Batang",serif; font-size:1.28rem; line-height:1.62; text-wrap:pretty;
  margin:2.4rem 0 .6rem;
}
.sub{font-size:.87rem; line-height:1.72; color:var(--ink-2); margin:0 0 2rem; text-wrap:pretty}
.sechead{
  display:flex; align-items:baseline; gap:.6rem; margin:2rem 0 .75rem;
  font-family:"IBM Plex Mono",monospace; font-size:.65rem; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-3);
}
.sechead::after{content:""; flex:1; height:1px; background:var(--rule)}
.sechead .note{text-transform:none; letter-spacing:.02em; font-family:inherit; color:var(--ink-3); font-size:.7rem}

.opts{display:flex; flex-wrap:wrap; gap:.4rem}
.opt{
  font:inherit; font-size:.8rem; padding:.46rem .68rem; cursor:pointer; border-radius:2px;
  background:var(--surface); border:1px solid var(--rule-2); color:var(--ink-2); text-align:left;
  transition:background .12s, border-color .12s, color .12s;
}
.opt:hover{border-color:var(--ink-3); color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.opt .n{font-family:"IBM Plex Mono",monospace; font-size:.68rem; opacity:.72; margin-left:.42rem}
.opt small{display:block; font-size:.68rem; opacity:.72; margin-top:.16rem; font-weight:400}

.people{display:grid; grid-template-columns:repeat(auto-fill,minmax(8.2rem,1fr)); gap:.3rem}
.person{
  font:inherit; font-size:.79rem; padding:.42rem .55rem; cursor:pointer; border-radius:2px;
  display:flex; align-items:center; gap:.42rem; text-align:left;
  background:var(--surface); border:1px solid var(--rule); color:var(--ink-2);
}
.person:hover{border-color:var(--rule-2); color:var(--ink)}
.person[aria-pressed="true"]{background:var(--seal-soft); border-color:var(--seal-line); color:var(--ink)}
.person .k{width:.52rem; height:.52rem; border-radius:50%; flex:0 0 auto}
.person .nm{font-family:"Gowun Batang",serif; font-weight:700}
.person .n{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.morebtn{
  font:inherit; font-size:.75rem; margin-top:.5rem; background:none; border:0; cursor:pointer;
  color:var(--seal); text-decoration:underline; text-underline-offset:3px; padding:.3rem 0;
}
.startbar{
  position:sticky; bottom:0; margin-top:2.4rem; padding:1rem 0 1.15rem;
  background:var(--paper); border-top:1px solid var(--rule);
  display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
}
.start{
  font:inherit; font-family:"Gowun Batang",serif; font-weight:700; font-size:1rem;
  padding:.72rem 1.5rem; cursor:pointer; border-radius:2px;
  background:var(--ink); color:var(--paper); border:1px solid var(--ink);
}
.start:hover{background:var(--seal); border-color:var(--seal)}
.start:disabled{opacity:.34; cursor:not-allowed}
.startbar .tally{font-size:.79rem; color:var(--ink-2)}
.startbar .tally b{font-family:"IBM Plex Mono",monospace; color:var(--ink); font-weight:500}
</style>
<style>
/* ══ 문제 ══════════════════════════════════════════════════════════ */
.qhead{display:flex; align-items:center; gap:.5rem; margin:1.8rem 0 .9rem; flex-wrap:wrap}
.qno{
  font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--seal);
  letter-spacing:.06em; font-variant-numeric:tabular-nums;
}
.qkind{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.1em;
  padding:.2rem .38rem; border:1px solid var(--rule-2); color:var(--ink-3); border-radius:2px;
}
.qkind.trap{border-color:var(--seal-line); color:var(--seal)}
.badge-infer{
  font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.06em;
  padding:.12rem .3rem; border:1px dashed var(--rule-2); color:var(--ink-3); border-radius:2px;
}
.pair{
  display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.85rem;
  font-family:"Gowun Batang",serif; font-weight:700; font-size:1.28rem;
}
.pair .dash{color:var(--ink-3); font-weight:400; font-size:1rem}
.stem{
  font-family:"Gowun Batang",serif; font-size:1.14rem; line-height:1.74; text-wrap:pretty;
  padding:1rem 1.1rem; background:var(--surface); border-left:2px solid var(--ink);
  margin:0 0 1.3rem;
}
.stem .mask{
  display:inline-block; min-width:2.6em; text-align:center; color:var(--seal);
  border-bottom:1.5px solid var(--seal-line); font-weight:700;
}
.ask{font-size:.95rem; line-height:1.6; color:var(--ink); margin:0 0 1rem; font-weight:500; text-wrap:pretty}

.choices{display:flex; flex-direction:column; gap:.45rem}
.choice{
  position:relative; font:inherit; font-size:.94rem; line-height:1.55; text-align:left; cursor:pointer;
  padding:.78rem 3rem .78rem .95rem; border-radius:2px;
  background:var(--surface); border:1px solid var(--rule-2); color:var(--ink);
  transition:border-color .12s, background .12s;
}
.choice:hover:not(:disabled){border-color:var(--ink-3)}
.choice:disabled{cursor:default}
.choice .lead{
  font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-3); margin-right:.6rem;
}
.choice small{display:block; font-size:.74rem; color:var(--ink-3); margin-top:.2rem}
.choice.right{border-color:var(--right-line); background:var(--right-soft)}
.choice.wrong{border-color:var(--seal-line); background:var(--seal-soft)}
.choice .mark{position:absolute; right:.7rem; top:50%; transform:translateY(-50%); width:1.9rem; height:1.9rem}
.choice .mark path,.choice .mark circle{fill:none; stroke-width:2.1; stroke-linecap:round}
.choice.right .mark circle{stroke:var(--right)}
.choice.wrong .mark path{stroke:var(--seal)}
@media (prefers-reduced-motion:no-preference){
  .choice .mark circle,.choice .mark path{stroke-dasharray:90; stroke-dashoffset:90; animation:ink .42s ease-out forwards}
  .choice .mark path:nth-child(2){animation-delay:.16s}
}
@keyframes ink{to{stroke-dashoffset:0}}

/* ══ 해설 ══════════════════════════════════════════════════════════ */
.feedback{margin-top:1.3rem; border-top:2px solid var(--ink); padding-top:.95rem}
.verdict{
  display:flex; align-items:center; gap:.5rem; font-family:"Gowun Batang",serif;
  font-weight:700; font-size:1.02rem; margin-bottom:.6rem;
}
.verdict.o{color:var(--right)} .verdict.x{color:var(--seal)}
.truth{
  font-family:"Gowun Batang",serif; font-size:1rem; line-height:1.6; color:var(--ink);
  margin:0 0 .55rem; text-wrap:pretty;
}
.why{font-size:.86rem; line-height:1.72; color:var(--ink-2); margin:0; text-wrap:pretty}
.why .src{
  display:block; margin-top:.5rem; font-family:"IBM Plex Mono",monospace;
  font-size:.66rem; color:var(--ink-3); letter-spacing:.02em;
}
.next{
  font:inherit; font-family:"Gowun Batang",serif; font-weight:700; font-size:.94rem;
  margin-top:1.15rem; padding:.62rem 1.3rem; cursor:pointer; border-radius:2px;
  background:var(--ink); color:var(--paper); border:1px solid var(--ink);
}
.next:hover{background:var(--seal); border-color:var(--seal)}

/* ══ 결과 ══════════════════════════════════════════════════════════ */
.result-top{display:flex; align-items:center; gap:1.6rem; margin:2.4rem 0 .5rem; flex-wrap:wrap}
.ring{position:relative; width:7.5rem; height:7.5rem; flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:6}
.ring .bg{stroke:var(--rule)}
.ring .fg{stroke:var(--seal); stroke-linecap:round; transition:stroke-dashoffset .8s ease-out}
.ring .num{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
}
.ring .num b{font-size:1.85rem; font-weight:500; line-height:1}
.ring .num span{font-size:.66rem; color:var(--ink-3); margin-top:.25rem; letter-spacing:.08em}
.result-top .said{font-family:"Gowun Batang",serif; font-size:1.22rem; line-height:1.58; flex:1 1 14rem; text-wrap:pretty}
.bykind{display:flex; flex-direction:column; gap:.45rem; margin-top:.4rem}
.bykind .row{display:flex; align-items:center; gap:.6rem; font-size:.8rem}
.bykind .nm{width:7.5rem; flex:0 0 auto; color:var(--ink-2)}
.bykind .track{flex:1; height:.4rem; background:var(--rule); border-radius:2px; overflow:hidden}
.bykind .track i{display:block; height:100%; background:var(--right)}
.bykind .val{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3); font-variant-numeric:tabular-nums; width:3.4rem; text-align:right}

.misses{display:flex; flex-direction:column; gap:.5rem}
.miss{padding:.7rem .85rem; background:var(--surface); border:1px solid var(--rule); border-left:2px solid var(--seal); border-radius:2px}
.miss .q{font-family:"Gowun Batang",serif; font-weight:700; font-size:.92rem; margin-bottom:.28rem; text-wrap:pretty}
.miss .kindtag{
  display:inline-block; margin-right:.45rem; font-family:"IBM Plex Mono",monospace; font-weight:400;
  font-size:.58rem; letter-spacing:.06em; color:var(--ink-3); border:1px solid var(--rule-2);
  border-radius:2px; padding:.1rem .28rem; vertical-align:.14em;
}
.miss .a{font-size:.78rem; line-height:1.62; color:var(--ink-2)}
.miss .a b{color:var(--right); font-weight:500}
.miss .a s{color:var(--seal); text-decoration-color:var(--seal-line)}
.again{display:flex; gap:.55rem; flex-wrap:wrap; margin-top:1.6rem}
.again button{
  font:inherit; font-size:.88rem; font-family:"Gowun Batang",serif; font-weight:700;
  padding:.6rem 1.15rem; cursor:pointer; border-radius:2px;
  background:var(--surface); border:1px solid var(--rule-2); color:var(--ink);
}
.again button.primary{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.again button:hover{border-color:var(--seal); color:var(--seal)}
.again button.primary:hover{background:var(--seal); color:var(--paper)}
.footnote{margin-top:2.6rem; padding-top:1rem; border-top:1px solid var(--rule); font-size:.75rem; line-height:1.7; color:var(--ink-3)}
.footnote a{color:var(--seal)}
.hidden{display:none !important}
@media (max-width:560px){
  .lede{font-size:1.14rem} .stem{font-size:1.05rem; padding:.85rem .9rem}
  .pair{font-size:1.12rem} .choice{font-size:.9rem; padding:.7rem 2.7rem .7rem .8rem}
  .people{grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important; animation-duration:.01ms !important}}
</style>

<header class="top">
  <div class="bar"><i id="bar"></i></div>
  <div class="row">
    <h1><span class="seal">問</span>관계 퀴즈</h1>
    <span class="counter" id="counter"></span>
    <span class="score" id="score"></span>
    <button type="button" class="quit hidden" id="quit">그만두기</button>
  </div>
</header>

<main class="wrap">
  <section id="setup"></section>
  <section id="play" class="hidden"></section>
  <section id="result" class="hidden"></section>
</main>

/* ══════════════════════════════════════════════════════════════════
   문항 생성 — 계승·비판·대립 관계에서 네 가지 유형을 만든다
   ══════════════════════════════════════════════════════════════════ */
const N = Object.fromEntries(NODES.map(n => [n.id, n]));
const GROUP_LABEL = Object.fromEntries(GROUPS.map(g => [g.id, g.label]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const gcolor = g => css('--g-' + g);

const TYPE_DESC = {
  '계승':'앞선 사상을 이어받아 발전시킴',
  '비판':'상대의 핵심 주장을 겨냥해 반박함',
  '대립':'같은 물음에 정반대로 답함'
};
/* 한글 받침에 맞는 조사 — 흄이/맹자가, 벤담을/공자를 */
function hasBatchim(w) {
  const c = w.charCodeAt(w.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return false;
  return (c - 0xAC00) % 28 !== 0;
}
const josa = (w, withB, withoutB) => w + (hasBatchim(w) ? withB : withoutB);
const ga = w => josa(w, '이', '가');
const reul = w => josa(w, '을', '를');
const wa = w => josa(w, '과', '와');
const neun = w => josa(w, '은', '는');

/* 계승은 s = 원류, t = 계승자 / 비판은 s = 비판하는 쪽, t = 비판받는 쪽 */
const sentence = (type, s, t) => type === '계승'
  ? `${ga(t)} ${reul(s)} 이어받았다`
  : `${ga(s)} ${reul(t)} 비판했다`;
const askOf = type => type === '계승' ? '누가 누구를 이어받았나?' : '누가 누구를 비판했나?';
/* 정답은 언제나 방향이 드러나는 한 문장으로 적는다 */
const truthOf = (r, A, B) => r.type === '대립'
  ? `${wa(A)} ${neun(B)} 같은 물음에 정반대로 답한다 — 대립`
  : sentence(r.type, A, B);

const KINDS = [
  { id:'type', label:'관계 유형 맞히기', desc:'계승·비판·대립 중 무엇인가' },
  { id:'dir',  label:'방향 맞히기',      desc:'누가 누구를 — 기출 최다 함정', trap:true },
  { id:'who',  label:'상대 찾기',        desc:'4지선다로 상대 사상가를 고른다' },
  { id:'ox',   label:'OX 진위 판단',     desc:'명제의 참·거짓을 판단한다' }
];

const shuffle = a => { for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

/* 이름과 유형어를 가려 정답이 새지 않게 한다 */
function maskNames(text, names) {
  let out = text;
  names.forEach(nm => { out = out.split(nm).join('◯'); });
  return out.replace(/◯(?:이|가|는|은|를|을|와|과|의|도|에게|에|로|으로)?/g, m => `<span class="mask">◯</span>${m.slice(1)}`);
}
const maskType = text => text.replace(/계승|비판|대립/g, '<span class="mask">◯◯</span>');

/* 오답 후보 — 같은 학파 → 같은 대단원 → 아무나 */
function distractors(answerId, n, pool) {
  const a = N[answerId];
  const rank = id => {
    if (id === answerId) return -1;
    const b = N[id];
    let s = 0;
    if (b.group === a.group) s += 3;
    if (b.units.some(u => a.units.includes(u))) s += 2;
    if (pool.has(id)) s += 1;
    return s;
  };
  const cands = NODES.map(x => x.id).filter(id => id !== answerId);
  const scored = shuffle(cands).map(id => ({ id, s: rank(id) })).sort((x,y) => y.s - x.s);
  return scored.slice(0, n).map(x => x.id);
}

function buildQuestions(rels, kinds, pool) {
  const out = [];
  rels.forEach(r => {
    const A = N[r.s].name, B = N[r.t].name;
    const names = [A, B];

    if (kinds.has('type')) out.push({
      kind:'type', rel:r,
      pair:[A, B],
      stem: maskType(esc(r.label)),
      ask:'이 둘의 관계는 어떤 유형인가?',
      choices: shuffle(['계승','비판','대립']).map(t => ({ text:t, sub:TYPE_DESC[t], ok:t === r.type })),
      truth: truthOf(r, A, B)
    });

    if (kinds.has('dir') && r.type !== '대립') {
      const right = sentence(r.type, A, B), wrong = sentence(r.type, B, A);
      out.push({
        kind:'dir', rel:r,
        pair:[A, B],
        stem: maskNames(esc(r.label), names),
        ask:`「${r.type}」 관계다. ${askOf(r.type)}`,
        choices: shuffle([{ text:right, ok:true }, { text:wrong, ok:false }]),
        truth: right
      });
    }

    if (kinds.has('who')) {
      /* 설명에 이름이 있으면 그쪽을 정답으로, 없으면 t를 정답으로 삼는다 */
      const answer = r.label.includes(B) || !r.label.includes(A) ? r.t : r.s;
      const given  = answer === r.t ? r.s : r.t;
      const wrongs = distractors(answer, 3, pool);
      out.push({
        kind:'who', rel:r,
        pair:null,
        stem: maskNames(esc(r.label), [N[answer].name]),
        ask:`${wa(N[given].name)} 「${r.type}」 관계인 <span class="mask">◯</span>은 누구인가?`,
        choices: shuffle([answer, ...wrongs]).map(id => ({ text:N[id].name, sub:N[id].school, ok:id === answer })),
        truth: truthOf(r, A, B)
      });
    }

    if (kinds.has('ox')) {
      const flip = Math.random() < 0.5;
      let claim, ok;
      if (r.type === '대립') {
        const other = pick(['계승','비판']);
        claim = flip ? `${wa(A)} ${neun(B)} 같은 물음에 정반대로 답하는 대립 관계다.`
                     : (other === '계승' ? sentence('계승', A, B) + '.' : sentence('비판', A, B) + '.');
        ok = flip;
      } else {
        claim = flip ? sentence(r.type, A, B) + '.' : sentence(r.type, B, A) + '.';
        ok = flip;
      }
      out.push({
        kind:'ox', rel:r, pair:null, stem:null,
        ask: claim,
        choices: [{ text:'O', sub:'맞다', ok }, { text:'X', sub:'아니다', ok: !ok }],
        truth: truthOf(r, A, B)
      });
    }
  });
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   상태와 화면
   ══════════════════════════════════════════════════════════════════ */
const state = {
  people: new Set(),                                    // 비어 있으면 전체
  kinds: new Set(KINDS.map(k => k.id)),
  count: 20,
  includeInfer: false,
  qs: [], i: 0, log: [], answered: false
};
const $ = id => document.getElementById(id);
const setupEl = $('setup'), playEl = $('play'), resultEl = $('result');

/* 사상가별 문항 수 */
function relsFor(peopleSet, includeInfer) {
  return RELS.filter(r => (includeInfer || !r.infer) &&
    (peopleSet.size === 0 || peopleSet.has(r.s) || peopleSet.has(r.t)));
}
function countByPerson(includeInfer) {
  const c = {};
  RELS.filter(r => includeInfer || !r.infer).forEach(r => { c[r.s] = (c[r.s]||0)+1; c[r.t] = (c[r.t]||0)+1; });
  return c;
}
const poolIds = () => new Set(relsFor(state.people, state.includeInfer).flatMap(r => [r.s, r.t]));

function availableCount() {
  const rels = relsFor(state.people, state.includeInfer);
  let n = 0;
  rels.forEach(r => {
    if (state.kinds.has('type')) n++;
    if (state.kinds.has('dir') && r.type !== '대립') n++;
    if (state.kinds.has('who')) n++;
    if (state.kinds.has('ox')) n++;
  });
  return n;
}

/* ── 시작 화면 ───────────────────────────────────────────────────── */
let showAllPeople = false;
function renderSetup() {
  const counts = countByPerson(state.includeInfer);
  const ranked = NODES.filter(n => counts[n.id]).sort((a,b) => counts[b.id]-counts[a.id] || a.name.localeCompare(b.name,'ko'));
  const shown = showAllPeople ? ranked : ranked.slice(0, 24);
  const total = relsFor(new Set(), state.includeInfer).length;

  setupEl.innerHTML = `
    <p class="lede">관계도의 <b>계승·비판·대립</b> ${total}건을 문제로 바꿨다.<br>누가 누구를 이어받고 누구를 겨냥했는지 — 방향까지 묻는다.</p>
    <p class="sub">교재가 <b>「비판의 방향 바꾸기」를 최다 출제 유형</b>이라고 짚은 지점이다. 비판의 주체와 대상을 뒤집은 선지가 단골이므로, 이 퀴즈는 방향을 따로 물어본다.</p>

    <div class="sechead">범위 <span class="note">고르지 않으면 전체</span></div>
    <div class="opts" style="margin-bottom:.7rem">
      <button type="button" class="opt" id="pick-all" aria-pressed="${state.people.size === 0}">사상가 전체<span class="n">${ranked.length}명</span></button>
      ${state.people.size ? `<button type="button" class="opt" id="pick-clear">선택 해제<span class="n">${state.people.size}</span></button>` : ''}
    </div>
    <div class="people">
      ${shown.map(n => `<button type="button" class="person" data-p="${n.id}" aria-pressed="${state.people.has(n.id)}">
        <span class="k" style="background:${gcolor(n.group)}"></span>
        <span class="nm">${esc(n.name)}</span><span class="n">${counts[n.id]}</span></button>`).join('')}
    </div>
    ${ranked.length > 24 ? `<button type="button" class="morebtn" id="more">${showAllPeople ? '접기' : `나머지 ${ranked.length-24}명 더 보기`}</button>` : ''}

    <div class="sechead">문제 유형</div>
    <div class="opts">
      ${KINDS.map(k => `<button type="button" class="opt" data-k="${k.id}" aria-pressed="${state.kinds.has(k.id)}">
        ${esc(k.label)}<small>${esc(k.desc)}</small></button>`).join('')}
    </div>

    <div class="sechead">문항 수</div>
    <div class="opts">
      ${[10,20,40].map(c => `<button type="button" class="opt" data-c="${c}" aria-pressed="${state.count === c}">${c}문</button>`).join('')}
      <button type="button" class="opt" data-c="0" aria-pressed="${state.count === 0}">전부<span class="n">${availableCount()}</span></button>
    </div>

    <div class="sechead">그 밖에</div>
    <div class="opts">
      <button type="button" class="opt" id="infer" aria-pressed="${state.includeInfer}">
        「엮음」 관계도 포함<small>교재가 두 사람을 직접 잇지는 않은 4건 — 시험 대비라면 끄는 쪽을 권한다</small></button>
    </div>

    <div class="startbar">
      <button type="button" class="start" id="go">시작하기</button>
      <span class="tally"><b id="avail">0</b>문항 중 <b id="willdo">0</b>문항을 뽑는다</span>
    </div>

    <p class="footnote">『생활과 윤리 전 범위 압축 요약본』(2027학년도 코드원 개념서)의 사상가 관계에서 뽑았다.
    관계 전체를 그림으로 보려면 <a href="https://claude.ai/code/artifact/88e5e342-abe1-44ac-90d0-96bb2d87583d">사상가 관계도</a>로.</p>`;

  const avail = availableCount();
  $('avail').textContent = avail;
  $('willdo').textContent = state.count === 0 ? avail : Math.min(state.count, avail);
  $('go').disabled = avail === 0 || state.kinds.size === 0;

  $('pick-all').onclick = () => { state.people.clear(); renderSetup(); };
  if ($('pick-clear')) $('pick-clear').onclick = () => { state.people.clear(); renderSetup(); };
  if ($('more')) $('more').onclick = () => { showAllPeople = !showAllPeople; renderSetup(); };
  setupEl.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const id = b.dataset.p;
    state.people.has(id) ? state.people.delete(id) : state.people.add(id);
    renderSetup();
  });
  setupEl.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const id = b.dataset.k;
    if (state.kinds.has(id)) { if (state.kinds.size > 1) state.kinds.delete(id); }
    else state.kinds.add(id);
    renderSetup();
  });
  setupEl.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { state.count = +b.dataset.c; renderSetup(); });
  $('infer').onclick = () => { state.includeInfer = !state.includeInfer; renderSetup(); };
  $('go').onclick = start;
}

/* ── 진행 ────────────────────────────────────────────────────────── */
function start() {
  const rels = relsFor(state.people, state.includeInfer);
  const all = shuffle(buildQuestions(rels, state.kinds, poolIds()));
  state.qs = state.count === 0 ? all : all.slice(0, state.count);
  state.i = 0; state.log = []; state.answered = false;
  setupEl.classList.add('hidden'); resultEl.classList.add('hidden');
  playEl.classList.remove('hidden'); $('quit').classList.remove('hidden');
  renderQuestion();
}

function updateChrome() {
  const n = state.qs.length, i = state.i;
  $('counter').innerHTML = n ? `<b>${Math.min(i+1,n)}</b> / ${n}` : '';
  const o = state.log.filter(l => l.ok).length, x = state.log.length - o;
  $('score').innerHTML = state.log.length ? `<span class="o">○ ${o}</span><span class="x">✗ ${x}</span>` : '';
  $('bar').style.width = n ? `${(state.log.length / n) * 100}%` : '0';
}

const MARK_O = `<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/></svg>`;
const MARK_X = `<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8 L24 24"/><path d="M24 8 L8 24"/></svg>`;

function renderQuestion() {
  updateChrome();
  const q = state.qs[state.i];
  if (!q) return finish();
  const kind = KINDS.find(k => k.id === q.kind);
  state.answered = false;

  playEl.innerHTML = `
    <div class="qhead">
      <span class="qno">문 ${String(state.i+1).padStart(2,'0')}</span>
      <span class="qkind${kind.trap ? ' trap' : ''}">${esc(kind.label)}</span>
      ${q.rel.infer ? '<span class="badge-infer" title="교재가 두 사람을 직접 잇지는 않은 연결">엮음</span>' : ''}
    </div>
    ${q.pair ? `<div class="pair">${esc(q.pair[0])}<span class="dash">—</span>${esc(q.pair[1])}</div>` : ''}
    ${q.stem ? `<p class="stem">${q.stem}</p>` : ''}
    <p class="ask">${q.ask}</p>
    <div class="choices" id="choices">
      ${q.choices.map((c,idx) => `<button type="button" class="choice" data-i="${idx}">
        <span class="lead">${'①②③④'[idx]}</span>${esc(c.text)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</button>`).join('')}
    </div>
    <div id="fb"></div>`;

  playEl.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.i));
  playEl.scrollIntoView({ block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.qs[state.i];
  const ok = q.choices[idx].ok;
  state.log.push({ q, idx, ok });

  playEl.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === idx) { b.classList.add(ok ? 'right' : 'wrong'); b.insertAdjacentHTML('beforeend', ok ? MARK_O : MARK_X); }
    else if (q.choices[i].ok) { b.classList.add('right'); b.insertAdjacentHTML('beforeend', MARK_O); }
  });

  const last = state.i === state.qs.length - 1;
  $('fb').innerHTML = `
    <div class="feedback">
      <div class="verdict ${ok ? 'o' : 'x'}">${ok ? '○ 맞다' : '✗ 틀렸다'}</div>
      <p class="truth">${esc(q.truth)}</p>
      <p class="why">${esc(q.rel.label)}
        <span class="src">${esc(N[q.rel.s].name)} ${q.rel.type === '대립' ? '↔' : '→'} ${esc(N[q.rel.t].name)} · ${esc(q.rel.type)}${q.rel.infer ? ' · 교재 밖 연결' : ''}</span></p>
      <button type="button" class="next" id="next">${last ? '결과 보기' : '다음 문제'}</button>
    </div>`;
  updateChrome();
  const nx = $('next');
  nx.onclick = () => { state.i++; renderQuestion(); };
  nx.focus({ preventScroll:true });
}

/* ── 결과 ────────────────────────────────────────────────────────── */
function finish() {
  playEl.classList.add('hidden'); $('quit').classList.add('hidden');
  resultEl.classList.remove('hidden');
  const n = state.log.length, o = state.log.filter(l => l.ok).length;
  const pct = n ? Math.round(o / n * 100) : 0;
  const misses = state.log.filter(l => !l.ok);

  const byKind = KINDS.map(k => {
    const rows = state.log.filter(l => l.q.kind === k.id);
    return rows.length ? { ...k, n: rows.length, o: rows.filter(r => r.ok).length } : null;
  }).filter(Boolean);

  const said = pct === 100 ? '전부 맞혔다. 방향까지 흔들리지 않았다.'
    : pct >= 80 ? '대체로 잡혀 있다. 틀린 것만 다시 보면 된다.'
    : pct >= 50 ? '절반은 넘겼다. 틀린 쪽에 방향 문제가 몰려 있는지 보라.'
    : '아직 관계가 안 붙었다. 관계도에서 선을 따라가며 다시 보라.';

  const C = 2 * Math.PI * 42;
  resultEl.innerHTML = `
    <div class="result-top">
      <div class="ring">
        <svg viewBox="0 0 100 100" width="120" height="120">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="num"><b>${o}<span style="font-size:.55em; color:var(--ink-3)">/${n}</span></b><span>${pct}%</span></div>
      </div>
      <p class="said">${esc(said)}</p>
    </div>

    <div class="sechead">유형별</div>
    <div class="bykind">
      ${byKind.map(k => `<div class="row">
        <span class="nm">${esc(k.label)}</span>
        <span class="track"><i style="width:${Math.round(k.o/k.n*100)}%"></i></span>
        <span class="val">${k.o}/${k.n}</span></div>`).join('')}
    </div>

    ${misses.length ? `<div class="sechead">틀린 문제 <span class="note">${misses.length}개</span></div>
      <div class="misses">${misses.map(m => {
        const kindLabel = KINDS.find(k => k.id === m.q.kind).label;
        const head = m.q.kind === 'ox' ? m.q.ask : m.q.truth;
        return `<div class="miss">
        <div class="q"><span class="kindtag">${esc(kindLabel)}</span>${esc(head)}</div>
        <div class="a">고른 답 <s>${esc(m.q.choices[m.idx].text)}</s> · 정답 <b>${esc(m.q.choices.find(c => c.ok).text)}</b>
        ${m.q.kind === 'ox' ? `<br>사실 — ${esc(m.q.truth)}` : ''}
        <br>${esc(m.q.rel.label)}</div>
      </div>`; }).join('')}</div>` : ''}

    <div class="again">
      ${misses.length ? '<button type="button" class="primary" id="retry">틀린 것만 다시</button>' : ''}
      <button type="button" ${misses.length ? '' : 'class="primary"'} id="rerun">같은 조건으로 다시</button>
      <button type="button" id="back">조건 바꾸기</button>
    </div>

    <p class="footnote">해설은 관계도에 실린 원문 서술 그대로다.
    관계 전체를 그림으로 보려면 <a href="https://claude.ai/code/artifact/88e5e342-abe1-44ac-90d0-96bb2d87583d">사상가 관계도</a>로.</p>`;

  requestAnimationFrame(() => {
    const fg = resultEl.querySelector('.ring .fg');
    if (fg) fg.style.strokeDashoffset = C * (1 - pct/100);
  });
  updateChrome();
  $('counter').innerHTML = ''; $('bar').style.width = '100%';

  if ($('retry')) $('retry').onclick = () => {
    state.qs = shuffle(misses.map(m => m.q)); state.i = 0; state.log = []; state.answered = false;
    resultEl.classList.add('hidden'); playEl.classList.remove('hidden'); $('quit').classList.remove('hidden');
    renderQuestion();
  };
  $('rerun').onclick = start;
  $('back').onclick = toSetup;
  resultEl.scrollIntoView({ block:'start' });
}

function toSetup() {
  playEl.classList.add('hidden'); resultEl.classList.add('hidden'); $('quit').classList.add('hidden');
  setupEl.classList.remove('hidden');
  $('counter').innerHTML = ''; $('score').innerHTML = ''; $('bar').style.width = '0';
  renderSetup();
  scrollTo({ top:0 });
}
$('quit').onclick = () => { if (state.log.length) finish(); else toSetup(); };

document.addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if (playEl.classList.contains('hidden')) return;
  if (state.answered && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); $('next')?.click(); return; }
  const n = parseInt(ev.key, 10);
  if (!state.answered && n >= 1 && n <= 4) {
    const b = playEl.querySelector(`.choice[data-i="${n-1}"]`);
    if (b) { ev.preventDefault(); b.click(); }
  }
});

renderSetup();
</script>
