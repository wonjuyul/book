<title>생활과 윤리 사상가 관계도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ══ 토큰: 종이와 먹 ═══════════════════════════════════════════════ */
:root{
  --paper:#EFEEE9; --surface:#F8F7F3; --surface-2:#E8E6DF;
  --ink:#1B1A17; --ink-2:#54514A; --ink-3:#8A8578;
  --rule:#D8D5CB; --rule-2:#C4C0B3;
  --seal:#A8382C; --seal-soft:rgba(168,56,44,.10); --seal-line:rgba(168,56,44,.34);
  --grid:rgba(27,26,23,.045);
  --shadow:0 1px 2px rgba(27,26,23,.06), 0 8px 24px rgba(27,26,23,.07);

  --g-ru:#A6402F;  --g-dao:#3F7A63; --g-mofa:#6B5844; --g-bud:#7A4370;
  --g-anc:#2F5590;  --g-mod:#4E7580; --g-norm:#2E2D28; --g-just:#5A4E9C;
  --g-envi:#5A7A2E; --g-cult:#C2661A; --g-care:#B04A6B;

  --e-inherit:#4E7580; --e-critique:#A8382C; --e-oppose:#8C3F5E;
  --e-similar:#63805E; --e-compare:#8A8578;
  --node-label:#1B1A17; --node-halo:#EFEEE9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171612; --surface:#201E19; --surface-2:#2A2822;
    --ink:#EDEAE1; --ink-2:#B4AFA2; --ink-3:#847F72;
    --rule:#35322A; --rule-2:#474338;
    --seal:#DF7A63; --seal-soft:rgba(223,122,99,.14); --seal-line:rgba(223,122,99,.40);
    --grid:rgba(237,234,225,.045);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.42);

    --g-ru:#E0745C;  --g-dao:#6FB795; --g-mofa:#BFA588; --g-bud:#C288B4;
    --g-anc:#7FA6E0;  --g-mod:#8FBBC6; --g-norm:#D8D3C4; --g-just:#A197E6;
    --g-envi:#A2C75B; --g-cult:#E9A05A; --g-care:#E68CA8;

    --e-inherit:#8FBBC6; --e-critique:#E0745C; --e-oppose:#D28AAE;
    --e-similar:#9BBF95; --e-compare:#847F72;
    --node-label:#EDEAE1; --node-halo:#171612;
  }
}
:root[data-theme="dark"]{
  --paper:#171612; --surface:#201E19; --surface-2:#2A2822;
  --ink:#EDEAE1; --ink-2:#B4AFA2; --ink-3:#847F72;
  --rule:#35322A; --rule-2:#474338;
  --seal:#DF7A63; --seal-soft:rgba(223,122,99,.14); --seal-line:rgba(223,122,99,.40);
  --grid:rgba(237,234,225,.045);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.42);

  --g-ru:#E0745C;  --g-dao:#6FB795; --g-mofa:#BFA588; --g-bud:#C288B4;
  --g-anc:#7FA6E0;  --g-mod:#8FBBC6; --g-norm:#D8D3C4; --g-just:#A197E6;
  --g-envi:#A2C75B; --g-cult:#E9A05A; --g-care:#E68CA8;

  --e-inherit:#8FBBC6; --e-critique:#E0745C; --e-oppose:#D28AAE;
  --e-similar:#9BBF95; --e-compare:#847F72;
  --node-label:#EDEAE1; --node-halo:#171612;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-weight:400; -webkit-font-smoothing:antialiased;
  height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
:focus-visible{outline:2px solid var(--seal); outline-offset:2px; border-radius:3px}

/* ══ 머리 ══════════════════════════════════════════════════════════ */
.masthead{
  flex:0 0 auto; display:flex; align-items:baseline; gap:1rem 1.5rem; flex-wrap:wrap;
  padding:.85rem 1.25rem .7rem; border-bottom:1px solid var(--rule); background:var(--surface);
}
.masthead h1{
  margin:0; font-family:"Gowun Batang",serif; font-weight:700;
  font-size:1.32rem; letter-spacing:-.01em; white-space:nowrap;
}
.masthead h1 .seal{
  display:inline-block; margin-right:.5rem; padding:.1em .34em .16em;
  background:var(--seal); color:var(--paper); border-radius:2px;
  font-size:.78em; vertical-align:.08em; letter-spacing:.02em;
}
.tally{
  font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3);
  letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.tally b{color:var(--ink-2); font-weight:500}
.search{margin-left:auto; position:relative; display:flex; align-items:center}
.search input{
  font:inherit; font-size:.82rem; width:min(15rem,42vw);
  padding:.42rem .7rem .42rem 1.9rem; color:var(--ink);
  background:var(--paper); border:1px solid var(--rule-2); border-radius:2px;
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute; left:.6rem; width:.85rem; height:.85rem; stroke:var(--ink-3); fill:none; stroke-width:1.7}
.hits{
  position:absolute; top:calc(100% + .35rem); right:0; width:min(20rem,80vw); z-index:40;
  background:var(--surface); border:1px solid var(--rule-2); box-shadow:var(--shadow);
  max-height:60vh; overflow-y:auto; display:none;
}
.hits.on{display:block}
.hits button{
  display:flex; align-items:baseline; gap:.5rem; width:100%; text-align:left; font:inherit;
  padding:.45rem .7rem; background:none; border:0; border-bottom:1px solid var(--rule); cursor:pointer; color:var(--ink);
}
.hits button:last-child{border-bottom:0}
.hits button:hover,.hits button[aria-selected="true"]{background:var(--seal-soft)}
.hits .hn{font-family:"Gowun Batang",serif; font-weight:700; font-size:.9rem}
.hits .hs{font-size:.68rem; color:var(--ink-3)}

/* ══ 도구 막대 ═════════════════════════════════════════════════════ */
.toolbar{
  flex:0 0 auto; display:flex; align-items:center; gap:.4rem 1.1rem; flex-wrap:wrap;
  padding:.5rem 1.25rem; border-bottom:1px solid var(--rule); background:var(--surface);
  font-size:.75rem;
}
.fgroup{display:flex; align-items:center; gap:.32rem}
.flabel{
  font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); margin-right:.15rem;
}
.chip{
  font:inherit; font-size:.73rem; line-height:1; padding:.34rem .52rem; cursor:pointer;
  background:var(--paper); color:var(--ink-2);
  border:1px solid var(--rule-2); border-radius:2px; transition:background .12s,color .12s,border-color .12s;
}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="false"]{opacity:.42; text-decoration:line-through; text-decoration-thickness:1px}
.chip.unit[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip .swatch{display:inline-block; width:.6rem; height:.15rem; margin-right:.34rem; vertical-align:.16em; border-radius:1px}
.chip.rel[aria-pressed="true"]{color:var(--ink)}
.reset{margin-left:auto; color:var(--seal); border-color:var(--seal-line); background:transparent}
.reset:hover{background:var(--seal-soft); border-color:var(--seal)}

/* ══ 본체 ══════════════════════════════════════════════════════════ */
.stage{flex:1 1 auto; display:grid; grid-template-columns:1fr minmax(320px,25rem); min-height:0}
.plot{position:relative; min-width:0; overflow:hidden; background:
  repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 34px),
  repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 34px), var(--paper);}
#graph{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
#graph.dragging{cursor:grabbing}

.node-label{
  font-family:"Gowun Batang",serif; font-weight:700; font-size:12.5px; fill:var(--node-label);
  paint-order:stroke; stroke:var(--node-halo); stroke-width:3.4px; stroke-linejoin:round;
  pointer-events:none; user-select:none;
}
.node-label.lg{font-size:15px; stroke-width:4px}
.node-dot{cursor:pointer; transition:opacity .18s}
.node-dot circle{transition:stroke-width .15s, r .15s}
.edge{fill:none; transition:opacity .18s}
.edge-hit{fill:none; stroke:transparent; stroke-width:10; cursor:pointer}
.dim{opacity:.09}
.dim .node-label{opacity:.5}
.hidden{display:none}
.lbl-off{display:none}

/* 범례 겸 학파 필터 — 도표 아래 가로 띠 */
.legend{
  position:absolute; left:0; right:0; bottom:0; z-index:10;
  display:flex; align-items:center; flex-wrap:wrap; gap:.05rem .1rem; max-height:5.2rem; overflow-y:auto;
  padding:.28rem .5rem; border-top:1px solid var(--rule);
  background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter:blur(6px); scrollbar-width:thin;
}
.legend .flabel{flex:0 0 auto; margin-right:.35rem}
.legend button{
  display:flex; align-items:center; gap:.36rem; flex:0 0 auto; font:inherit;
  font-size:.7rem; padding:.24rem .36rem; background:none; border:0; border-radius:2px;
  cursor:pointer; color:var(--ink-2); white-space:nowrap;
}
.legend button:hover{background:var(--seal-soft); color:var(--ink)}
.legend button[aria-pressed="false"]{opacity:.34}
.legend .k{width:.58rem; height:.58rem; border-radius:50%; flex:0 0 auto}
.legend .n{font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3); font-variant-numeric:tabular-nums}

.zoombar{position:absolute; right:.7rem; top:.7rem; z-index:10; display:flex}
.zoombar button{
  font:inherit; width:1.8rem; height:1.8rem; cursor:pointer; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--rule-2); margin-left:-1px; line-height:1;
}
.zoombar button:first-child{margin-left:0}
.zoombar button:hover{background:var(--seal-soft); color:var(--ink)}

/* 간선 말풍선 */
.etip{
  position:absolute; z-index:30; pointer-events:none; max-width:22rem; padding:.5rem .65rem;
  background:var(--surface); border:1px solid var(--rule-2); box-shadow:var(--shadow);
  font-size:.74rem; line-height:1.55; color:var(--ink-2); opacity:0; transition:opacity .12s;
}
.etip.on{opacity:1}
.etip .eh{display:flex; align-items:center; gap:.4rem; margin-bottom:.25rem; color:var(--ink)}
.etip .eh b{font-family:"Gowun Batang",serif; font-size:.86rem}
.etip .eh .rel{
  font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.1em;
  padding:.1rem .3rem; border:1px solid currentColor; border-radius:2px;
}
</style>
<style>
/* ══ 상세 패널 ═════════════════════════════════════════════════════ */
.panel{
  border-left:1px solid var(--rule); background:var(--surface);
  overflow-y:auto; overscroll-behavior:contain; min-height:0;
}
.panel-in{padding:1.15rem 1.25rem 3rem}
.ph{display:flex; align-items:flex-start; gap:.7rem; margin-bottom:.15rem}
.ph .mark{width:.72rem; height:.72rem; border-radius:50%; flex:0 0 auto; margin-top:.42rem}
.ph h2{
  margin:0; font-family:"Gowun Batang",serif; font-weight:700; font-size:1.55rem;
  letter-spacing:-.01em; text-wrap:balance; line-height:1.2;
}
.ph .orig{display:block; font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-3); margin-top:.3rem; letter-spacing:.02em}
.badges{display:flex; flex-wrap:wrap; gap:.3rem; margin:.7rem 0 .9rem}
.badge{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.06em;
  padding:.2rem .38rem; border:1px solid var(--rule-2); color:var(--ink-2); border-radius:2px;
}
.badge.school{border-color:currentColor}
.badge.unit{color:var(--ink-3)}
.tagline{
  font-family:"Gowun Batang",serif; font-size:1.02rem; line-height:1.62; color:var(--ink);
  padding:.7rem 0 .85rem; border-top:1px solid var(--rule); border-bottom:2px solid var(--ink);
  text-wrap:pretty;
}
.sechead{
  display:flex; align-items:baseline; gap:.5rem; margin:1.5rem 0 .6rem;
  font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-3);
}
.sechead::after{content:""; flex:1; height:1px; background:var(--rule)}
ol.core{margin:0; padding:0; list-style:none; counter-reset:c; display:flex; flex-direction:column; gap:.62rem}
ol.core li{
  counter-increment:c; position:relative; padding-left:1.55rem;
  font-size:.845rem; line-height:1.68; color:var(--ink-2); text-wrap:pretty;
}
ol.core li::before{
  content:counter(c,decimal-leading-zero); position:absolute; left:0; top:.16rem;
  font-family:"IBM Plex Mono",monospace; font-size:.63rem; color:var(--seal); font-variant-numeric:tabular-nums;
}
.rels{display:flex; flex-direction:column; gap:.9rem}
.relgrp{display:flex; flex-direction:column; gap:.28rem}
.relgrp>h4{
  margin:0 0 .1rem; font-size:.7rem; font-weight:500; letter-spacing:.04em;
  display:flex; align-items:center; gap:.4rem;
}
.relgrp>h4 .bar{width:1.4rem; height:0; border-top-width:2px; border-top-style:solid}
.relgrp>h4 .cnt{font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3)}
button.rel-item{
  display:block; width:100%; text-align:left; font:inherit; cursor:pointer; color:var(--ink-2);
  background:var(--paper); border:1px solid var(--rule); border-left-width:2px; padding:.44rem .58rem;
  transition:border-color .12s, background .12s;
}
button.rel-item:hover{background:var(--surface-2); border-color:var(--rule-2)}
button.rel-item .who{
  display:flex; align-items:baseline; gap:.35rem; font-family:"Gowun Batang",serif;
  font-weight:700; font-size:.9rem; color:var(--ink); margin-bottom:.16rem;
}
button.rel-item .arrow{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-3); font-weight:400}
button.rel-item .why{font-size:.755rem; line-height:1.6; text-wrap:pretty}
.tbtns{display:flex; flex-direction:column; gap:.3rem}
button.tbtn{
  display:flex; align-items:center; gap:.5rem; width:100%; text-align:left; font:inherit; cursor:pointer;
  font-size:.79rem; color:var(--ink-2); background:var(--paper);
  border:1px solid var(--rule-2); padding:.46rem .58rem; transition:background .12s,color .12s;
}
button.tbtn:hover{background:var(--seal-soft); color:var(--ink); border-color:var(--seal-line)}
button.tbtn .ti{font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--seal); letter-spacing:.08em}
button.tbtn .tu{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3)}

/* 안내(빈 상태) */
.intro p{font-size:.85rem; line-height:1.72; color:var(--ink-2); margin:0 0 .8rem; text-wrap:pretty}
.intro .lead{
  font-family:"Gowun Batang",serif; font-size:1.06rem; line-height:1.66; color:var(--ink);
  border-bottom:2px solid var(--ink); padding-bottom:.85rem; margin-bottom:1rem;
}
.keymap{display:flex; flex-direction:column; gap:.5rem; margin:0; padding:0}
.keymap div{display:flex; align-items:flex-start; gap:.6rem; font-size:.79rem; line-height:1.6; color:var(--ink-2)}
.keymap svg{flex:0 0 auto; width:2.5rem; height:1rem; margin-top:.16rem; overflow:visible}
.keymap b{color:var(--ink); font-weight:500}
.hubs{display:flex; flex-wrap:wrap; gap:.3rem}
.hubs button{
  font:inherit; font-size:.78rem; font-family:"Gowun Batang",serif; font-weight:700; cursor:pointer;
  padding:.28rem .5rem; background:var(--paper); border:1px solid var(--rule-2); color:var(--ink); border-radius:2px;
}
.hubs button:hover{background:var(--seal-soft); border-color:var(--seal-line)}
.hubs button .d{font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3); font-weight:400; margin-left:.3rem}

/* ══ 비교표 모달 ═══════════════════════════════════════════════════ */
.scrim{
  position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
  padding:1.5rem; background:rgba(0,0,0,.45); background:color-mix(in srgb, var(--ink) 44%, transparent);
}
.scrim.on{display:flex}
.modal{
  background:var(--surface); border:1px solid var(--rule-2); box-shadow:var(--shadow);
  width:min(60rem,100%); max-height:min(85dvh,54rem); display:flex; flex-direction:column;
}
.modal header{
  display:flex; align-items:center; gap:.8rem; padding:.9rem 1.1rem;
  border-bottom:1px solid var(--rule); flex:0 0 auto;
}
.modal header h3{margin:0; font-family:"Gowun Batang",serif; font-weight:700; font-size:1.12rem; text-wrap:balance}
.modal header .tu{font-family:"IBM Plex Mono",monospace; font-size:.65rem; color:var(--ink-3)}
.modal header button{
  margin-left:auto; font:inherit; font-size:1.1rem; line-height:1; cursor:pointer; color:var(--ink-2);
  background:none; border:1px solid var(--rule-2); width:1.9rem; height:1.9rem; flex:0 0 auto;
}
.modal header button:hover{background:var(--seal-soft); color:var(--ink)}
.tscroll{overflow:auto; padding:0 1.1rem 1.1rem; flex:1 1 auto}
table{border-collapse:collapse; width:100%; font-size:.79rem; line-height:1.62; min-width:34rem}
thead th{
  position:sticky; top:0; background:var(--surface); text-align:left; vertical-align:bottom;
  padding:.7rem .6rem .5rem; border-bottom:2px solid var(--ink); font-weight:500; font-size:.76rem;
  color:var(--ink); white-space:nowrap; z-index:1;
}
tbody th{
  text-align:left; vertical-align:top; padding:.6rem .6rem; font-weight:500; color:var(--ink);
  border-bottom:1px solid var(--rule); white-space:nowrap; font-size:.76rem;
}
tbody td{vertical-align:top; padding:.6rem .6rem; border-bottom:1px solid var(--rule); color:var(--ink-2); text-wrap:pretty}
tbody tr:hover th,tbody tr:hover td{background:var(--paper)}
.modal .members{
  display:flex; flex-wrap:wrap; gap:.28rem; padding:.7rem 1.1rem; border-bottom:1px solid var(--rule); flex:0 0 auto;
}
.modal .members button{
  font:inherit; font-size:.73rem; font-family:"Gowun Batang",serif; font-weight:700; cursor:pointer;
  padding:.2rem .42rem; background:var(--paper); border:1px solid var(--rule-2); color:var(--ink); border-radius:2px;
}
.modal .members button:hover{background:var(--seal-soft); border-color:var(--seal-line)}

/* ══ 좁은 화면 ═════════════════════════════════════════════════════ */
@media (max-width:880px){
  .stage{grid-template-columns:1fr; grid-template-rows:minmax(38dvh,1fr) minmax(0,42dvh)}
  .legend{flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; max-height:2.3rem}
  .tally{display:none}
  .chip{padding:.3rem .44rem; font-size:.7rem}
  .flabel{font-size:.6rem}
  .panel{border-left:0; border-top:1px solid var(--rule)}
  .panel-in{padding:1rem 1rem 2rem}
  .masthead{padding:.7rem .9rem .55rem}
  .masthead h1{font-size:1.1rem}
  .search{width:100%; margin-left:0}
  .search input{width:100%}
  .toolbar{padding:.45rem .9rem; gap:.35rem .7rem}
    .ph h2{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important; animation-duration:.01ms !important}
}
</style>

<header class="masthead">
  <h1><span class="seal">生倫</span>사상가 관계도</h1>
  <div class="tally">사상가 <b id="tally-n">0</b> · 관계 <b id="tally-l">0</b> · 비교표 <b id="tally-t">0</b></div>
  <div class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="사상가·키워드 검색  ( / )" autocomplete="off" aria-label="사상가 검색" aria-expanded="false" aria-controls="hits">
    <div class="hits" id="hits" role="listbox" aria-label="검색 결과"></div>
  </div>
</header>

<div class="toolbar">
  <div class="fgroup" id="unit-filters"><span class="flabel">대단원</span></div>
  <div class="fgroup" id="rel-filters"><span class="flabel">관계</span></div>
  <button class="chip reset" id="reset" type="button">전체 초기화</button>
</div>

<div class="stage">
  <div class="plot">
    <svg id="graph" role="img" aria-label="생활과 윤리 사상가 관계 네트워크"></svg>
    <div class="etip" id="etip" role="tooltip"></div>
    <div class="legend" id="group-filters"><span class="flabel">학파</span></div>
    <div class="zoombar">
      <button type="button" id="zin" title="확대" aria-label="확대">+</button>
      <button type="button" id="zout" title="축소" aria-label="축소">−</button>
      <button type="button" id="zfit" title="전체 보기" aria-label="전체 보기">⤢</button>

{ id:'hobbes', name:'홉스', sub:'Thomas Hobbes', group:'mod', school:'사회계약', units:[3,4,6],

    '계약 목적은 자기보존(평화·안전·질서)이며, 자연권을 대부분 양도하고 주권은 군주 또는 연합체에 있다.',
    '절대군주제 — 통치자의 기본권 침해는 계약 위반이 아니므로 저항권이 없다. 군주는 자연법상 의무는 지지만 시민법상 의무는 지지 않는다.',
    '사유재산은 사회계약 이후에 발생하며, 묵시적 동의와 법의 지배를 인정하지 않는다.',
    '"평화를 추구하라"는 제1 자연법을 말하며, 국제관계를 무정부 상태로 보는 현실주의의 원형이 된다.'

{ id:'locke', name:'로크', sub:'John Locke', group:'mod', school:'사회계약', units:[3,5],

  core:[

    '계약 목적은 상호보존(자유·생명·재산)이며 양도하는 것은 집행권·처벌권뿐이다. 주권은 국민에게 있다.',
    '입헌군주제·대의제, 입법권(인민)과 집행권(정부)의 2권 분립. 신탁을 위반하면 저항권을 행사할 수 있다.',

  ]},
{ id:'rousseau', name:'루소', sub:'Jean-Jacques Rousseau', group:'mod', school:'사회계약', units:[3],
  tagline:'일반의지에 자연권을 전부 양도한다',
  core:[

    '주권은 국민에게 있으며 공화제·직접민주제를 지향한다. 주권이 침탈되면 저항할 수 있다.',

{ id:'marx', name:'마르크스', sub:'Karl Marx', group:'mod', school:'유물론', units:[3,4,5],

    '종교는 인간 소외의 결과물이자 "인민의 아편" — 지배계급에는 체제유지 기능을, 피지배계급에는 고통의 표현이자 저항의 기능을 한다.'

{ id:'weber', name:'베버', sub:'Max Weber', group:'mod', school:'사회학', units:[3,4],

{ id:'beccaria', name:'베카리아', sub:'Cesare Beccaria', group:'mod', school:'형법개혁', units:[3],

{ id:'kant', name:'칸트', sub:'Immanuel Kant', group:'norm', school:'의무론', units:[1,2,3,4,5,6],
  tagline:'도덕법칙은 이성이 스스로 정립한다 — 형식윤리',
  core:[
    '제1 정언명령(보편법칙 정식) — "네 의지의 준칙이 언제나 동시에 보편적 입법의 원리가 될 수 있도록 행위하라." 보편화되는 것은 준칙이지 의지나 행위가 아니다.',
    '합법성과 도덕성 — 의무에 부합하는 행위(합법성)와 의무로부터의 행위(도덕성)를 구분한다. 의무로부터의 행위는 반드시 의무에 부합하지만 그 역은 성립하지 않는다.',

    '의무는 자연적 경향성을 가진 인간에게만 성립한다 — 정념 없는 신·천사에게는 도덕법칙이 정언명령으로 다가오지 않는다.',
    '자살은 원칙적으로 반대(정언명령 위반 + 자기보존 의무 위반)하되 도덕적 완성을 위한 자살은 인정한다.',
    '동물에 대한 의무는 직접적 의무가 아니라 인간성에 대한 간접적 의무다.',

    '영구평화론 — 공화적 체제, 평화연맹(세계국가가 아니다), 세계시민법(방문권=환대권, 체류권은 아니다).'

{ id:'bentham', name:'벤담', sub:'Jeremy Bentham', group:'norm', school:'양적 공리주의', units:[1,2,3,4],

    '양적 공리주의 — 모든 쾌락·고통은 양으로 계산 가능하다(강도·지속성·확실성 등 7가지 기준). 교육과정상 질적 차이를 인정하지 않는 것으로 간주한다.',
    '"고통의 부재 = 쾌락"이므로 고통의 최소화도 벤담에 부합한다. 개개인의 쾌락의 합이 곧 사회 전체의 쾌락이다.',
    '이익 평등 고려 — "한 사람은 오직 한 사람으로만 계산한다." 타인의 이익에 가중치를 두는 것은 이 원칙에 반한다.',
    '"고려해야 하는 것은 이성이 아니라 고통을 느낄 수 있는가이다" — 동물중심주의의 근거가 된다.',
    '형벌의 목적은 범죄 예방이며, 예방 효과가 없으면 형벌은 불필요하다. 입법 원리와 도덕 원리 모두 유용성 원리로 삼는다.'
  ]},
{ id:'mill', name:'밀', sub:'John Stuart Mill', group:'norm', school:'질적 공리주의', units:[1,2,5,6],

  ]},
{ id:'macintyre', name:'매킨타이어', sub:'Alasdair MacIntyre', group:'norm', school:'공동체주의 덕윤리', units:[1,3,4],

    '도구적 행위(성공 지향적·이해타산적)와 의사소통 행위(이해 지향적)를 구분하고, 체계가 생활세계에 침투하는 것을 생활세계의 식민화라 부른다.',

{ id:'jonas', name:'요나스', sub:'Hans Jonas', group:'envi', school:'책임 윤리', units:[1,4],

  core:[
    '윤리적 공백 — 과학 기술의 발달과 그것을 따라가지 못하는 도덕적 숙고 사이의 간격. 기술로 증대하는 힘만큼 책임도 증가한다.',

{ id:'popper', name:'포퍼', sub:'Karl Popper', group:'envi', school:'반증주의', units:[4,5],

{ id:'heidegger', name:'하이데거', sub:'Martin Heidegger', group:'envi', school:'실존주의·기술철학', units:[2,4,5],
  tagline:'죽음을 향한 존재 / 기술의 본질은 탈은폐다',
  core:[
    '인간은 세계에 내던져진 "세계-내-존재"이자 "현존재"이며, 삶으로 내던져짐과 동시에 죽음으로 내던져진 "죽음을 향한 존재"다.',

    '기술의 본질은 탈은폐(은폐된 것을 드러냄)다 — 기술이 수단이라는 도구적·인간학적 규정은 옳으나 본질은 아니다. 기술의 가치중립성을 부정한다.',

{ id:'jaspers', name:'야스퍼스', sub:'Karl Jaspers', group:'envi', school:'기술철학', units:[4],

    '인간이 기술의 "지도자"가 되어야 한다. 다만 기술이 인간을 지배하는 기술 지배 현상 자체는 인정한다.',

{ id:'tolstoy', name:'톨스토이', sub:'Lev Tolstoy', group:'cult', school:'예술론(도덕주의)', units:[5],

{ id:'adorno', name:'아도르노', sub:'Theodor Adorno', group:'cult', school:'프랑크푸르트학파', units:[5],
  tagline:'문화산업은 대중의 획일적 사고를 유도한다',

    '도구적 이성 — 인간은 이성으로 외적 자연과 타인뿐 아니라 내적 자연(욕구·감정)까지 지배한다.',

    '심미주의의 고급 예술까지 상업화되었으나, 그럼에도 형식과 내용의 자율성을 확보함으로써 사회 비판 기능을 수행할 수 있다.',
    '예술은 선동적 정치구호가 아니라 오직 내재적으로만 비판해야 한다 — 참여예술에 강한 거부감을 보인다.'
  ]},
{ id:'benjamin', name:'벤야민', sub:'Walter Benjamin', group:'cult', school:'프랑크푸르트학파', units:[5],

{ id:'baudrillard', name:'보드리야르', sub:'Jean Baudrillard', group:'cult', school:'소비사회론', units:[5],

{ id:'eliade', name:'엘리아데', sub:'Mircea Eliade', group:'cult', school:'종교학', units:[5],

    '성(聖)과 속(俗)은 뚜렷하게 구분되며 상호배타적이다 — 엘리아데와 갈라지는 지점이다.'

{ s:'locke',     t:'rousseau', type:'비교', label:'주권은 모두 국민에게 있지만, 로크는 입헌군주제·대의제와 2권 분립을, 루소는 일반의지에 전부 양도하는 공화제·직접민주제를 말한다.' },
{ s:'hobbes',    t:'rousseau', type:'비교', label:'자연권 양도의 상대 — 홉스는 군주 또는 연합체에 대부분을, 루소는 일반의지에 전부를 양도한다. 전쟁 상태의 원인도 자연권 vs 특수의지로 갈린다.' },
{ s:'locke',     t:'nozick',   type:'계승', label:'노동이 투입된 대상물에 소유권이 발생한다는 노동가치설과 "로크적 단서"(타인의 처지를 악화시키지 않는 한)를 그대로 이어받는다.' },
{ s:'locke',     t:'marx',     type:'계승', label:'노동가치설을 공유하지만 용도가 정반대다 — 로크는 사유재산 정당화의 논거로, 마르크스는 사유재산 부정의 논거로 쓴다.' },
{ s:'mencius',   t:'locke',    type:'비교', label:'역성혁명론과 저항권 — 통치자가 정당성을 잃으면 교체할 수 있다는 논리를 동서양이 각각 천명과 신탁으로 정당화한다.' },
{ s:'luther',    t:'calvin',   type:'계승', label:'노동의 신성화·직업 평등 위에 예정설과 "신앙의 객관적 증명(증표)"을 더해 직업소명설을 완성한다.' },
{ s:'calvin',    t:'weber',    type:'계승', label:'프로테스탄트 윤리에서 종교적 요소(구원)가 빠진 것이 자본주의 정신이고, 거기서 금욕주의마저 빠진 것이 천민자본주의다.' },
{ s:'plato',     t:'marx',     type:'비교', label:'직업관 — 계급의 고유한 능력에 따른 역할 분담이 곧 정의라는 전근대적 분업관과, 분업이 노동자를 기계의 부속품으로 만든다는 인간소외론.' },
{ s:'marx',      t:'heidegger',type:'비교', label:'현대 기술 — 마르크스는 기술 자체는 긍정하고 자본가의 전유를 문제 삼지만, 하이데거는 체제와 무관하게 기술 자체를 문제 삼는다.' },
{ s:'hobbes',    t:'kant',     type:'계승', label:'국제관계가 무정부 상태라는 홉스적 전제를 받아들이되, 평화 상태는 저절로 오지 않으며 공법에 의해 인위적으로 이룩되어야 한다고 본다.' },
{ s:'bentham',   t:'hume',     type:'비판', label:'도덕 판단의 기준을 감정에 두는 주장을 격렬히 비판한다 — 쾌락의 계산은 철저히 이성의 기능이다.' },
{ s:'schopenhauer', t:'kant',  type:'비교', label:'자살 반대의 근거 — 문제의 해결이 아니라 회피일 뿐이기 때문(쇼펜하우어) vs 정언명령과 자기보존 의무의 위반이기 때문(칸트).' },
{ s:'beccaria',  t:'kant',     type:'대립', label:'사형 — 칸트는 살인에 대해 사형 외에는 동종성이 인정되지 않는다고 보고, 베카리아는 계약 시 생명을 양도하지 않았으므로 반대하며 종신노역형을 주장한다.' },
{ s:'beccaria',  t:'rousseau', type:'대립', label:'같은 사회계약설에서 정반대 결론 — 루소는 계약 시 생명을 양도했으므로 사형에 찬성하고, 베카리아는 양도하지 않았으므로 반대한다.' },
{ s:'beccaria',  t:'bentham',  type:'유사', label:'형벌의 근거를 효용에 둔다 — 형벌은 강도보다 지속성이 중요하며, 예방 효과가 없는 형벌은 정당화되지 않는다.' },
{ s:'kant',      t:'bentham',  type:'비교', label:'형벌의 목적 — 과거의 범죄에 대한 응보이며 그 자체로 정당한가(칸트), 미래의 범죄 예방이며 효과가 없으면 불필요한가(벤담).' },

/* ── 규범윤리 3파전 ─────────────────────────────────── */
{ s:'kant',      t:'bentham',  type:'대립', label:'의무론 vs 목적론 — 행위의 근본 원칙(동기·형식)에 주목하는가, 궁극적 목적(결과·유용성)에서 출발하는가. 비판은 서로를 향한다: 내면적 동기 소홀·약자 희생 가능성 vs 형식적이고 비현실적으로 엄격함.' },
{ s:'bentham',   t:'mill',     type:'계승', label:'최대 다수의 최대 행복이라는 기준은 그대로 두고 쾌락의 질적 차이를 도입한다 — 교육과정상 벤담은 질적 차이를 인정하지 않는 것으로 간주한다.' },
{ s:'bentham',   t:'singer',   type:'계승', label:'"고려해야 하는 것은 이성이 아니라 고통을 느낄 수 있는가이다" — 쾌고감수능력을 도덕적 지위의 기준으로 삼는 동물해방론의 직접적 근거.' },
{ s:'macintyre', t:'kant',     type:'비판', label:'사회적·역사적 맥락을 간과했다 — 근대 계몽주의에서 덕은 공동체적 역할 수행이 아니라 도덕규범을 잘 지키는 상태로 축소되었다.' },
{ s:'macintyre', t:'bentham',  type:'비판', label:'공동체는 개인의 단순한 집합이 아니다 — 물에 빠진 아내와 타인 중 아내를 구해야 한다는 결론은 공리주의로는 도출되지 않고 공동체주의로만 도출된다.' },
{ s:'mill',      t:'habermas', type:'유사', label:'인간은 누구나 오류 가능성이 있는 존재이므로 토론으로 검증해야 한다 — 담론 참여자가 자신의 오류 가능성을 인정해야 한다는 원칙으로 이어진다.' },
{ s:'mill',      t:'beauvoir', type:'유사', label:'"여성의 본성이라 알려진 것들은 인위적으로 만들어 낸 것" — 여성성을 사회적 산물로 보고 남녀의 동등한 관계를 지향한다.' },
{ s:'confucius', t:'kant',     type:'유사', label:'예술은 미적 가치를 추구하면서도 바람직한 인격 형성과 도덕성 발달에 긍정적 영향을 준다는 교과서적 정리에서 나란히 놓인다.' },
{ s:'mencius',   t:'kant',     type:'유사', label:'선의지는 선천적으로 주어지되 완벽하지 않아 계발되어야 한다 — 사단을 사덕으로 확충한다는 맹자의 논리와 구조가 같다.' },

/* ── 정의론 ─────────────────────────────────────────── */
{ s:'kant',      t:'rawls',    type:'계승', label:'칸트적 인간관(절대적 가치를 지닌 자율적·존엄한 존재로서 도덕적으로 평등)이 무지의 베일이라는 장치로 구체화된다. 칸트의 역지사지를 롤스는 무지의 베일(호혜성)로 대체한다.' },
{ s:'kant',      t:'nozick',   type:'계승', label:'정언명령(인간을 목적으로 대우)에서 출발해 자기소유권 → 측면제약(인간의 불가침성) → 취득·양도에 의한 소유권으로 이어진다.' },
{ s:'nozick',    t:'rawls',    type:'비판', label:'차등 원칙은 결과의 구조를 정해 놓는 정형적 원리다 — 분배의 정의로움은 취득·양도·교정의 역사적 과정에 달렸고, 복지를 위한 재분배는 강제노동이다.' },
{ s:'walzer',    t:'rawls',    type:'비판', label:'사회적 가치는 특수하고 다원적이다 — 사회적 기본가치에서 단일 분배원칙을 끌어내는 단순평등 이론은 오히려 전제(專制)를 초래한다.' },
{ s:'macintyre', t:'rawls',    type:'대립', label:'국가의 역할 — 롤스는 인생계획·도덕교육에 대해 가치중립을 지키지만, 매킨타이어는 국가가 좋은 삶의 구상과 도덕교육에 관여해야 한다고 본다.' },
{ s:'macintyre', t:'nozick',   type:'대립', label:'국가의 역할 — 노직은 자원 배분에도 인생계획에도 개입하지 않는 최소국가를 말하지만, 매킨타이어는 공동체의 도덕교육을 국가의 기능으로 인정한다.' },
{ s:'aristotle', t:'nozick',   type:'비판', label:'"덕(공동체에 대한 기여)에 따른 분배"가 곧 노직이 부정하는 도덕적 응분(moral desert)에 따른 분배 — 정형적 원리다.' },
{ s:'aristotle', t:'rawls',    type:'비교', label:'분배의 기준 — 기하학적 비례에 따른 덕(기여)의 분배인가, 최소수혜자에게 최대 이익이 돌아가는 차등 원칙인가.' },
{ s:'marx',      t:'rawls',    type:'비교', label:'분배의 기준 — "능력에 따라 일하고 필요에 따라 분배"와 "최소수혜자의 최대 이익". 필요에 따른 분배는 롤스의 차등 원칙과 구별해야 한다.' },
{ s:'niebuhr',   t:'hobbes',   type:'유사', label:'현실주의의 계보 — 국제관계는 항구적 무정부 상태이며, 힘의 균형이 아니면 질서는 없다.' },
{ s:'niebuhr',   t:'morgenthau', type:'유사', label:'고전적 현실주의 — 결정적 요소는 힘과 이익이지만 도덕규범도 작용하며 필요하다. 지도자의 도덕성은 중시하되 힘·이익에 비해 부차적이다.' },
{ s:'niebuhr',   t:'plato',    type:'대립', label:'국제정치의 두 원형 — 플라톤이 이상주의의 원형이라면 니부어는 "국가들은 모두 위선적"이라 보는 현실주의의 대표다.' },
{ s:'niebuhr',   t:'kant',     type:'대립', label:'국제평화의 길 — 집단 간 힘의 균형(세력균형)인가, 공화적 체제와 평화연맹이라는 제도(집단안보)인가.' },
{ s:'weber',     t:'rawls',    type:'비교', label:'권위의 유형 — 전통·카리스마·합법적 권위(베버)와, 실제적 권위는 있으나 절대적 권위는 아닌 다수결 원칙(롤스).' },

/* ── 시민불복종 ─────────────────────────────────────── */
{ s:'rawls',     t:'thoreau',  type:'비교', label:'불복종의 근거 — 공유된(공공적) 정의관에 근거해 다수자의 정의감에 호소하는가, 법에 대한 존경심보다 앞서는 정의에 대한 존경심(개인의 양심)인가.' },
{ s:'rawls',     t:'singer',   type:'비교', label:'시민불복종 — 롤스는 거의 정의로운 사회와 공유된 정의관을 요구하지만, 싱어는 체제 조건도 공유된 정의관도 요구하지 않고 이익·손해의 저울질로 판단한다.' },
{ s:'rawls',     t:'dworkin',  type:'비교', label:'불복종의 기준 — 공유된 정의관인가, 헌법 정신에 반하는가.' },
{ s:'gandhi',    t:'king',     type:'유사', label:'부당한 법에 대한 불복종은 정당하되 비폭력적이어야 하며, 그 대가로서의 처벌은 감수한다.' },
{ s:'thoreau',   t:'gandhi',   type:'유사', label:'악법에 대한 불복종은 도덕적이고 정의로운 행동이다 — 개인의 양심에서 출발하는 불복종의 계보.' },
{ s:'niebuhr',   t:'rawls',    type:'비교', label:'강제력과 불복종 — 피지배집단이 행사하는 강제력(시민불복종·파업)은 정의 실현의 수단이라는 니부어와, 비폭력·공개성·최후수단성을 요건으로 거는 롤스.' },

/* ── 담론윤리 ───────────────────────────────────────── */
{ s:'habermas',  t:'kant',     type:'비판', label:'출발점은 홀로 사유하는 "나"가 아니라 대화하는 "우리"다 — 독백적 이성에서 의사소통적 합리성으로.' },
{ s:'habermas',  t:'rawls',    type:'비교', label:'타인의 동의를 얻는 방식 — 원초적 상황의 가상적 만장일치(롤스)와 현실적 대화에서의 참여자 전원 동의(하버마스). 롤스는 입헌민주주의, 하버마스는 절차적 민주주의다.' },
{ s:'habermas',  t:'apel',     type:'유사', label:'담론윤리 — 하버마스가 상호주관적 합의의 절차를 세우고, 아펠은 "인간의 상호 인정"을 그 기본 전제로 제시한다.' },
{ s:'kant',      t:'habermas', type:'계승', label:'유전자 조작 — 부모의 프로그래밍대로 태어나는 자는 부모의 목적을 위한 단순한 수단이 된다는 논증은 칸트의 목적 정식을 그대로 적용한 것이다.' },
{ s:'habermas',  t:'adorno',   type:'유사', label:'프랑크푸르트학파 — 도구적 이성 비판. 아도르노는 문화산업에서, 하버마스는 체계에 의한 생활세계의 식민화에서 그것을 읽는다.' },
{ s:'gilligan',  t:'kant',     type:'비판', label:'배려윤리의 정의윤리 비판 — 보편적 도덕 원리(정언명령)에 기댄 남성중심적 도덕은 사회적 관계·배려·공감·동정심을 간과했다.' },
{ s:'gilligan',  t:'rawls',    type:'비판', label:'배려윤리의 정의윤리 비판 — 객관적·합리적 이성과 보편적 정의 원칙만으로는 구체적 관계 속의 도덕을 담아내지 못한다.' },
{ s:'gilligan',  t:'noddings', type:'유사', label:'배려윤리 — 구체적 맥락에 근거한 의사결정, 배려자와 피배려자의 상호작용, 소수자의 권리와 존엄성 강조.' },
{ s:'gilligan',  t:'beauvoir', type:'유사', label:'여성주의 윤리와 배려윤리는 모두 남성중심 윤리에 비판적이며 남성과 여성이 평등하다고 본다.' },

/* ── 환경윤리 ───────────────────────────────────────── */
{ s:'singer',    t:'regan',    type:'비교', label:'동물중심주의의 두 축 — 감각 중심(쾌고감수능력, 공리주의)과 권리 중심(삶의 주체, 칸트 의무론의 영향). 종차별주의 반대는 공통이다.' },
{ s:'kant',      t:'regan',    type:'계승', label:'권리와 목적 대우라는 틀을 이어받아, 삶의 주체가 되는 인간과 동물은 단순한 수단이 아니라 목적으로 대우해야 한다고 본다.' },
{ s:'regan',     t:'kant',     type:'비판', label:'이성만을 기준으로 삼으면 어린아이·정신적 무능력자 같은 "가장자리 인간"에게 권리를 인정할 수 없다 — 기준은 삶의 주체여야 한다.' },
{ s:'singer',    t:'kant',     type:'비판', label:'이성을 기준으로 도덕적 지위를 나누는 것은 종차별주의다 — 기준은 쾌고감수능력이며, 같은 양의 고통은 동일한 비중으로 계산되어야 한다.' },
{ s:'kant',      t:'norton',   type:'유사', label:'인간중심주의 — 동물에 대한 의무는 인간성에 대한 간접적 의무일 뿐이며, 환경보호도 결국 인간의 이익과 세대 간 정의로 정당화된다.' },

{ s:'naess',     t:'passmore', type:'비판', label:'피상적 생태주의 비판 — 인간의 이익을 위한 환경보호로는 부족하며 세계관과 생활양식의 전환이 필요하다.' },

{ s:'leopold',   t:'naess',    type:'비교', label:'생태중심주의의 두 갈래 — 생명공동체의 온전성·안정성·아름다움을 기준으로 삼는 대지윤리와, 큰 자아 실현과 생명중심적 평등을 말하는 심층생태학.' },
{ s:'regan',     t:'leopold',  type:'비판', label:'환경파시즘 — 전체의 안정을 위해 개체를 희생하는 것을 용인한다. 개체론(개별 동물의 권리)과 전체론(생태계 자체의 도덕적 지위)의 정면 충돌.' },

{ s:'taylor',    t:'singer',   type:'유사', label:'종차별주의 반대 — 도덕적 지위를 인간 종에 한정할 근거는 없다. 다만 기준이 쾌고감수능력인가 생명 그 자체인가에서 갈린다.' },
{ s:'taylor',    t:'regan',    type:'비교', label:'의무의 목록 — 레건의 4원칙과 테일러의 4대 의무(불침해 > 보상 > 신의 > 불간섭). 신의 의무의 대상은 야생 동물뿐이다.' },
{ s:'jonas',     t:'kant',     type:'비판', label:'칸트의 정언명령은 동시대의 인간에 국한된다 — 미래세대와 자연까지 포괄하는 새로운 정언명법이 필요하다. 책임은 상호적·계약적이 아니라 일방적이다.' },
{ s:'jonas',     t:'bacon',    type:'비판', label:'기술 낙관주의 비판 — "아는 것이 힘"이라는 자연 정복의 이상이 인류 존속 자체를 위협하게 되었다. 공포의 발견술로 나쁜 예측에 우선권을 준다.' },
{ s:'jonas',     t:'heidegger',type:'유사', label:'현대 기술이 인간 존재 자체를 위협한다고 보는 점에서 만나지만, 요나스는 그 대응을 책임 윤리라는 규범으로 정식화한다.' },
{ s:'jaspers',   t:'heidegger',type:'대립', label:'기술의 가치중립성 — 야스퍼스는 긍정하며 인간이 기술의 지도자가 되어야 한다 하고, 하이데거는 부정하며 기술의 본질을 탈은폐로 본다. 야스퍼스는 하이데거가 "기술이 수단임을 간과"했다고 비판한다.' },
{ s:'heisenberg',t:'oppenheimer', type:'대립', label:'과학자의 사회적 책임 — 연구 과정 단계부터 책임이 있다고 보아 원자폭탄 개발에 불참한 하이젠베르크와, 진리를 공표할 책임만 인정한 오펜하이머.' },
{ s:'weber',     t:'popper',   type:'비교', label:'과학과 가치 — 연구주제 선정 단계에 가치가 개입됨을 지적한 베버와, 정당화의 맥락에서 반증으로만 이론을 걸러내는 포퍼.' },
{ s:'popper',    t:'bacon',    type:'비판', label:'귀납주의 비판 — 반증을 견뎌낸 이론도 참이 아니라 잠재적으로 참일 뿐이며, 반증 가능성이 없는 이론은 애초에 과학이 아니다.' },
{ s:'popper',    t:'rawls',    type:'비교', label:'관용의 역설 — 불관용자에게 무제한의 관용을 베풀면 관용이 소멸한다(포퍼). 롤스는 권력 장악을 지향하지 않는 불관용 집단은 관용해야 한다고 본다.' },
{ s:'popper',    t:'locke',    type:'유사', label:'관용 — 다른 견해를 가진 사람에게 관용을 베푸는 것이 이성에 부합한다는 로크의 원칙이, 관용의 한계를 묻는 포퍼의 역설로 이어진다.' },
{ s:'buddhism',  t:'taylor',   type:'유사', label:'모든 생명은 상호의존하며 그 자체로 존중받아야 한다 — 연기설의 일원론적 자연관과 생명중심주의의 만남.' },
{ s:'zhuangzi',  t:'naess',    type:'유사', label:'물아일체와 "큰 자아" — 나와 자연의 구분을 넘어설 때 비로소 자연을 도구로 보지 않게 된다.' },

/* ── 문화·예술·소비·종교 ───────────────────────────── */

{ s:'mozi',      t:'confucius',type:'대립', label:'예악 — 유교는 음악을 감정의 조화와 백성 교화의 수단으로 보지만, 묵자는 공리성이 없다며 비악(非樂)을 주장한다.' },
{ s:'aristotle', t:'tolstoy',  type:'유사', label:'예술 긍정의 계보 — 예술은 자연을 모방하며 자연이 성공하지 못한 것을 완성한다(아리스토텔레스), 예술은 감정을 전달해 사람을 결합한다(톨스토이).' },
{ s:'veblen',    t:'baudrillard', type:'유사', label:'소비는 구별 짓기다 — 과시적 소비로 지위를 드러내는가(베블런), 기호(이미지)를 소비해 "나는 너희와 다르다"를 표시하는가(보드리야르).' },

{ s:'simmel',    t:'baudrillard', type:'유사', label:'차별화 욕구 — 유행은 모방과 차별화를 동시에 만족시키고, 기호 소비는 차이 그 자체를 소비한다.' },
{ s:'marx',      t:'adorno',   type:'계승', label:'자본이 주체가 되어 대중의 욕망을 획일화한다는 문화산업 분석은 마르크스의 자본주의 비판을 문화의 영역으로 확장한 것이다.' },
{ s:'eliade',    t:'durkheim', type:'대립', label:'성과 속의 관계 — 성은 반드시 속을 통해 드러나므로 분리·단절되지 않는다(엘리아데) vs 성과 속은 뚜렷이 구분되며 상호배타적이다(뒤르켐).' },

{ s:'otto',      t:'tillich',  type:'유사', label:'종교 긍정 — 직관과 감정·체험으로 파악되는 것(오토), 인간 정신생활의 깊이의 차원이자 궁극적 관심(틸리히).' },
{ s:'eliade',    t:'otto',     type:'유사', label:'종교는 합리적 설명이 아니라 성스러움의 체험에서 이해되어야 한다.' },
{ s:'kung',      t:'confucius',type:'유사', label:'황금률 — "자기가 하기 싫은 일을 남에게 시키지 말라"(소극적)와 "남에게 대접받고 싶은 대로 남을 대접하라"(적극적)를 세계 윤리의 공통 기반으로 삼는다.' },

{ s:'fromm',     t:'kant',     type:'유사', label:'존경(respect)은 지배하거나 소유하는 것이 아니라 상대를 있는 그대로 보는 것 — 사람을 수단이 아니라 목적으로 대우하라는 원칙과 만난다.' },

{ s:'rawls',     t:'kant',     type:'유사', label:'전쟁관 — 질서 정연한 사회들 사이에는 전쟁이 일어나지 않으며, 공격 전쟁은 안 되지만 방어 전쟁은 가능하다.' },
{ s:'rawls',     t:'singer',   type:'대립', label:'해외원조 — 질서 정연한 사회가 고통받는 "사회"를 원조할 의무(국제주의, 차단점 있음) vs 절대 빈곤한 "개인"에 대한 원조 의무(세계시민주의, 이익 평등 고려).' },
{ s:'nozick',    t:'singer',   type:'대립', label:'해외원조 — 정당하게 취득한 재산의 처분은 개인의 자유이므로 자선은 선택이다(노직) vs 이익이 비용보다 크면 공동체 소속과 무관하게 원조해야 한다(싱어).' },
{ s:'nozick',    t:'kant',     type:'대립', label:'해외원조 — 원조의 도덕적 의무는 없고 자발적 자선만 가능하다(노직) vs 어려운 처지를 돕는 것은 사람을 목적으로 대우하는 보편적 의무다(칸트).' },
{ s:'beitz',     t:'pogge',    type:'유사', label:'세계시민주의 — 자원의 지리적 분포는 우연이므로 재분배해야 하고(자원 재분배 원칙), 국가 간 협력 체제가 있으므로 차등 원칙을 국제사회에 적용해야 한다(지구적 평등 원칙).' },
{ s:'beitz',     t:'rawls',    type:'비판', label:'차등 원칙을 국내에 가두어 둘 이유가 없다 — 국가 간 협력 체제가 형성되어 있으므로 국제사회에도 적용해야 한다.' },
{ s:'pogge',     t:'rawls',    type:'비판', label:'원조의 목적은 질서 정연한 사회의 달성이 아니라 최소수혜자의 복지 향상과 국가 간 불평등의 완화여야 한다.' },
{ s:'beitz',     t:'singer',   type:'비교', label:'둘 다 세계시민주의지만 원조의 근거가 다르다 — 자원 분포의 우연성과 지구적 차등 원칙(베이츠) vs 이익 평등 고려 원칙(싱어).' },
{ s:'galtung',   t:'niebuhr',  type:'비교', label:'평화의 조건 — 구조적 폭력의 제거를 말하는 갈퉁과, 집단 간 힘의 균형을 정의로 보고 국제정치를 항구적 무정부 상태로 보는 니부어.' },
{ s:'stoics',    t:'kant',     type:'계승', label:'세계시민주의 — 이성을 지닌 모든 인간이 평등하다는 전제가 세계시민법(방문권·환대권)으로 제도화된다.' }
];

/* ══════════════════════════════════════════════════════════════════
   관계도 엔진 — 외부 라이브러리 없음
   ══════════════════════════════════════════════════════════════════ */
const UNITS = [
  {n:1, r:'Ⅰ', name:'현대의 삶과 실천 윤리'},
  {n:2, r:'Ⅱ', name:'생명과 윤리'},
  {n:3, r:'Ⅲ', name:'사회와 윤리'},
  {n:4, r:'Ⅳ', name:'과학과 윤리'},
  {n:5, r:'Ⅴ', name:'문화와 윤리'},
  {n:6, r:'Ⅵ', name:'평화와 공존의 윤리'}
];
const UNIT_ROMAN = Object.fromEntries(UNITS.map(u => [u.n, u.r]));
const GROUP_LABEL = Object.fromEntries(GROUPS.map(g => [g.id, g.label]));
const NODE_BY_ID  = Object.fromEntries(NODES.map(n => [n.id, n]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const groupColor = g => css('--g-' + g);
const REL_VAR = { '계승':'--e-inherit', '비판':'--e-critique', '대립':'--e-oppose', '유사':'--e-similar', '비교':'--e-compare' };
const relColor = t => css(REL_VAR[t]);
const REL_DASH = { '계승':'none', '비판':'none', '대립':'none', '유사':'5 4', '비교':'1.5 4' };
const REL_WIDTH = { '계승':1.5, '비판':1.5, '대립':2.1, '유사':1.2, '비교':1.1 };

/* 학파별 배치 기준점 — 왼쪽 동양, 가운데 근대, 오른쪽 현대 */
const ANCHOR = {
  ru:[0.10,0.30], dao:[0.08,0.63], mofa:[0.23,0.12], bud:[0.19,0.86],
  anc:[0.34,0.46], mod:[0.50,0.78], norm:[0.53,0.40], just:[0.71,0.22],
  envi:[0.75,0.62], cult:[0.91,0.84], care:[0.90,0.33]
};

const W = 1660, H = 880;                    // 시뮬레이션 좌표계
const svg = document.getElementById('graph');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ── 상태 ────────────────────────────────────────────────────────── */
const state = {
  selected: null,
  units: new Set(UNITS.map(u => u.n)),
  groups: new Set(GROUPS.map(g => g.id)),
  rels: new Set(LINK_TYPES.map(t => t.id)),
  view: { x:0, y:0, k:1 }
};

/* ── 그래프 자료 구조 ────────────────────────────────────────────── */
const degree = {};
LINKS.forEach(l => { degree[l.s] = (degree[l.s]||0)+1; degree[l.t] = (degree[l.t]||0)+1; });

const sim = NODES.map((n, i) => {
  const [ax, ay] = ANCHOR[n.group];
  const seed = (i * 2.399963);                              // 황금각으로 초기 산포
  return {
    ...n, deg: degree[n.id] || 0,
    ax: ax * W, ay: ay * H,
    x: ax * W + Math.cos(seed) * 70, y: ay * H + Math.sin(seed) * 70,
    vx: 0, vy: 0, pinned: false, on: true
  };
});
const simById = Object.fromEntries(sim.map(n => [n.id, n]));
const edges = LINKS.map((l, i) => ({ ...l, i, sn: simById[l.s], tn: simById[l.t], on: true }));

const neighbours = {};
NODES.forEach(n => neighbours[n.id] = []);
edges.forEach(e => { neighbours[e.s].push(e); neighbours[e.t].push(e); });

const tablesOf = {};
NODES.forEach(n => tablesOf[n.id] = []);
TABLES.forEach(t => t.members.forEach(m => { if (tablesOf[m]) tablesOf[m].push(t); }));

const radius = n => 4.6 + Math.sqrt(n.deg) * 2.35;

/* ── SVG 레이어 ──────────────────────────────────────────────────── */
const defs  = el('defs');
const root  = el('g');
const gEdge = el('g', {'stroke-linecap':'round'});
const gHit  = el('g');
const gNode = el('g');
const gText = el('g');
root.append(gEdge, gHit, gNode, gText);
svg.append(defs, root);

/* 화살촉 — 관계 유형별로 색이 다르므로 유형마다 하나씩 */
function buildMarkers() {
  defs.textContent = '';
  LINK_TYPES.filter(t => t.dir || t.id === '대립').forEach(t => {
    ['end','start'].forEach(pos => {
      const m = el('marker', {
        id: `ar-${encodeURIComponent(t.id)}-${pos}`, viewBox:'0 0 10 10',
        refX: pos === 'end' ? 9 : 1, refY:5, markerWidth:5, markerHeight:5,
        orient: pos === 'end' ? 'auto' : 'auto-start-reverse', markerUnits:'strokeWidth'
      });
      m.append(el('path', { d:'M0,1.4 L9,5 L0,8.6 z', fill: relColor(t.id) }));
      defs.append(m);
    });
  });
}

const nodeEls = {}, edgeEls = {}, hitEls = {}, textEls = {};

sim.forEach(n => {
  const g = el('g', { class:'node-dot', tabindex:'0', role:'button' });
  g.setAttribute('aria-label', `${n.name} — ${n.school}`);

  g.append(halo, dot);
  g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id); } });
  g.addEventListener('focus', () => hoverNode(n.id));
  g.addEventListener('blur', () => hoverNode(null));
  g.addEventListener('pointerenter', () => hoverNode(n.id));
  g.addEventListener('pointerleave', () => hoverNode(null));
  gNode.append(g);
  nodeEls[n.id] = { g, dot, halo };

  const t = el('text', { class:'node-label', 'text-anchor':'middle' });
  t.textContent = n.name;
  gText.append(t);
  textEls[n.id] = t;
});

edges.forEach(e => {
  const p = el('path', { class:'edge' });
  gEdge.append(p);
  edgeEls[e.i] = p;
  const h = el('path', { class:'edge-hit' });
  h.__edge = e;
  h.addEventListener('pointerenter', ev => showEdgeTip(e, ev));
  h.addEventListener('pointermove', ev => moveEdgeTip(ev));
  h.addEventListener('pointerleave', hideEdgeTip);
  gHit.append(h);
  hitEls[e.i] = h;
});

function styleEdges() {
  edges.forEach(e => {
    const p = edgeEls[e.i], c = relColor(e.type);
    p.setAttribute('stroke', c);
    p.setAttribute('stroke-width', REL_WIDTH[e.type]);
    p.setAttribute('stroke-dasharray', REL_DASH[e.type]);
    const id = encodeURIComponent(e.type);
    p.removeAttribute('marker-end'); p.removeAttribute('marker-start');
    if (e.type === '계승' || e.type === '비판') p.setAttribute('marker-end', `url(#ar-${id}-end)`);
    if (e.type === '대립') { p.setAttribute('marker-end', `url(#ar-${id}-end)`); p.setAttribute('marker-start', `url(#ar-${id}-start)`); }
  });
}
function styleNodes() {
  sim.forEach(n => {
    const c = groupColor(n.group);
    nodeEls[n.id].dot.setAttribute('fill', c);
    nodeEls[n.id].dot.setAttribute('stroke', css('--paper'));
    nodeEls[n.id].dot.setAttribute('stroke-width', 1.5);
    nodeEls[n.id].halo.setAttribute('stroke', c);
    textEls[n.id].classList.toggle('lg', n.deg >= 8);
  });
}

/* ── 힘 시뮬레이션 ───────────────────────────────────────────────── */
let alpha = 1, running = false, rafId = 0;
const REST = { '계승':112, '비판':126, '대립':134, '유사':150, '비교':158 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function tick() {
  const live = sim.filter(n => n.on);
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) { dx = (Math.random()-.5); dy = (Math.random()-.5); d2 = 1; }
      const d = Math.sqrt(d2);
      const rep = Math.min(3000 / d2, 26);
      const fx = dx / d * rep, fy = dy / d * rep;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      const minD = radius(a) + radius(b) + 36;      // 라벨 겹침 방지용 최소 간격
      if (d < minD) {
        const push = (minD - d) * 0.28;
        a.vx -= dx / d * push; a.vy -= dy / d * push;
        b.vx += dx / d * push; b.vy += dy / d * push;
      }
    }
  }
  edges.forEach(e => {
    if (!e.on || !e.sn.on || !e.tn.on) return;
    const dx = e.tn.x - e.sn.x, dy = e.tn.y - e.sn.y;
    const d = Math.hypot(dx, dy) || 1;
    const rest = REST[e.type] * (e.sn.group === e.tn.group ? 0.72 : 1.18);
    const f = (d - rest) * 0.016;
    const fx = dx / d * f, fy = dy / d * f;
    e.sn.vx += fx; e.sn.vy += fy; e.tn.vx -= fx; e.tn.vy -= fy;
  });
  live.forEach(n => {
    n.vx += (n.ax - n.x) * 0.020;                  // 학파 기준점으로 끌어당김
    n.vy += (n.ay - n.y) * 0.020;
    n.vx += (W/2 - n.x) * 0.0016;
    n.vy += (H/2 - n.y) * 0.0016;
    if (n.pinned) { n.vx = n.vy = 0; return; }
    n.vx *= 0.80; n.vy *= 0.80;
    n.x += n.vx * alpha; n.y += n.vy * alpha;
    n.x = Math.max(40, Math.min(W - 40, n.x));
    n.y = Math.max(30, Math.min(H - 30, n.y));
  });
}

function render() {
  sim.forEach(n => {
    const { g } = nodeEls[n.id];
    g.setAttribute('transform', `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    const t = textEls[n.id];
    t.setAttribute('x', n.x.toFixed(1));
    t.setAttribute('y', (n.y + radius(n) + 12.5).toFixed(1));
  });
  edges.forEach(e => {
    const a = e.sn, b = e.tn;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    const w = REL_WIDTH[e.type];
    const pad = 2.5 / w;                            // 화살촉이 원에 닿지 않도록
    const x1 = a.x + ux * (radius(a) + (e.type === '대립' ? w * 2.6 : 1.5) + pad);
    const y1 = a.y + uy * (radius(a) + (e.type === '대립' ? w * 2.6 : 1.5) + pad);
    const arrow = (e.type === '계승' || e.type === '비판' || e.type === '대립') ? w * 2.6 : 1.5;
    const x2 = b.x - ux * (radius(b) + arrow + pad);
    const y2 = b.y - uy * (radius(b) + arrow + pad);
    const bend = e.twin ? 0.13 : 0.055;             // 같은 쌍의 두 관계는 더 벌린다
    const mx = (x1+x2)/2 - uy * d * bend, my = (y1+y2)/2 + ux * d * bend;
    const path = `M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
    edgeEls[e.i].setAttribute('d', path);
    hitEls[e.i].setAttribute('d', path);
  });
}

/* 같은 쌍에 두 개 이상의 관계가 있으면 곡률을 키워 겹치지 않게 한다 */
(() => {
  const seen = {};
  edges.forEach(e => { const k = [e.s, e.t].sort().join('|'); seen[k] = (seen[k]||0) + 1; });
  edges.forEach(e => { if (seen[[e.s, e.t].sort().join('|')] > 1) e.twin = true; });
})();

function loop() {
  tick(); render();
  alpha *= 0.985;
  if (alpha > 0.012) rafId = requestAnimationFrame(loop);
  else { running = false; alpha = 0.012; }
}
function kick(a = 0.75) {
  alpha = Math.max(alpha, a);
  if (!running) { running = true; rafId = requestAnimationFrame(loop); }
}
function settle(n) { for (let i = 0; i < n; i++) { alpha = 1; tick(); } alpha = 0.012; render(); }

/* ── 시야 변환 ───────────────────────────────────────────────────── */
function applyView() {
  const { x, y, k } = state.view;
  root.setAttribute('transform', `translate(${x},${y}) scale(${k})`);
  labelDensity();
}
/* 많이 축소했을 때는 이름표가 뭉개지므로 관계가 많은 사상가만 남긴다 */
let lastMinDeg = -1;
function labelDensity() {
  const k = state.view.k;
  const minDeg = k >= 0.5 ? 0 : (k >= 0.32 ? 4 : 8);
  if (minDeg === lastMinDeg) return;
  lastMinDeg = minDeg;
  sim.forEach(n => textEls[n.id].classList.toggle('lbl-off', n.deg < minDeg));
}
function fit(pad = 48) {
  const live = sim.filter(n => n.on);
  if (!live.length) return;
  const box = svg.getBoundingClientRect();
  const lg = document.querySelector('.legend');
  const insetB = (lg ? lg.getBoundingClientRect().height : 0) + 12;   // 범례 띠
  const insetT = 44;                                                  // 확대·축소 단추
  const insetL = 14, insetR = 14;
  const availW = Math.max(120, box.width - insetL - insetR);
  const availH = Math.max(120, box.height - insetT - insetB);
  const xs = live.map(n => n.x), ys = live.map(n => n.y);
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad + 14;
  const k = Math.min(availW / (x1-x0), availH / (y1-y0), 2.2);
  state.view = {
    k,
    x: insetL + (availW - (x1-x0)*k)/2 - x0*k,
    y: insetT + (availH - (y1-y0)*k)/2 - y0*k
  };
  applyView();
}
function zoomBy(f, cx, cy) {
  const box = svg.getBoundingClientRect();
  cx = cx ?? box.width/2; cy = cy ?? box.height/2;
  const k = Math.max(0.28, Math.min(4, state.view.k * f));
  const r = k / state.view.k;
  state.view.x = cx - (cx - state.view.x) * r;
  state.view.y = cy - (cy - state.view.y) * r;
  state.view.k = k;
  applyView();
}
const toSim = (cx, cy) => {
  const box = svg.getBoundingClientRect();
  return { x: (cx - box.left - state.view.x) / state.view.k, y: (cy - box.top - state.view.y) / state.view.k };
};

/* ── 팬·줌·드래그 ───────────────────────────────────────────────── */
/* 포인터 캡처가 click 이벤트를 SVG로 되돌리므로 선택·해제를 pointerup에서 직접 판정한다 */
let drag = null, lastTap = { id:null, at:0 };
sim.forEach(n => { nodeEls[n.id].g.__node = n; });

svg.addEventListener('pointerdown', ev => {
  const hitNode = ev.target.closest('.node-dot');
  const hitEdge = ev.target.closest('.edge-hit');
  if (hitNode) {
    const n = hitNode.__node;
    const now = performance.now();
    if (lastTap.id === n.id && now - lastTap.at < 380) { n.pinned = false; lastTap = { id:null, at:0 }; kick(); }
    else { lastTap = { id:n.id, at:now }; n.pinned = true; }
    drag = { kind:'node', n, sx: ev.clientX, sy: ev.clientY, moved:false };
  } else if (hitEdge) {
    drag = { kind:'edge', e: hitEdge.__edge, sx: ev.clientX, sy: ev.clientY, moved:false };
  } else {
    drag = { kind:'pan', sx: ev.clientX, sy: ev.clientY, ox: state.view.x, oy: state.view.y, moved:false };
    svg.classList.add('dragging');
  }
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (drag.kind === 'node') {
    if (!drag.moved) return;
    const p = toSim(ev.clientX, ev.clientY);
    drag.n.x = p.x; drag.n.y = p.y; drag.n.vx = drag.n.vy = 0;
    hideEdgeTip(); kick(0.5);
  } else if (drag.kind === 'pan') {
    state.view.x = drag.ox + dx; state.view.y = drag.oy + dy;
    applyView();
  }
});
svg.addEventListener('pointerup', ev => {
  if (drag && !drag.moved) {
    if (drag.kind === 'node') select(drag.n.id);
    else if (drag.kind === 'edge') select(drag.e.s);
    else select(null);
  }
  drag = null; svg.classList.remove('dragging');
  try { svg.releasePointerCapture(ev.pointerId); } catch {}
});
svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('dragging'); });
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  zoomBy(ev.deltaY < 0 ? 1.12 : 1/1.12, ev.clientX - box.left, ev.clientY - box.top);
}, { passive:false });
document.getElementById('zin').onclick  = () => zoomBy(1.25);
document.getElementById('zout').onclick = () => zoomBy(1/1.25);
document.getElementById('zfit').onclick = () => fit();

/* ── 간선 말풍선 ────────────────────────────────────────────────── */
const etip = document.getElementById('etip');
function showEdgeTip(e, ev) {
  if (!e.on || !e.sn.on || !e.tn.on) return;
  const c = relColor(e.type);
  const dirMark = (e.type === '계승' || e.type === '비판') ? '→' : '↔';
  etip.innerHTML = `<div class="eh"><b>${esc(e.sn.name)}</b><span style="color:${c}">${dirMark}</span><b>${esc(e.tn.name)}</b>
    <span class="rel" style="color:${c}">${esc(e.type)}</span></div>${esc(e.label)}`;
  etip.classList.add('on');
  moveEdgeTip(ev);
}
function moveEdgeTip(ev) {
  const box = svg.parentElement.getBoundingClientRect();
  const w = etip.offsetWidth, h = etip.offsetHeight;
  let x = ev.clientX - box.left + 16, y = ev.clientY - box.top + 16;
  if (x + w > box.width - 8) x = ev.clientX - box.left - w - 16;
  if (y + h > box.height - 8) y = ev.clientY - box.top - h - 16;
  etip.style.left = Math.max(8, x) + 'px';
  etip.style.top  = Math.max(8, y) + 'px';
}
function hideEdgeTip() { etip.classList.remove('on'); }

/* ── 강조 ────────────────────────────────────────────────────────── */
function hoverNode(id) {
  if (state.selected) return;
  paintFocus(id);
}
function paintFocus(id) {
  if (!id) {
    sim.forEach(n => nodeEls[n.id].g.classList.remove('dim'));
    sim.forEach(n => textEls[n.id].classList.remove('dim'));
    edges.forEach(e => edgeEls[e.i].classList.remove('dim'));
    edges.forEach(e => edgeEls[e.i].setAttribute('stroke-opacity', .42));
    sim.forEach(n => nodeEls[n.id].halo.setAttribute('stroke-width', 0));
    return;
  }
  const near = new Set([id]);
  neighbours[id].forEach(e => { near.add(e.s); near.add(e.t); });
  sim.forEach(n => {
    const on = near.has(n.id);
    nodeEls[n.id].g.classList.toggle('dim', !on);
    textEls[n.id].classList.toggle('dim', !on);
    nodeEls[n.id].halo.setAttribute('stroke-width', n.id === id ? 2 : 0);
  });
  edges.forEach(e => {
    const on = e.s === id || e.t === id;
    edgeEls[e.i].classList.toggle('dim', !on);
    edgeEls[e.i].setAttribute('stroke-opacity', on ? 1 : .42);
  });
}

/* ── 필터 ────────────────────────────────────────────────────────── */
function applyFilters() {
  sim.forEach(n => {
    n.on = state.groups.has(n.group) && n.units.some(u => state.units.has(u));
    nodeEls[n.id].g.classList.toggle('hidden', !n.on);
    textEls[n.id].classList.toggle('hidden', !n.on);
  });
  edges.forEach(e => {
    e.on = state.rels.has(e.type) && e.sn.on && e.tn.on;
    edgeEls[e.i].classList.toggle('hidden', !e.on);
    hitEls[e.i].classList.toggle('hidden', !e.on);
  });
  document.getElementById('tally-n').textContent = sim.filter(n => n.on).length;
  document.getElementById('tally-l').textContent = edges.filter(e => e.on).length;
  document.getElementById('tally-t').textContent = TABLES.length;
  if (state.selected && !simById[state.selected].on) select(null);
  kick(0.6);
}

function buildFilters() {
  const uf = document.getElementById('unit-filters');
  UNITS.forEach(u => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip unit'; b.setAttribute('aria-pressed','true');
    b.textContent = u.r; b.title = `대단원 ${u.r} ${u.name}`;
    b.onclick = () => {
      state.units.has(u.n) ? state.units.delete(u.n) : state.units.add(u.n);
      b.setAttribute('aria-pressed', String(state.units.has(u.n)));
      applyFilters();
    };
    uf.append(b);
  });
  const rf = document.getElementById('rel-filters');
  LINK_TYPES.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip rel'; b.setAttribute('aria-pressed','true'); b.title = t.desc;
    b.innerHTML = `<span class="swatch" style="background:${relColor(t.id)}"></span>${esc(t.id)}`;
    b.onclick = () => {
      state.rels.has(t.id) ? state.rels.delete(t.id) : state.rels.add(t.id);
      b.setAttribute('aria-pressed', String(state.rels.has(t.id)));
      applyFilters();
    };
    rf.append(b);
  });
  const gf = document.getElementById('group-filters');
  GROUPS.forEach(g => {
    const count = NODES.filter(n => n.group === g.id).length;
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-pressed','true');
    b.title = `${g.label} ${count}인 — 켜고 끄기`;
    b.innerHTML = `<span class="k" style="background:${groupColor(g.id)}"></span><span>${esc(g.label)}</span><span class="n">${count}</span>`;
    b.onclick = () => {
      state.groups.has(g.id) ? state.groups.delete(g.id) : state.groups.add(g.id);
      b.setAttribute('aria-pressed', String(state.groups.has(g.id)));
      applyFilters();
    };
    gf.append(b);
  });
}
document.getElementById('reset').onclick = () => {
  state.units = new Set(UNITS.map(u => u.n));
  state.groups = new Set(GROUPS.map(g => g.id));
  state.rels = new Set(LINK_TYPES.map(t => t.id));
  document.querySelectorAll('.chip.unit, .chip.rel, #group-filters button')
    .forEach(b => b.setAttribute('aria-pressed','true'));
  select(null); applyFilters(); fit();
};

/* ── 상세 패널 ───────────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const panel = document.getElementById('panel');

function select(id) {
  state.selected = id;
  paintFocus(id);
  panel.scrollTop = 0;
  panel.parentElement.scrollTop = 0;
  if (!id) { renderIntro(); return; }
  renderNode(simById[id]);
  const n = simById[id];
  const box = svg.getBoundingClientRect();
  const sx = n.x * state.view.k + state.view.x, sy = n.y * state.view.k + state.view.y;
  if (sx < 30 || sy < 30 || sx > box.width - 30 || sy > box.height - 30) {
    state.view.x += box.width/2 - sx;
    state.view.y += box.height/2 - sy;
    applyView();
  }
}

function renderNode(n) {
  const c = groupColor(n.group);
  const byType = {};
  neighbours[n.id].filter(e => e.on).forEach(e => (byType[e.type] ||= []).push(e));
  const relHtml = LINK_TYPES.filter(t => byType[t.id]).map(t => {
    const col = relColor(t.id);
    const items = byType[t.id].map(e => {
      const other = e.s === n.id ? e.tn : e.sn;
      const flow = `${esc(e.sn.name)} ${t.dir ? '→' : '↔'} ${esc(e.tn.name)}`;
      return `<button type="button" class="rel-item" data-go="${esc(other.id)}" style="border-left-color:${col}">
        <span class="who">${esc(other.name)}<span class="arrow">${flow}</span></span>
        <span class="why">${esc(e.label)}</span></button>`;
    }).join('');
    return `<div class="relgrp"><h4 style="color:${col}">
        <span class="bar" style="border-top-color:${col}; border-top-style:${t.id==='유사'?'dashed':(t.id==='비교'?'dotted':'solid')}"></span>
        ${esc(t.id)} <span class="cnt">${byType[t.id].length}</span></h4>${items}</div>`;
  }).join('');

  const tbs = tablesOf[n.id];
  const tblHtml = tbs.length ? `<div class="sechead">원문 비교표</div><div class="tbtns">${
    tbs.map(t => `<button type="button" class="tbtn" data-table="${esc(t.id)}">
      <span class="ti">표</span>${esc(t.title)}<span class="tu">${UNIT_ROMAN[t.unit]}</span></button>`).join('')}</div>` : '';

  panel.innerHTML = `
    <div class="ph"><span class="mark" style="background:${c}"></span>
      <h2>${esc(n.name)}<span class="orig">${esc(n.sub)}</span></h2></div>
    <div class="badges">
      <span class="badge school" style="color:${c}">${esc(n.school)}</span>
      ${GROUP_LABEL[n.group] === n.school ? '' : `<span class="badge">${esc(GROUP_LABEL[n.group])}</span>`}
      ${n.units.map(u => `<span class="badge unit" title="${esc(UNITS.find(x=>x.n===u).name)}">대단원 ${UNIT_ROMAN[u]}</span>`).join('')}
      <span class="badge unit" title="이 사상가가 맺은 전체 관계 수">관계 ${n.deg}</span>
    </div>
    <p class="tagline">${esc(n.tagline)}</p>
    <div class="sechead">핵심 주장</div>
    <ol class="core">${n.core.map(c2 => `<li>${esc(c2)}</li>`).join('')}</ol>
    ${relHtml ? `<div class="sechead">관계 ${neighbours[n.id].filter(e=>e.on).length}</div><div class="rels">${relHtml}</div>` : ''}
    ${tblHtml}`;

  panel.querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go));
  panel.querySelectorAll('[data-table]').forEach(b => b.onclick = () => openTable(b.dataset.table));
}

function renderIntro() {
  const hubs = [...sim].sort((a,b) => b.deg - a.deg).slice(0, 8);
  const key = LINK_TYPES.map(t => {
    const col = relColor(t.id), w = REL_WIDTH[t.id];
    const headed = t.id === '계승' || t.id === '비판' || t.id === '대립';
    const x0 = t.id === '대립' ? 6 : 0, x1 = headed ? 34 : 40;
    const head  = headed ? `<path d="M36,5.6 L40,8 L36,10.4 z" fill="${col}"/>` : '';
    const start = t.id === '대립' ? `<path d="M4,5.6 L0,8 L4,10.4 z" fill="${col}"/>` : '';
    return `<div><svg viewBox="0 0 40 16" aria-hidden="true">
        <path d="M${x0},8 L${x1},8" stroke="${col}" stroke-width="${w}" stroke-dasharray="${REL_DASH[t.id]}" fill="none"/>
        ${head}${start}</svg>
      <span><b style="color:${col}">${esc(t.id)}</b> — ${esc(t.desc)}</span></div>`;
  }).join('');

  panel.innerHTML = `
    <div class="intro">
      <p class="lead">한 권의 개념서를 순서대로 읽으면 사상가들은 각자의 단원에 갇혀 있다. 여기서는 그 선을 걷어내고, 누가 누구를 이어받고 누구를 겨냥했는지만 남겼다.</p>
      <div class="sechead">읽는 법</div>
      <div class="keymap">${key}</div>
      <div class="sechead">쓰는 법</div>
      <p>점을 <b>클릭</b>하면 핵심 주장과 그 사상가의 모든 관계가 이 자리에 펼쳐진다. 선 위에 <b>커서를 올리면</b> 두 사상가가 어떤 지점에서 만나고 갈라지는지가 뜬다.
      점은 <b>끌어서</b> 고정할 수 있고(고정 해제는 더블클릭), 배경을 끌면 화면이 움직이며 휠로 확대·축소된다.</p>
      <p>위쪽 막대에서 <b>대단원</b>과 <b>관계 유형</b>을, 도표 아래 띠에서 <b>학파</b>를 껐다 켤 수 있다. 점의 크기는 그 사상가가 맺은 관계의 수다.</p>
      <div class="sechead">가장 많이 얽힌 사상가</div>
      <div class="hubs">${hubs.map(n => `<button type="button" data-go="${esc(n.id)}">${esc(n.name)}<span class="d">${n.deg}</span></button>`).join('')}</div>
      <div class="sechead">출처</div>
      <p style="font-size:.76rem; color:var(--ink-3)">『생활과 윤리 전 범위 압축 요약본』 — 2027학년도 코드원 생활과 윤리 개념서, 대단원 Ⅰ~Ⅵ. 사상가 ${NODES.length}인, 관계 ${LINKS.length}건, 원문 비교표 ${TABLES.length}종을 옮겼다.</p>
    </div>`;
  panel.querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go));
}

/* ── 비교표 모달 ────────────────────────────────────────────────── */
const scrim = document.getElementById('scrim');
function openTable(id) {
  const t = TABLES.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modal-title').textContent = t.title;
  document.getElementById('modal-unit').textContent = `대단원 ${UNIT_ROMAN[t.unit]}`;
  const mem = document.getElementById('modal-members');
  mem.innerHTML = t.members.map(m => `<button type="button" data-go="${esc(m)}">${esc(NODE_BY_ID[m].name)}</button>`).join('');
  mem.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { closeTable(); select(b.dataset.go); });
  document.getElementById('modal-table').innerHTML =
    `<thead><tr>${t.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead>
     <tbody>${t.rows.map(r => `<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  scrim.classList.add('on');
  document.getElementById('modal-close').focus();
}
function closeTable() { scrim.classList.remove('on'); }
document.getElementById('modal-close').onclick = closeTable;
scrim.addEventListener('click', ev => { if (ev.target === scrim) closeTable(); });

/* ── 검색 ────────────────────────────────────────────────────────── */
const qi = document.getElementById('q'), hits = document.getElementById('hits');
const HAYSTACK = NODES.map(n => ({
  id: n.id,
  text: [n.name, n.sub, n.school, GROUP_LABEL[n.group], n.tagline, ...n.core].join(' ').toLowerCase()
}));
let cursor = -1;

function runSearch() {
  const q = qi.value.trim().toLowerCase();
  if (!q) { hits.classList.remove('on'); qi.setAttribute('aria-expanded','false'); return; }
  const found = HAYSTACK
    .map(h => {
      const n = NODE_BY_ID[h.id];
      let score = 0;
      if (n.name.toLowerCase().startsWith(q)) score = 3;
      else if (n.name.toLowerCase().includes(q)) score = 2;
      else if (h.text.includes(q)) score = 1;
      return { n, score };
    })
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score || b.n.deg - a.n.deg)
    .slice(0, 12);
  cursor = -1;
  if (!found.length) {
    hits.innerHTML = `<button type="button" disabled style="color:var(--ink-3);cursor:default">일치하는 사상가가 없습니다</button>`;
  } else {
    hits.innerHTML = found.map(r =>
      `<button type="button" role="option" aria-selected="false" data-go="${esc(r.n.id)}">
         <span class="hn" style="color:${groupColor(r.n.group)}">${esc(r.n.name)}</span>
         <span class="hs">${esc(r.n.school)} · 대단원 ${r.n.units.map(u => UNIT_ROMAN[u]).join('·')}</span></button>`).join('');
    hits.querySelectorAll('[data-go]').forEach(b => b.onclick = () => pick(b.dataset.go));
  }
  hits.classList.add('on');
  qi.setAttribute('aria-expanded','true');
}
function pick(id) {
  hits.classList.remove('on'); qi.setAttribute('aria-expanded','false'); qi.value = '';
  const n = simById[id];
  if (!n.on) {                       // 필터에 가려져 있으면 되살린다
    state.groups.add(n.group);
    n.units.forEach(u => state.units.add(u));
    document.querySelectorAll('.chip.unit, #group-filters button').forEach(b => b.setAttribute('aria-pressed','true'));
    applyFilters();
  }
  select(id);
}
qi.addEventListener('input', runSearch);
qi.addEventListener('keydown', ev => {
  const opts = [...hits.querySelectorAll('[data-go]')];
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    if (!opts.length) return;
    ev.preventDefault();
    cursor = (cursor + (ev.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.setAttribute('aria-selected', String(i === cursor)));
    opts[cursor].scrollIntoView({ block:'nearest' });
  } else if (ev.key === 'Enter') {
    if (opts.length) { ev.preventDefault(); pick(opts[Math.max(0, cursor)].dataset.go); }
  } else if (ev.key === 'Escape') {
    hits.classList.remove('on'); qi.setAttribute('aria-expanded','false'); qi.blur();
  }
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.search')) { hits.classList.remove('on'); qi.setAttribute('aria-expanded','false'); }
});

/* ── 키보드 ──────────────────────────────────────────────────────── */
document.addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA)$/.test(ev.target.tagName);
  if (ev.key === '/' && !typing) { ev.preventDefault(); qi.focus(); qi.select(); }
  else if (ev.key === 'Escape') {
    if (scrim.classList.contains('on')) closeTable();
    else if (state.selected) select(null);
  }
});

/* ── 시작 ────────────────────────────────────────────────────────── */
function repaintTheme() { buildMarkers(); styleNodes(); styleEdges(); paintFocus(state.selected); }

function init() {
  buildMarkers(); styleNodes(); styleEdges();
  buildFilters();
  applyFilters();
  settle(reduceMotion ? 900 : 520);
  if (!reduceMotion) kick(0.45);
  fit();
  renderIntro();
  paintFocus(null);
}
init();

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => fit(), 180); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(repaintTheme, 40));
new MutationObserver(() => repaintTheme())
  .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
</script>
